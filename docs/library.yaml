# How the GUI's documentation library (Learn & diagnose → Documentation
# library) groups the docs.  Sections appear in this order; pages within a
# section in the order listed.  Markdown files not listed here still appear,
# under "Other documents", so nothing is hidden.  Titles come from each
# page's first "# " heading unless a title is given here.
sections:
