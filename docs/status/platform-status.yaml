    result: '2026-10-12 claude: mecanum drives, arcs, spins and strafes in all four
      backends (strafe 0.254-0.282 of 0.3 m/s in MuJoCo/PyBullet/Gazebo, 0.142 in
      Isaac where roller grip is lower). Earlier PyBullet SLAM/lateral evidence retained.
      2026-10-13 claude: mecanum obstacle missions pass in PyBullet, Gazebo and Isaac;
      MuJoCo was aborted while aligning at the goal (0.03-0.09 m away); with the 4WS
      arrival window (f36bc5e) the round-3 rerun passes in all four backends (0.035-0.108
      m). Freeing the 60 Isaac rollers from the importer''s joint drives (42d1ccb),
      then giving them the URDF damping in USD''s per-degree units (6a88bce, a84ab0c),
      did not help the Isaac strafe (0.119, 0.148 m/s). A roller spin probe (scripts/roller_spin_probe.py)
      shows the Isaac hubs at the ideal 6.0 rad/s but the contact rollers at 41-57%
      of the ideal 67 rad/s (MuJoCo 95-97%), so the rollers are resisted or slip;
      32/8 solver iterations and a 2 mm roller contact offset (175fa1c, cdcb01c) leave
      the strafe at 0.148-0.167 m/s with rollers at about half rate, though with less
      forward drift; the obstacle mission still passes. Cause found: PhysX rolled
      each roller''s 12-sided convex hull facet by facet; with analytic capsule roller
      collisions (e0e496e) a roller spin probe gives a 0.293 m/s strafe for 0.3 commanded,
      rollers at 104-118% of the ideal rate and 0.002 m/s forward drift (MuJoCo 0.251).
      The full drive check strafes at 0.290 m/s with every other phase unchanged,
      and the obstacle mission passes (0.08/0.04 m). Isaac lateral shortfall closed.
      2026-10-15 claude: slam mapping on wheel odometry around a 26 m loop holds 1.1-2.5
      cm in all four backends, every map wall on a reference wall (docs/status/evidence/p7-legged-slam-mapping-2026-10-13/wheels).'
