          the full model rejects a pitch+roll nudge. (c) BALANCE SIGN re-validated
          at 250 Hz with the exact target-shift law: perturbed-stance max tilt 0.008
          rad (committed +K) vs 0.129 rad (sign flipped) vs 0.014 rad (no reaction)
