        next_action: "2026-10-13 claude: implemented, experimental. robot_lab_algorithms.perception (45e8ecc): the obstacle detector, Euclidean clustering and DBSCAN use KD-tree neighbourhoods instead of O(N^2) Python (same results on the 38 earlier tests); the scan clusterer has Borges-Aldon adaptive breakpoints (node parameter adaptive); RANSAC ground removal keeps near-horizontal hypotheses, counts inliers vectorised with a seeded RNG and refits by least squares. Benchmark on seeded synthetic scenes (docs/status/evidence/r72-perception-benchmark-2026-10-13, tutorial docs/tutorials/perception_comparison.md): laser obstacle detection precision 0.77-0.86 (adaptive breakpoints best), recall 0.99-1.0; ground recall 0.43 for the 0.1 m height threshold on a 2 deg floor vs 1.0 for RANSAC (38 ms); Euclidean and DBSCAN found 80/80 boxes. Live 2D-laser runs on recorded Gazebo and MuJoCo /scan (docs/status/evidence/r72-perception-benchmark-2026-10-13/live, scripts/r7_2_live_scan_replay.py), splitting maze wall corners with a map ray-cast as truth (0.010 m median): single-linkage obstacle detector and fixed scan clusterer lead (F1 0.66-0.67, precision 0.85, recall 0.54) while adaptive breakpoints and DBSCAN/Euclidean fragment the walls (F1 0.18-0.32); fixed scan clusterer is cheapest (0.33 ms). Depth clouds on simulator data (2026-10-15 claude, docs/status/evidence/r72-perception-benchmark-2026-10-13/depth-live, scripts/r7_2_depth_live.py, live Gazebo RGB-D during a 26 m drive, 53 clouds): the cloud nodes segmented in the camera's optical frame, where the height threshold found no ground and RANSAC 3% (precision 0.12); they now move clouds into target_frame base_footprint first (cdb8b34), giving precision/recall 0.972/0.999 (height, 2 ms) and 0.987/1.000 (RANSAC, 43 ms); Euclidean clustering found 100/138 visible object views, DBSCAN 86/138. 2026-10-15 claude (later): the three cataloged ids are implemented, experimental, and run through the dispatch. depth_image_to_pointcloud (ee85db4, pinhole back-projection): live beside the 26 m drive in Gazebo, MuJoCo, PyBullet and Isaac (docs/status/evidence/r72-perception-benchmark-2026-10-13/depth-node), 3.3-6.6 ms per cloud; ground removal and clustering on its cloud score as on Gazebo's own (height 0.95-0.97/1.00, RANSAC 0.98/1.00), the first depth-cloud scores for MuJoCo, PyBullet and Isaac. It equals Gazebo's own cloud (2 um) once the principal point is at the pixel centres (159.5, 119.5); the simulators' camera info said (160, 120), lifting floors 2.25 mm per metre of depth, so robot_lab_utils.camera_model now publishes the pixel-centre point for MuJoCo/PyBullet/Isaac (8ac644b; Gazebo's comes from gz-sensors). MuJoCo and PyBullet keep a further 1.5-2 mm/m lift (cause open). feature_detection (c16139b, a691fae): feature-based RGB-D visual odometry with ORB, AKAZE, BRISK, SIFT or Shi-Tomasi features (docs/status/evidence/r72-perception-benchmark-2026-10-13/feature-odometry): replays of recorded drives fail for every detector in the flat-shaded nav_obstacle world in all four simulators; in Gazebo small_house ORB at 30 Hz holds 0.54 m RMSE and 2.9% drift over 28.4 m (the live node's output scores the same) and BRISK is best at 5 Hz (1.18 m); MuJoCo renders the house untextured and dim and Isaac's RGB carries per-pixel noise, so visual methods fail there. camera_calibration (a691fae, eae5809, f550534, chessboard, plumb_bob or pinhole): scripts/r7_2_calibration_check.sh moves a spawned board through 100 poses in Gazebo; 73 views put the principal point within 0.13 px of the pixel centres and fx 0.7% short (the calibration's own error on aliased 320x240 frames; docs/status/evidence/r72-perception-benchmark-2026-10-13/calibration). Remaining: textured worlds and RGB quality in MuJoCo and Isaac (backend owners), the MuJoCo/PyBullet residual floor lift, calibration outside Gazebo."
