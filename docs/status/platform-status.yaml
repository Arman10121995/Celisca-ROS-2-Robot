    owner: "claude"
    result: "2026-10-12 claude: 32/32 Celisca missions pass (MuJoCo, PyBullet, Gazebo, Isaac x Labbot, Bumperbot x plain/furnished floors 1-2): detour goal, cancel/stop <= 0.40 sim s, resume, near-obstacle goal; truth error median 0.069/0.054 m, max 0.139 m, heading <= 3.0 deg. Causes fixed: furnished maps lacked furniture (furnish_occupancy_map.py, scan endpoints within one cell), floor-1 furnished start 0.23 m from furniture, Bumperbot radius 0.10 < 0.118 m, DWB stopping at a wall end (recorded /evaluation; Labbot/Bumperbot now default to Regulated Pure Pursuit with 0.55 m inflation, DWB selectable), Harmonic discovery spam in Gazebo runs. Earlier 20% scale, spawns and hospital results retained. One seeded mission per cell; repeats and other maps continue under R6."
    evidence: "docs/status/evidence/p3-celisca-missions-2026-10-12/README.md"
  P4:
    title: "MuJoCo performance with correct control timing"
    state: partial
    owner: "claude"
    result: "2026-10-12 claude: static-world midphase disabled above 5000 flex elements (identical contacts), 1000-triangle flex pieces, 200-triangle ray proxies and one mj_multiRay per scan. Captured hospital step 10.55 -> 4.73 ms; live nav RTF Labbot celisca_floor_1 0.31 -> 0.675, hospital 0.13 -> 0.344, nav_obstacle Bumperbot 0.877. Still below real time on large worlds (remaining: flex vertex update, scan, camera, Nav2 CPU); 4 ms wheel step rejected (Labbot drift). Earlier image-packing and profile results retained."
    evidence: "docs/status/evidence/p4-mujoco-step-2026-10-12/README.md"
    active_scope: "2026-10-09 codex: implement cached coplanar collision-surface retriangulation to reduce static rigid-flex vertices while retaining the selected world's surfaces, holes, radius and visible mesh. Unsupported/non-equivalent patches fall back to source triangles. Default MuJoCo, robot controllers and sensors remain unchanged. Matched geometry/contact/motion/RTF validation follows implementation."
  P5:
    title: "Four-wheel steering across crab, opposite-phase and pivot modes"
    state: "partial"
    owner: "claude"
    result: "2026-10-12 claude: every 4WS steering pattern (ackermann/opposite-phase, in_phase, crab, pivot) drives in MuJoCo, PyBullet, Gazebo and Isaac with truth-measured phases: straight 0.398-0.407 of 0.4 m/s, opposite-phase arcs 0.49-0.51 of 0.5 rad/s, in-phase converts turn commands to sideways drift without yaw, crab strafes 0.268-0.300 of 0.3 m/s, pure rotation pivots in place 0.93-0.99 rad/s, all stop at zero. Earlier crab/pose evidence retained. 2026-10-13 claude: obstacle missions (detour, cancel/stop, resume, near-obstacle goal) pass for every pattern in every backend on the second run (docs/status/evidence/r56-4ws-missions-2026-10-13: 13/20 cells first, 19/20 after the arrival-window fix, and the mecanum rerun passes in all four backends, so all 20 pattern/backend cells now pass). 2026-10-15 claude: slam mapping on wheel odometry around a 26 m nav_obstacle loop holds 1.4-2.5 cm in the ackermann and pivot patterns (MuJoCo, Gazebo; docs/status/evidence/p7-legged-slam-mapping-2026-10-13/wheels); the drive harness moves both patterns identically. Sideways (slam_mapping_check.py --holonomic, 9f7565c; docs/status/evidence/p7-legged-slam-mapping-2026-10-13/sideways) the crab and in_phase patterns hold 0.9-1.7 cm in MuJoCo and Gazebo and the strafing mecanum car 2.4 cm in MuJoCo and 11 cm in Gazebo, where roller slip leaves its odometry 1.02 m off. Contacts remain (R5.6). 2026-10-15 claude: goal seeds 2 and 3 in all four backends (docs/status/evidence/wheeled-repeats-2026-10-15): 4WS ackermann, pivot and the mecanum car pass 24/24, crab and in_phase abort goal B in all 16 runs (the drive stops 0.55-1.1 m from obstacles with zero DWB commands until the progress checker aborts; the base cannot turn while it translates), and the three cars pass 13/24, their near-obstacle errors 0.26-0.36 m against the 0.30 m limit."
    evidence: "docs/status/evidence/p56-drive-patterns-2026-10-12/README.md"
  P6:
    title: "Physical mecanum lateral drive and mapping/navigation"
    state: "partial"
    owner: "claude"
    result: "2026-10-12 claude: mecanum drives, arcs, spins and strafes in all four backends (strafe 0.254-0.282 of 0.3 m/s in MuJoCo/PyBullet/Gazebo, 0.142 in Isaac where roller grip is lower). Earlier PyBullet SLAM/lateral evidence retained. 2026-10-13 claude: mecanum obstacle missions pass in PyBullet, Gazebo and Isaac; MuJoCo was aborted while aligning at the goal (0.03-0.09 m away); with the 4WS arrival window (f36bc5e) the round-3 rerun passes in all four backends (0.035-0.108 m). Freeing the 60 Isaac rollers from the importer's joint drives (42d1ccb), then giving them the URDF damping in USD's per-degree units (6a88bce, a84ab0c), did not help the Isaac strafe (0.119, 0.148 m/s). A roller spin probe (scripts/roller_spin_probe.py) shows the Isaac hubs at the ideal 6.0 rad/s but the contact rollers at 41-57% of the ideal 67 rad/s (MuJoCo 95-97%), so the rollers are resisted or slip; 32/8 solver iterations and a 2 mm roller contact offset (175fa1c, cdcb01c) leave the strafe at 0.148-0.167 m/s with rollers at about half rate, though with less forward drift; the obstacle mission still passes. Cause found: PhysX rolled each roller's 12-sided convex hull facet by facet; with analytic capsule roller collisions (e0e496e) a roller spin probe gives a 0.293 m/s strafe for 0.3 commanded, rollers at 104-118% of the ideal rate and 0.002 m/s forward drift (MuJoCo 0.251). The full drive check strafes at 0.290 m/s with every other phase unchanged, and the obstacle mission passes (0.08/0.04 m). Isaac lateral shortfall closed. 2026-10-15 claude: slam mapping on wheel odometry around a 26 m loop holds 1.1-2.5 cm in all four backends, every map wall on a reference wall (docs/status/evidence/p7-legged-slam-mapping-2026-10-13/wheels)."
    evidence: "docs/status/evidence/p56-drive-patterns-2026-10-12/README.md"
  P7:
    title: "Model-specific humanoid/quadruped policies and truthful GUI modes"
    state: partial
    owner: "claude"
    result: "2026-10-12 claude: model-matched rl_sar policies walk on /cmd_vel through in-step PD paths in all three physics backends that can run them: MuJoCo (go2_himloco, a1_legged_gym, b2_robot_lab, go2w_robot_lab, g1_robomimic_locomotion), Isaac PhysX drives at 200 Hz (Go2, A1, Go2W and the G1 humanoid track all phases; B2 overshoots to 0.65 m/s and drifts 0.16 m/s after stop) and Gazebo ign_ros2_control effort trajectory controller (Go2, with a new head LiDAR and ground truth). The Unitree G1 29-DoF humanoid (recurrent LSTM actor exported with explicit state) walks 0.38-0.39 m/s, spins and strafes in MuJoCo and Isaac. Go2 himloco does not spin in place in MuJoCo/Gazebo. Legged mapping/navigation, BHL outside MuJoCo and B2-in-Isaac remain. 2026-10-13 claude: walking robots navigate (implemented, experimental; docs/status/evidence/p7-legged-navigation-2026-10-13): leg kinematic odometry from the stance feet (velocity-gated stance, drift 1.3-7.1% of a 9 m walk) feeds the EKF; slam/nav select the provisioned policy in MuJoCo, Isaac and Gazebo; per-robot RPP overlays with polygon footprints, no turn ramp and minimum speeds each gait walks at. nav_obstacle mission (detour, cancel, resume, near-obstacle goal) passes in every MuJoCo and Isaac cell run: Go2, A1 and G1 in both, B2 in MuJoCo (round 4, after the B2/G1 minimum speeds of 0.4/0.3 m/s, 336dc46). Gazebo Go2: the paused start deadlocked the controller spawners until the unpause node stepped the world (8f3bc2c); it now stands and walks 6.6 m, but mid-mission it surged to 0.5 m/s, its estimate fell 0.63 m behind truth into lethal space and the planner gave up (cause not established). Slam-mode mapping with leg odometry (docs/status/evidence/p7-legged-slam-mapping-2026-10-13, scripts/slam_mapping_check.{py,sh}): along a 26 m loop through nav_obstacle the slam pose stays within 4.5-7.1 cm RMSE of truth (max 15 cm) for A1/B2/G1 in MuJoCo, Go2/A1/G1 in Isaac and Go2 in Gazebo; every MuJoCo/Isaac map cell lies on a reference wall (mean 5-7 cm from the surface); wheeled Bumperbot in Gazebo 11.3 cm. Gazebo Go2 now walks the loop at 2 ms physics (gazebo_max_physics_step_s); its nav mission still failed in the start corner, so Nav2 now backs up instead of spinning where a robot cannot spin (no_spin_in_place). 2026-10-15 claude: repeats over three goal seeds (docs/status/evidence/p7-legged-navigation-2026-10-13): A1 3/3 in MuJoCo and Isaac, G1 3/3 MuJoCo and 2/3 Isaac, Go2 2/3 Isaac. Go2 and B2 failures began beside the block at the nav_obstacle start (no in-place turn; slow back-ups they cannot walk). The navigation motion model forward_arc (Hybrid-A* DUBIN with the footprint, no spin or reverse, clear-and-replan recovery; 7a8a3cf, 8f3bf4f, 463117e) brings Go2 to 3/3 in MuJoCo and 3/3 in Gazebo (its first Gazebo passes) and B2 MuJoCo to 2/3 (the miss 4 mm over the 0.30 m test). 2026-10-15 claude (later): the G1 Isaac 'start in lethal space' is explained (d65fc2e): the start is the estimated pose at the 1 Hz replan; walking north 0.44-0.48 m from the west wall while still turning, with its AMCL estimate 0.10-0.20 m nearer, its centre sat at the 0.3 m inscribed radius, which the grid planner counts as a collision. Bumperbot's Gazebo slam pose (9.6 cm RMSE) is worse than the EKF odometry it is given (2.7 cm), unlike the mecanum car's (24.9 to 2.4 cm); cause open (3b1a141). Remaining: B2 in Isaac, more clearance for G1 paths (lower cost_scaling_factor or a larger radius, untried), other maps and terrain. 2026-10-16 claude: with the G1's global inflation widened to 0.8 m at cost scaling 2.0 (f276b83), seeds 1-3 pass in Isaac and MuJoCo (6/6; docs/status/evidence/p7-legged-navigation-2026-10-13/g1-clearance); Isaac seed 3's near-obstacle error 0.256 m passes the mission but not the matrix's 0.25 m screen."
    evidence: "docs/status/evidence/p7-rl-sar-mujoco-walk-2026-10-12/README.md"
