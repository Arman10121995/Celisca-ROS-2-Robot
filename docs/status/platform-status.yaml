handoff:
  next_task: P3.4
  instructions: 'Read ROADMAP.md and docs/architecture/overview.md. P0-P2 complete; P3.1 (Bumperbot), P3.2 (Labbot + robot-lab CLI packaging fix), and P3.3 (Go2 simulated commandable legged profile) complete. Integrated robots: bumperbot, labbot (mobile), go2 (legged). Next: P3.4 - turn one existing humanoid description (e.g. the vendored Unitree h1/g1 or berkeley_humanoid_lite) into a simulated, commandable profile with a stable standing/walking controller, following the P3.1/P3.2/P3.3 qualification pattern (scenario, experiment, contracts, asset checks, tests). Known issue: assem12ros_29 registry entry misclassifies a 3-revolute-joint linkage as differential_drive mobile robot - reclassify to manipulator/misc or deprecate in a follow-up; also most other cataloged robots still lack ros_package metadata (add as each is qualified). Registry counts: 12 scenarios / 9 experiments / 20 robots (3 integrated).'
