          - "docs/status/evidence/r53-bhl-gui-drive-2026-09-24/"
          - "ROADMAP.md"
          - "src/robot_lab_bringup/test/test_mujoco_effort.py"
          - "src/robot_lab_bringup/CMakeLists.txt"
          - "src/robot_lab_bringup/config/algorithm_dispatch.yaml"
          - "src/robot_lab/robot_lab_registry/config/algorithms.yaml"
          - "src/robot_lab_robots/config/robots.yaml"
          - "src/robot_lab_maps/tools/gen_mjcf_worlds.py"
          - "src/robot_lab_maps/mjcf/"
          - "src/robot_lab_maps/test/test_mjcf_worlds.py"
        acceptance_ref: "ROADMAP.md"
        evidence:
          - "bhl_balance.py: closed-loop balance core - ankle strategy (differential ankle roll/pitch with hip-roll compensation), arm-reaction swing out of phase with roll, joint-space PD stance where a joint without a position measurement gets zero effort, efforts clamped to the URDF 20 N.m limit, bounded base-velocity interface, effort-residual contact estimation, latched SAFE_STOP monitor (tilt >= 0.70 rad or >=98% effort for 50 cycles, explicit reset), BodyState roll/pitch from IMU ZYX quaternion."
          - "test_r5_3_bhl_balance.py: 56 unit tests pass (2026-09-14), including the standing-pose-is-not-balance check: a level body returns the nominal pose while non-zero roll/pitch changes ankle/hip/arm commands."
          - "test_bhl_qualification.py: 23 registry static tests pass (2026-09-14) asserting BHL URDF joints/inertias/position limits; 56+23=79 BHL unit tests, above the 60+ acceptance bar."
          - "humanoid_standing_controller.py stays a thin ROS wrapper over the pure-logic layer; the module docstring declares flat-ground stepping/walking and stop as future work."
          - "test_r5_3_bhl_policy.py: 15 unit tests pass (2026-09-15) for tracking_command helper - pure-logic tests verifying return type/shape/bounds, walk/turn phase reference tracking, lateral/yaw error corrections, input immutability, and clamping behavior for large errors. All tests pass. Path resolution to qualify_policy fixed to the robot_lab_robots package layout."
          - "bhl_policy.py + humanoid_policy_controller.py (2026-09-15): ONNX velocity policy wired into the ROS adapter. Pure-logic BhlPolicyController loads the verified upstream configs (policy_humanoid 22-action/75-dim, policy_humanoid_legs 12-action/45-dim; layout enforced as 9 + 3 * len(action_indices) with history_length 0), assembles the observation [cmd(3, clamped to training ranges), gyro(3), projected gravity(3), q-default(22), dq(22), prev-action(22)] in policy joint order mapped by name from /joint_states, converts actions to default + 0.25 * clipped action clamped to URDF position limits, and publishes 22 Float64MultiArray position targets at 25 Hz. Safety: tilt >= 0.70 rad or NaN/wrong-shape policy output latches SAFE_STOP holding the default pose until explicit reset; missing joint measurements hold previous targets and warn (no fabricated inference). Node is a thin wrapper: /joint_states + /bhl/imu + /cmd_vel -> position targets; holds the default pose until the first cmd_vel; entry point humanoid-policy-controller registered. Session is dependency-injected so tests need no onnxruntime."
          - "test_r5_3_bhl_policy_adapter.py: 34 unit tests pass (2026-09-15) covering config-layout enforcement (both policies + rejection of recurrent/wrong-size configs), command clamping, gravity/tilt quaternion conventions matching qualify_policy, observation layout blocks, action-to-target math with config and URDF clamping, and stub-session controller behavior (command passthrough, hold-and-warn on missing measurements, latched SAFE_STOP with explicit reset, previous-action feedback, legs-policy variant). Real onnxruntime CPU smoke run confirmed end-to-end inference for both checkpoints. Full adapter suite: 213 tests pass."
          - "test_r5_3_bhl_policy_ros_graph.py: 4 integration tests pass (2026-09-15) launching the real HumanoidPolicyController node on a live rclpy graph with real ONNX inference: default-pose hold before any cmd_vel (>= 5 messages at the policy rate), cmd_vel-triggered inference at the measured policy rate with finite 22-vector targets distinct from the hold pose, JointState velocity marshalling verified into the node's observation path, and a tipped IMU (0.75 rad > 0.70 threshold) latching SAFE_STOP back to the default pose while cmd_vel keeps arriving. Tests skip cleanly without a sourced ROS 2 env; full adapter suite 217 tests pass."
          - "test_r5_3_bhl_backend_contract.py: 8 launch-contract tests pass (2026-09-15) verifying the bringup path statically: bhl_controllers.yaml commands the same 22 joints in the canonical BHL_JOINT_NAMES order via a position forward_command_controller; the bhl_joint macro in bhl_ros2_control.xacro declares position command plus position/velocity/effort state interfaces on every joint (so the joint_state_broadcaster can report the velocities the policy observation consumes - the zeros-until-JointState limitation is a publisher property, not a backend one); humanoid_policy_controller is cataloged in algorithms.yaml (control category, family learned_policy, honest description carrying the command-tracking caveat) and dispatched in algorithm_dispatch.yaml to the registered humanoid-policy-controller console script whose module defines HumanoidPolicyController; the registry's typed compatibility gate passes (bipedal_locomotion required and declared by the berkeley_humanoid_lite robot entity; walking was NOT used because the robot does not declare it - walking is the open question). Registry suite 286 tests pass, bringup dispatch tests 11 pass, full adapter suite 225 pass. Superseded in part (2026-09-17): the backend is no longer a position forward_command_controller — the bhl_joint macro now declares an effort command interface and bhl_controllers.yaml uses effort_controllers/JointGroupEffortController (kp=10.0, kd=2.0); see docs/status/evidence/r53-bhl-effort-interface-2026-09-16/."
          - "Remaining honest limitation: joint velocities default to zeros until JointState messages carry velocity (position-only observation degrades tracking - declared, not hidden); the adapter publishes position targets, so PD gains/effort clamping follow the backend forward_command_controller, and the policy config's per-joint effort limits (4 N.m arms / 6 N.m legs) are exposed as the policy operating envelope distinct from the URDF 20 N.m hardware bound. Hardware/deployment validation without simulator ground truth remains future work. Superseded in part (2026-09-17): the backend is now an effort_controllers/JointGroupEffortController (kp=10.0, kd=2.0) applying tau = kp*(q* - q) + kd*(0 - qdot) clamped to +/-20 N.m, so PD/effort clamping no longer follow a forward_command_controller - see the effort-interface entry in this R5.3 next_action and docs/status/evidence/r53-bhl-effort-interface-2026-09-16/."
          - "Native MuJoCo policy probe (2026-09-15, docs/status/evidence/r53-bhl-policy-probe-2026-09-15): policy_humanoid_legs on the vendored native model with upstream checkpoints. Open-loop at 0.5 m/s: stand/perturb/stop pass with zero safety failures, walk 87% of commanded distance but 0.67 m lateral drift (> 0.5 m), turn 31% of commanded yaw - honest finding that upstream policies do not track commands open-loop. With bounded ground-truth tracking feedback (gains xy 1/s, yaw 2/s, declared development-only) at 0.25 m/s: all five phases pass - stance, bounded perturbation recovery, walk 96% distance/0.01 m drift, turn 62%, stop drift < 0.001 m; no fall (tilt <= 0.052 rad), no non-foot floor contact, joint-limit excess <= 0.0008 rad, efforts clamped to limits throughout."
          - "Adapter-path validation (2026-09-15, docs/status/evidence/r53-bhl-adapter-path-2026-09-15): qualify_policy_adapter.py drives MuJoCo through BhlPolicyController - the exact code the humanoid_policy_controller ROS node calls - fed with onboard state only (simulated imu_quat/imu_gyro sensors + measured joint states mapped by name, no simulator ground-truth feedback). Full-body policy at 0.5 m/s: stand/perturb/walk/stop pass with walk 4.30 m of 5 m commanded (86%, lateral drift 0.42 m) and turn failing the 50% yaw bar (0.56 rad); the probe reference shows the same qualitative gait (5.49 m, drift 0.57 m just over the 0.5 m bound), so float32/rounding divergence amplified by chaotic gait dynamics flips the drift verdict at the threshold - measurement sensitivity, not a convention mismatch. Legs policy at 0.25 m/s matches the probe per-phase exactly and honestly does not walk open-loop (0.005 m in 10 s); the earlier 96% walk figure required development-only ground-truth tracking feedback the deployed adapter does not have. Zero adapter SAFE_STOP latches, no falls (max tilt 0.160 rad), no non-foot floor contacts, joint-limit excess <= 0.003 rad. Accurate flat-ground walking/turning with onboard state only remains future work (onboard-odometry feedback or a retrained command-tracking policy)."
          - "2026-09-22 live MuJoCo effort/stance qualification: docs/status/evidence/r53-mujoco-effort-2026-09-22/. The common-launch URDF backend now accepts 22 named joint efforts with URDF force/loss limits and 250 Hz state publication. Active balance held 12 simulated seconds (max tilt 0.001816 rad, max effort 0.757827 N.m); the matched passive condition fell (max tilt 1.904760 rad). Watchdog and reset clear measured effort; both final runs stop cleanly after fixing duplicate-SIGINT teardown. Bringup plus BHL balance tests: 383 passed, 2 skipped; CTest effort suite 10 passed (overlapping cases); changed packages rebuilt. This is live stance evidence, not walking/terrain qualification."
          - "2026-09-24 MuJoCo GUI-drive qualification: docs/status/evidence/r53-bhl-gui-drive-2026-09-24/. The common localization launch now starts the ONNX effort policy, takes GUI /key_vel through twist_mux, and disables passive joint hold. A full-graph baseline fell during walking (peak tilt 1.69 rad); changing 250 Hz joint/IMU subscriptions to depth one was followed by two upright long walk/stop runs from the map default spawn (25 Hz and GUI 10 Hz commands, peak tilt at most 0.22 rad). Repeat isolated pure-turn trials (+0.3 and -0.3 rad/s) completed the 2 s startup bend without falling (peak tilt 0.21–0.30 rad, settled post-stop tilt 0.12–0.13 rad), confirming that startup bend succeeds under isolated load; those two runs ended at -0.45 and -0.67 rad of net yaw, a transient later traced to the startup window rather than a turn-gain error (see next_action). Reverse, terrain, navigation, and SLAM remain unqualified."
          - "2026-09-25 gait-collapse diagnosis and refuted command-feedback mitigation: docs/status/evidence/r53-bhl-gui-drive-2026-09-24/{turn_pos03_gait_25hz,turn_pos03_gait_fall_25hz,turn_pos03_servo4_25hz}.{json,log} with probe_key_vel.py (new BHL_PROBE_EFFORT_VECTOR full-effort capture) and the new analyze_turn_gait.py window digest. Clean 25 Hz run: the body turns at 1.2x the commanded rate for two seconds, then the summed-|effort| spread collapses from ~10 N.m to 0.16-0.23 N.m with the post-mux command still (0,+0.3) - the policy parks at a constant target, it is not stepping and slipping. Boost-only yaw servo (yaw_servo_gain, off by default, launch flag bhl_enable_yaw_servo) commanded an implied 1.38-1.50 rad/s through the stall at gain 4 and the yaw still fell to <=0.013 rad/s: the fixed point is command-invariant, so command feedback is refuted as a remedy. One run toppled in the ramp under a concurrent second launch (~167% CPU mujoco_spawner); the identical re-run on an idle machine passed the bend at 0.271 rad peak tilt. Follow-up source audit: the pinned physical low-level program overwrites motor-config 50/2 gains/limits with the checkpoint 10/2 arms and 20/2 legs plus 4/6 N.m limits already used here; the verified missing behavior is the Recoil 2 kHz torque EMA (alpha 0.2695973). An opt-in rate-composed 250 Hz equivalent is implemented; matched live A/B is negative (8-13 s dyaw 0.0098 rad, effort spread 0.17 N.m), so it remains off by default."
