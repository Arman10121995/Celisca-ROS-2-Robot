          frame == base link frame). Spawn z in robots.yaml corrected 0.078 -> 0.042:
          the old value dropped the soles 3.8 cm onto the ground at EVERY spawn -
          a symmetric flat drop, which is why the 2026-09-17 live trace shows clean
