          - "Smoke test repaired for this host's rclpy binding, which represents scalar uint8 - including the DiagnosticStatus.OK constant - as bytes; the health-level contract check normalises the representation without weakening it. Full adapter suite 164 passed (2026-09-14)."
          - "2026-09-14 isolated live smoke (src/robot_lab_bringup/test/test_pybullet_runtime.py with ROBOT_LAB_RUN_PYBULLET_SMOKE=1; pybullet, bumperbot, nav_empty.world, spawn_yaw 0.7): 0.895 m forward in 4.5 s sim time at 0.2 m/s commanded (avg 0.199 m/s), lateral drift 0.0005 m; RGB 320x240 rgb8 and depth 32FC1 with finite fraction 0.61 (min 0.372 m); 269 odom / 268 clock / 26 scan / 27 rgb messages; /robot_lab/reset restores pose to 3.8e-5 m and ~0 speed. Artifacts: docs/status/evidence/pybullet-r81-smoke-2026-09-14/."
          - "Runtime defects repaired during qualification: the PyBullet /robot_lab/health topic was declared but never published (timer never created); RGB-D now renders on a dedicated mirror PyBullet client so the tiny software renderer (~350 ms/frame on this host) cannot stall the physics loop or its publish contract; the camera and publish gates are sim-time based and re-arm on reset; reset now restores actuated joint velocities and clears a still-fresh cmd_vel so the reset pose holds."
          - "robot_lab_utils Collada reader now honours <unit meter=.../>: AWS RoboMaker warehouse meshes are centimetre-authored and were being materialised 100x oversized (AABBs hundreds of metres tall), corrupting SDF world geometry for PyBullet and Isaac - LiDAR returned nothing and depth geometry was wrong. 57 SDF/mesh/frame tests pass after the fix."
          - "2026-09-15 multi-seed R4 live missions (harness robot-lab-live-mission in src/robot_lab/robot_lab_benchmark/robot_lab_benchmark/live_mission.py, 19 tests in test_live_mission.py of which the 2 live ones are opt-in via ROBOT_LAB_RUN_LIVE_MISSION=1 so the default suite never touches the ROS graph; benchmark suite 235 passed / 2 skipped): five evaluation seeds per backend - MuJoCo 1001-1005, PyBullet 1101-1105 - driving bumperbot through point_to_point_navigation in nav_empty toward a 1.5 m goal, one isolated ROS domain per seed and the backends run strictly sequentially so no concurrent recording skews RTF. All 10 runs terminated in the truthful R4.1 outcome success with 0 contact events, no collisions and no timeouts (not a collapsed boolean). R4.2 measured trajectory distance: MuJoCo 1.3531 +/- 0.0027 m (min 1.3504, max 1.3560), PyBullet 1.3535 +/- 0.0014 m (min 1.3514, max 1.3547) against the 1.5 m straight-line goal - a bounded stop at the 0.15 m goal tolerance, not a raw 1.5 m path. Mean sim time 5.54 s / 5.45 s; mean RTF 0.378 / 0.349 on this host (software rendering). Min footprint clearance 4.52 m / 4.51 m, consistent with an open arena that puts no static geometry within scan range."
          - "Bag provenance is self-contained instead of hand-counted: the harness parses per-topic message counts straight from each run's rosbag2 metadata.yaml (bag_topic_counts / load_bag_topic_counts, 5 new unit tests), so every count cited here is recoverable from a committed file rather than an ad-hoc 'ros2 bag info'. Recorded totals 814-860 msgs/run (MuJoCo) and 801-804 msgs/run (PyBullet) across /clock, /odom/ground_truth, /scan and /cmd_vel. Artifacts: docs/status/evidence/r81-live-mujoco-2026-09-15/ and docs/status/evidence/r81-live-pybullet-2026-09-15/ (summary_<sim>.json verbatim harness output, stats.json holding per-metric distributions plus a per_seed breakdown, seed_<n>/ with manifest+metrics+trace head+launch head+progress log; every number above comes from stats.json). Raw trace.csv rows and bags/*.db3 are large and deliberately stay out of the repo - each README carries the exact reproduction command. The earlier 2026-09-14 single-seed runs are superseded and their artifact dirs were removed rather than left behind as a stale citation."
          - "Live opt-in tests validated end-to-end after the entry-point convention fix: the two live tests now launch the mission through the repo-standard route (ros2 run robot_lab_benchmark robot-lab-live-mission) rather than a bare console-script name. Sourcing install/setup.bash does not put install/<pkg>/lib/<pkg> on PATH (verified: zero matches), so the bare name only worked when the caller had exported PATH by hand - the earlier pass depended on exactly that leftover shell state. Both live tests now pass for real: MuJoCo 1 passed in 19.63 s, PyBullet 1 passed in 21.64 s, exit 0 (2026-09-15)."
          - "2026-10-01 R8.1 backend qualification framework completed: BackendQualificationFramework and verification scripts implemented with comprehensive checks for import fidelity, physics validation, sensor validation, reset functionality, R2 contracts, and R4 mobile experiments. Evidence: docs/status/evidence/r8-1-backend-qualification-2026-10-01.json and docs/status/evidence/r8-1-verification-2026-10-01.json"
