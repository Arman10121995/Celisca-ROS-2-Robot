          - "src/robot_lab_adapter/robot_lab_adapter/go2_stance_gait_controller.py: republishes the latched safety state on /go2/safety_state so recovery evidence records real transitions rather than inferred ones."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/flat_ground_suite_20260925_seed3/ and flat_ground_suite_20260925_seed4/: third and fourth matched five-case inverse-map flat-ground suites in isolated domains 216-220 and 226-230. All four suite runs to date returned zero and passed all five bounded screening checks, so bounded flat-ground screening is repeatable across four runs. This is still not velocity-tracking, terrain or navigation qualification."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_recovery_trial_20260925T60N_fixed/: the older 60 N trial delivered 3995 safety messages and collapsed to 0.139 m, but did not record a fallen or recovery-state transition. The brief fall-threshold excursion did not satisfy the old detector's 25-cycle debounce, so this trial is negative collapse evidence, not evidence that the re-stand attempt ran."
          - "src/robot_lab_adapter/robot_lab_adapter/go2_locomotion.py: latched fall detection after a fall-threshold trip followed by FALL_CONFIRM_CYCLES warning-or-higher observations; the bounded opt-in re-stand attempt succeeds only with measured upright tilt and body height >=0.25 m, and never restarts after a terminal state."
          - "src/robot_lab_bringup/launch/simulated_robot.launch.py: _as_float helper so numeric recovery parameters are not passed to a DOUBLE declaration as strings. The first recovery trial was invalid because this type mismatch killed the controller at startup (InvalidParameterTypeException), leaving the robot uncontrolled; that trial was removed rather than reported."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_trigger_height_valid_20260925T60N/: corrected detector and explicit fall/recovery telemetry, standard MuJoCo launch, ROS domain 228, 0.2 s 60 N lateral pulse at 3 s, 16 s trial and opt-in 8 s attempt. Probe/launch returned zero; all controller contract topics delivered 3991 messages. Fallen latched at 3.796 s, recovery entered attempting then failed at 10.628 s, and the robot ended inverted at 0.057 m. The previous 0.139 m run was inconclusive about recovery activation because its old detector did not latch fallen. The corrected attempt is a valid negative; success now requires measured height >=0.25 m as well as upright tilt."
          - "src/robot_lab_adapter/policies/go2_recovery_nju/: pinned MIT-licensed NJU-RLC recovery actor exported to 955210-byte ONNX; upstream checkpoint SHA and ONNX SHA in SOURCE.md. Exported graph parity with PyTorch was within 3.875e-7 on a zero-input sample. The 57-value proprioception, 10-frame history and 12-action contract is implemented in go2_recovery_policy.py with direct contact forces, 40/1 PD and bounded actions/targets/efforts."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_nju_recovery_trial_20260925T60N/ and fall_nju_recovery_bounded_20260925T60N/: standard MuJoCo launch with 0.2 s 60 N pulse and opt-in 8 s NJU-RLC actor. Raw-action trial started recovery at 3.800 s but produced a non-finite action and failed closed at 8.588 s. Valid rebuilt bounded trial used domain 223, probe/launch returncode zero, 3997 safety messages, started at 3.800 s, timed out at 10.696 s and ended inverted at 0.057 m. Intermediate source-edited trials ran stale installed adapter code and were discarded. The actor is not a qualified get-up controller on this plant."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_nju_recovery_trial_20260925T60N/, fall_nju_recovery_bounded_20260925T60N/ and fall_nju_recovery_bounded_repeat_20260925T60N/: standard MuJoCo launch with 0.2 s 60 N pulse and opt-in 8 s NJU-RLC actor. Raw-action trial started recovery at 3.800 s but produced a non-finite action and failed closed at 8.588 s. Valid rebuilt bounded trials used domains 223/222, probe/launch returncodes zero, 3997/3998 safety messages, started at 3.800/3.808 s, timed out at 10.696/10.840 s and both ended inverted at 0.057 m. Final repeat manifest records five exact source/model hashes. Intermediate source-edited trials ran stale installed adapter code and were discarded. The actor is not a qualified get-up controller on this plant."
          - "scripts/test_tiers.sh: R5.2 Go2 locomotion, flat velocity policy and recovery policy tests are now in the CI fast tier. Local fast run after adding the fall-pose classification, unrecoverable terminal state and actor gain/slew parity tests: 580 passed, 1 skipped, registry cross-reference validation PASS; focused Go2 locomotion plus recovery policy run: 105 passed."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_nju_recovery_delay1_20260925T60N/ and fall_nju_recovery_delay1_supported_20260925T60N/: opt-in 1.0 s zero-effort settling delay on the same 60 N pulse, 18 s probe, 8 s active window. Initial trial falsely declared succeeded at 4.948 s because body height reached 0.472 m in the air with at most one loaded foot; it later collapsed to 0.089 m. Corrected success law requires tilt <0.35 rad, body height >=0.25 m and at least three feet loaded >=2 N continuously for 0.5 s. Rebuilt repeat in domain 220 returned zero with 4498 safety messages, waited then attempted then failed at 3.796/4.612/11.604 s and ended inverted at 0.057 m. The delay is a measured negative; the support/dwell check prevents false success."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_nju_recovery_gainslew_20260925T60N/: valid 60 N actor repeat in ROS domain 214 with 4491 effort messages and zero probe/launch return codes after re-mapping the actor onto the measured per-joint Go2 gains (hip 100/5, thigh 300/8, calf 300/8 at 0.2 scale, replacing a single flat RECOVERY_KP=40 that was 2x hot on hips and ~0.13x cold on thigh/calf) and adding a 3 rad/s target slew at the 50 Hz policy rate. Peak measured joint velocity fell 5.1x from 55.31 to 10.81 rad/s and the verdict is now the new terminal state unrecoverable, but the trunk still crossed the 2.4 rad inverted threshold at 4.364 s, about 0.6 s into the attempt, and ended inverted at 0.057 m. The 60 N get-up remains a measured negative; the roll-over is driven by the actor action, not actuator bandwidth."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_invalid_numpy_type_20260925T60N/: INVALID trial retained as a defect record, not a result. A rewritten recovery effort path returned numpy.float32 values, raising AssertionError inside the std_msgs/Float64MultiArray setter and killing the controller 0.4 s after the fall. The run appeared to show a clean non-inversion (max tilt 0.775 rad, 0.139 m) only because a dead node commands no torque. The float cast was restored and a regression test pins every published effort to type float; contract message counts must be checked before trusting any trial."
          - "src/robot_lab_adapter/robot_lab_adapter/go2_locomotion.py: classify_fall_pose() reports upright/collapsed/inverted/unknown from measured attitude and height, and FallRecovery gained the terminal state unrecoverable (with TERMINAL_STATES) so an attempt expiring past FALL_INVERTED_TILT_RAD=2.4 rad is filed as an out-of-envelope pose instead of a controller shortfall. Both verdicts stay terminal and never restart; missing attitude or height reports unknown rather than guessing."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/analyze_entry_phase.py and entry_phase.json: reads each ladder trial's entry from its own recovery_transitions record, so the grouping spans both eras and never depends on a trial name. Across the 104 recorded ladder trials 86 attempted a recovery, 6 entering at roll and 80 at tuck. Per trial it reports the rest engaged from (signed roll/pitch, per-foot load, roll rate over the 0.1 s before the entry), the entry window's contact pattern, and whether the trunk reached inverted tilt inside 1.5 s."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_ladder_brace_placed_20260929Troll0.9d1.0{,b}/ and fall_ladder_tuck_placed_20260929Troll0.9d1.0{,b}/: matched settled-rest A/B refuting the pose-keyed entry. Four runs, identical manifests (placed roll 0.9 rad, pitch 0, 1.0 s start delay, no perturbation force, all traced), attempt beginning from the measured rest at 0.512 rad / 0.0 rad/s. The braced push strikes 819.1/747.6 N on the pair the trunk rests on (FR+RR at 412/407 N) and the fold 541.1/465.2 N; both poses inverted 2 of 2, so the entry pose is not what decides the outcome."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/fall_ladder_brace_delayed_20260929Td1.0{,b,c,d}/: real 60 N delayed family. d1.0 entered at attempting:roll with a 309.8 N strike (208.1 N on FL alone) and inverted; d1.0b never latched an attempt; c and d were lost to this host's CycloneDDS range (ROS domain 233 and up: a multicast port out of range) and are retained as harness logs and return codes with no probe.json, so the analyzer skips them rather than reading an empty result."
          - "src/robot_lab_adapter/test/test_r5_2_go2_entry_phase.py: 10 contracts pinning the analyzer's extraction on synthetic traces and the measured claims on the recorded ones, including the matched-harness refutation, the harness match itself, and the trunk-load result below."
          - "src/robot_lab_adapter/test/test_r5_2_go2_support_attribution.py: 5 hermetic contracts pinning the recorded support partition (every dropped rest is an equilibrium summing to the weight, the 5.8-5.9% flank coverage with the two down-side hips as the hidden carrier, the fully published upright/inverted rests, the published-sum invariant, and 5 published of 18 colliding geoms). Both this file and test_r5_2_go2_entry_phase.py are now in scripts/test_tiers.sh FAST_TESTS. Local fast tier: 633 passed, 1 skipped; R5.2 Go2 selection: 168 passed, 0 skipped."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/trunk_contact_20260929Troll0.9/: first live trial on the new /go2/trunk_contact_forces topic (placed roll 0.9, 1.0 s start delay, 8 s, ROS domain 142, 2001 trunk messages, all 336 trace points populated). The trunk's own ground load is now measured rather than inferred: on the settled flank before the entry the trunk carries 0.0 N (the robot is on its side, on hip and thigh), the entry's first trunk contact is a 715.7 N slam at -3.127 rad, and the settled inverted rest carries 126.5 N with all four feet at 0.0 N. This is the support-creation number the closed-loop primitive has to beat, and it confirms the 997 N crouch transient as a real hazard a contact-keyed rule must not fire on."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/probe_support_attribution.py, support_attribution.log and support_attribution.json: settled-rest support partition over every colliding robot geom (drop from 0.4 m at 7 rolls, settle 4 s under the spawner's own joint-hold springs; all seven rests at qvel 0.000, so each row is a static equilibrium). On both settled flanks the two published topics cover 5.8-5.9% of the support, 7.3-7.4 N of 126.5 N (the two down-side feet at ~3.7 N each, trunk 0.0 N), while the hidden 119.1-119.2 N sits on the two down-side hip geoms at ~59.6 N each. Upright (four feet at 27.1/27.1/36.1/36.1 N) and inverted (trunk 126.5 N) rests are covered 100%. The two topics publish 5 of the model's 18 colliding geoms. The entry primitive's contact signal is incomplete at exactly the pose it must fix: the support it must move is hip load the topics do not publish."
        next_action: "R5.2 remains active. The shared 18-geom support stream, guarded delayed-pose hold, and 0.25 s in-range roll-transfer gate are implemented. Three matched +0.4 rad support-creation variants remained negative: transient foot contact only and failed:roll at ~0.139 m. Three aligned terrain_stairs runs at +0.25 m/s advanced 0.039/0.122/0.149 m; a matched +0.5 m/s run advanced 0.132 m but raised tilt/effort. All stop short of the first 4.4 m step. The dedicated harness pins the spawn and verifies measured start/telemetry. Next: target-domain terrain locomotion adaptation and a different whole-body get-up strategy; stop scalar splay/speed tuning. Keep recovery opt-in; terrain traversal, velocity tracking, and navigation remain unqualified. 2026-10-13 claude: on flat ground the Go2 (go2_himloco) now completes the nav_obstacle mission with leg odometry in MuJoCo and Isaac (truth errors 0.06-0.16 m); Gazebo is rerun after a paused-start fix (docs/status/evidence/p7-legged-navigation-2026-10-13). Terrain traversal and recovery remain."
      R5.3:
        title: "Qualify Berkeley Humanoid Lite balance and walking"
        state: "partial"
        owner: "claude"
        depends_on:
          - "R5.1"
        scope_paths:
          - "src/robot_lab_robots/berkeley_humanoid_lite/"
