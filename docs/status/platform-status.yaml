        next_action: "2026-09-25 (second pass): the stalled pure-turn gait is diagnosed, not only observed. BHL_PROBE_EFFORT_VECTOR=1 makes the probe record the full 22-value effort vector at full rate and analyze_turn_gait.py digests it per window: in the clean 25 Hz run the summed-|effort| spread falls from ~10 N.m at 3-5 s (yaw +0.35 rad/s, 1.2x commanded) to 0.16-0.23 N.m from 5 to 13 s while the post-mux command stays (0,+0.3) in every sample, so the policy parks at a constant target - it is not stepping in place and slipping. Command feedback was then implemented, unit-tested and refuted live: the new opt-in boost-only yaw servo (node parameters yaw_servo_gain/yaw_servo_limit/yaw_servo_filter_tau_s, launch flag bhl_enable_yaw_servo, off by default) commanded an implied 1.38-1.50 rad/s through the stall at gain 4 and the yaw still collapsed to <=0.013 rad/s with only a slower effort-spread decay (3.3-4.9 N.m at 5-7 s), so the fixed point is command-invariant inside the trained command range and a command-path/rate/semantics explanation is refuted. Follow-up source audit (2026-09-25 third pass): upstream sends position targets at 250 Hz, while Recoil closes PD + torque EMA at 2 kHz. Its physical deployment overwrites motor-config 50/2 gains/limits with the same checkpoint 10/2 arms, 20/2 legs, and 4/6 N.m limits used here, so gain mismatch is refuted. The verified missing law is the Recoil EMA (alpha 0.2695973); an opt-in 250 Hz rate-composed equivalent now resets invalid state and SAFE_STOP to zero. Matched sequential live A/B is negative: 8-13 s dyaw 0.0098 rad versus 0.0120 rad baseline, with both effort spreads back to 0.17 N.m despite the live command, so the filter remains off. Tests: R5.3 adapter/backend/ROS graph 155 passed; bringup profiles 200 passed. Next: contact duplication is fixed and refuted as the stall remedy; do not tune rate/filter/contact further. Move to target-domain retraining or a new measured hypothesis. Also this round: one attempted run toppled during the ramp while a concurrent second launch ran (its own mujoco_spawner at ~167% CPU, load 9.3/12) - the identical re-run on an idle machine passed the same bend at 0.271 rad peak tilt, so bend fragility is CPU contention rather than command. Evidence: docs/status/evidence/r53-bhl-gui-drive-2026-09-24/{turn_pos03_gait_25hz,turn_pos03_gait_fall_25hz,turn_pos03_servo4_25hz}.{json,log}, with probe_key_vel.py and the new analyze_turn_gait.py; tests: adapter policy 47 passed, ROS-graph integration 10 passed, launch contracts 3, bringup algorithm dispatch 61. 2026-09-25 (instrumented): the post-mux twist was recorded on every sample of three delayed-turn runs and one walk run, so the command path is now verified end to end: /key_vel -> twist_mux -> policy kept the exact commanded (vx, wz) live for the whole window (no dropped/zero samples). With a +/-0.3 rad/s pure-turn command held for 10 s after the 2 s bend settles, the body yawed the correct way for about 2 s at 0.5-1.0x the commanded rate and then the policy stopped stepping: dyaw over 8-13 s was 0.002-0.006 rad with the command still live (net 10 s yaw +1.01 rad at 25 Hz and +0.23/-0.57 rad at 10 Hz). The previously reported 'negative yaw bias' is retired: the zero-command bend window drifts -0.24 to +0.14 rad/s depending on the run, so that number was the startup transient, not a turn-gain error. Sustained walking is also not robust: 3 of 4 walk runs today held 10 s (1.4-2.0 m) and 1 died at ~6 s and stood (0.67 m) with the command still live, and the same 10 Hz stream both stalled and sustained on repeat, so the stall is a policy/plant robustness item, not a command-rate effect. Next: qualify turn-rate calibration and sustained-motion robustness (closed-loop velocity feedback or a retrained policy), reverse command behavior, bounded perturbation recovery, and map/terrain qualification; do not enable SLAM or navigation until sensor and goal missions pass. Historical status: 2026-09-24: the normal MuJoCo localization launch walks from GUI /key_vel and stops upright in two long flat-map runs; isolated repeat pure-turn runs (+0.3 and -0.3 rad/s) completed the 2 s startup bend upright (peak tilt 0.21-0.30 rad) with a stable post-stop settle, so the earlier startup-bend fall was load contention in the full launch graph rather than a control defect. Historical status: 2026-09-22: live MuJoCo effort control and 12-second active stance now pass, with a failing passive comparison and verified effort-watchdog/reset/clean shutdown. Next qualify bounded perturbations and policy-driven walking/turning on this actual URDF/ROS effort path; use the policy operating limits and adequate PD/state rates. Controller-state reset, additional maps and GUI orchestration remain. Earlier native-model probes use a different plant and are not a substitute for these live checks. Historical findings follow. Live backend bringup proven (2026-09-16): the in-scope R5.3 live backend path — Gazebo Ignition Fortress 6.18 + gz_ros2_control + bhl_standing_controller + joint_state_broadcaster + IMU bridge + humanoid_policy_controller — was brought up headless with robot_name:=bhl in nav_empty. Verified: robot spawns (entity 42, name bhl) with no IMU frame-name collision (the pre-fix 'Non-unique name[imu]' error is absent), both controllers load and activate, /imu/out and /joint_states publish, the policy node pushes 22-element Float64MultiArray targets at 25.0 Hz, and the tilt crash guard fires as designed (safe_stop at 0.79 rad on the un-balanced spawn — intended, not a backend defect). Artifacts: docs/status/evidence/r53-bhl-live-backend-2026-09-16/ (README + launch.log + policy.log + diag.txt); gazebo.launch.py now accepts gui:=false for headless runs. The prior note that the live route was blocked on simulator availability was stale: Ignition Fortress 6.18 and both the ign_ros2_control-system and gz_ros2_control-system plugin libraries are installed and wired through the gazebo.launch.py path, and a headless bringup actually succeeds (see evidence). Remaining (residual, out of scope for the backend proof): the command-tracking gap — the policy's position targets do not yet close the loop into stable standing/walking because the onboard loop lacks real odometry/velocity feedback (IMU only). That is a policy/observation-gap issue, not a backend wiring defect; the backend path itself is sound. Dispatch-path integration done (same day, follow-up): robots.yaml gained the berkeley_humanoid_lite_sim profile (bhl_sim.xacro, spawn name bhl, display mode, ros2_control feature) declaring the robot's own controllers list, and simulated_robot.launch.py now spawns profile-declared controllers via controller_manager/spawner in display mode. Verified live through the dispatch path headless: entity bhl spawns, both controllers active, /imu/out + /joint_states + /bhl_standing_controller/commands live. Contract tests: robot_lab_bringup/test/test_sim_profiles.py. Remaining for R5.3: close the command-tracking gap (onboard odometry/state feedback or a retrained policy) and extend the sim profile beyond display mode if nav is wanted. Paused-start variant probed (same day, see evidence README): paused:=true works (load-while-paused, activate after unpause — both controllers end active), yet the policy still latches SAFE_STOP at 0.75 rad and the robot falls with joint positions pinned at zero despite active position commands — bringup ordering is confirmed not the blocker; the command-tracking gap (actuation/state feedback) is the sole residual. Actuation probe (same day, decisive, see docs/status/evidence/r53-bhl-actuation-2026-09-16/): a controlled two-phase probe through the dispatch path (both controllers active, unpaused) shows position commands DO actuate the joints — knees track 0.4 rad exactly, arms track 0.8 rad (arm_left clamped at its URDF upper limit 0.7854) — and the robot stands stably under zero commands (tilt 0.0 rad over 10 s). This overturns the paused-start reading that commands produce no joint motion (a correction note is appended in the live-backend evidence README). Corrected root cause of the spawn-fall SAFE_STOP: humanoid_policy_controller holds the policy default pose (bent legs, knee 0.4) from its first cycle, before any cmd_vel, while the robot spawns straight-legged (all zeros); commanding that pose instantly destabilizes the standing robot until tilt crosses the 0.70 rad fall threshold. Startup transient implemented and live-validated (same day, see docs/status/evidence/r53-bhl-settle-2026-09-16/): StartupSettle in bhl_policy.py + humanoid_policy_controller (measured-pose hold, bounded ramp on first cmd_vel, safe abort mid-ramp). Verified live through the dispatch path, two runs (2 s and 12 s ramps): the measured-pose hold fixed the pre-command fall — tilt stayed 0.0 rad through the pre-policy and policy-idle windows in both runs, so SAFE_STOP before driving is eliminated. But the squat transition itself topples the free-standing biped at any ramp speed: run 1 (2 s) max tilt 2.86 rad, run 2 (12 s) SAFE_STOP at knees ~0.17-0.26 rad, part way into the squat — geometric instability of position-controlled standing without CoM/balance feedback, not ramp dynamics. Remaining R5.3 residual is therefore precisely scoped as closed-loop balance: either (a) effort-interface joint drive with the training PD gains (kp 10-20, kd 2) so the policy loop closes, or (b) a dedicated standing/balance controller for the squat-to-stand transition. Both are controller work, not bringup work. Option (a) implemented (2026-09-17, see docs/status/evidence/r53-bhl-effort-interface-2026-09-16/): the bhl_joint macro in bhl_ros2_control.xacro now declares an effort command interface (+/-20 N.m, matching the URDF bound and the balance controller saturation) in place of the position command interface, and bhl_controllers.yaml declares bhl_standing_controller as effort_controllers/JointGroupEffortController. Correction (same day, static verification of the installed plugin): that controller type is a *pure effort forwarder* - it derives from forward_command_controller/ForwardCommandController, its installed header states it 'forwards the commanded efforts down to a set of joints', and its library exposes only interface_name as a parameter name (no kp/kd/ki/gains). Declaring kp/kd on it would therefore have been silently ignored, and the policy's position values (rad) would have been written to the effort interfaces as torques (N.m). The kp/kd were removed from bhl_controllers.yaml (a contract test now asserts the file carries no dead gains) and the PD-effort loop is closed in the publishing nodes instead: humanoid_policy_controller and humanoid_standing_controller gained a command_interface parameter (effort by default, matching the description; position publishes raw targets and is kept for the position marshalling path) and convert their targets via bhl_balance.pd_effort_command (tau = Kp*(q* - q) + Kd*(0 - qdot), clamped to +/-20 N.m, zero effort for a joint with no measurement, zero on SAFE_STOP), with node parameters kp_legs/kd_legs/kp_arms/kd_arms defaulting to the repo's own stance-PD constants (legs 120/4, arms 60/2 - the vendored policy configs declare no gains, so the earlier 'kp 10-20, kd 2' was a scoping estimate, not a value read from the checkpoints). pd_effort_command gained optional leg_gains/arm_gains overrides for this (pinned by TestPdGainOverrides in test_r5_3_bhl_balance.py). No separate parameter-file wiring was needed: the description plugin already loads this exact bhl_controllers.yaml, and the controller's 22-joint list still equals BHL_JOINT_NAMES so the adapter/policy command ordering stays correct. A redundant bhl_controllers_effort.yaml draft was deleted (referenced by nothing; its ankle joint order diverged from the canonical order). Contract tests updated and green (2026-09-17): test_sim_profiles.py (controller type + 22 joints + no dead kp/kd), test_r5_3_bhl_backend_contract.py (effort controller type, no control-law gains, canonical joint order, and the effort command interface in the macro), test_r5_3_bhl_balance.py::TestPdGainOverrides, and test_r5_3_bhl_policy_ros_graph.py (4 position-interface regression tests plus 2 new effort-interface tests on a live rclpy graph with real ONNX inference: the pre-command hold is zero drive on the effort interface, and driving yields finite efforts inside +/-20 N.m). Results: scripts/test_fast.sh 430 passed, 1 skipped, PASS with registry cross-reference validation PASS; the full adapter suite 243 passed including all 6 graph tests; integration tier 114 passed. Honest scope: the effort path is wired and unit-verified but NOT yet live-validated - because the effort command interface replaced the position one, the earlier live actuation proof (r53-bhl-actuation-2026-09-16) no longer applies to the current description, so a live dispatch-path re-run is required to confirm the policy targets now produce controlled joint motion rather than the pinned-near-zero stall and that tilt stays below the 0.70 rad fall threshold. If live balance still fails, the residual falls back to option (b), a dedicated standing/balance controller.  Live validation completed (2026-09-17, second session, trace-before-spawn): two of three failure modes were found and fixed - (1) the nodes defaulted to imu_topic /bhl/imu, a topic with no publisher (the gz bridge publishes /imu/out), so the tilt=pi fallback latched SAFE_STOP on the first cycle; defaults and the registry (robots.yaml BHL sensors.imu.topic, algorithms.yaml required_topics, contract test) now say /imu/out; (2) the draft nominal stance (knees 0.8, ankle 0.1) dragged the biped out of its balanced spawn pose and the knees buckled under the 20 N.m cap; NOMINAL_STANDING_POSE is now the URDF rest pose (all joints 0), live-verified: the robot stands in equilibrium at spawn (tilt 0.000, knees 0.000) - the first live-stable stance of the effort path. Remaining failure mode (3), open: a rigid-body pivot topple about the foot edge (tilt 0.005 to 1.27 rad in ~0.6 s with joints nearly still), caused by restoring stiffness (ankle PD 120 N.m/rad saturating at 20 N.m ~ 0.167 rad) being marginal against the gravity toppling stiffness (~86 N.m/rad at the 0.675 m CoM) and degraded further by the BHL 45-degree leg-axis mounting, which means body tilt does not map 1:1 onto ankle joint error. Holding stance needs gravity compensation from the URDF dynamics and/or a proper leg Jacobian (tilt to joint torques through the 45-degree axes) and/or a hip strategy with knees flexed inside the joint limits - quantitative justification for the option (b) dedicated balance controller; this is controller design, not bringup or wiring. Fast suite re-run after the changes: PASS (registry cross-reference PASS).  Continuation (2026-09-18, geometry audit of the parallel-ankle fix 80925bf): the same-sign parallel-ankle law stands (re-derived FK confirms both ankle-pitch axes +Y and both ankle-roll axes +X at the rest pose), but two of its pinned numbers were wrong and are corrected. (a) Sole height: the rest-pose sole bottom is +0.0400 m above the base origin, not +0.076 m - the earlier estimate ignored the Rx(90 deg) rotation of the sole collision box (box center z=0.06 in the base frame, half-thickness 0.02; the 0.006 m collision-origin z offset lives in the ROTATED ankle_roll frame and the box 0.04 m thickness axis maps to link y, not z). Verified three independent ways: full-SE(3) URDF FK of every foot collision element, pybullet collision AABBs with the base link pinned at the origin (z [+0.039,+0.081] incl. ~1 mm contact margin), and gz sdf -p on the exact spawned model (model frame == base link frame). Spawn z in robots.yaml corrected 0.078 -> 0.042: the old value dropped the soles 3.8 cm onto the ground at EVERY spawn - a symmetric flat drop, which is why the 2026-09-17 live trace shows clean tilt 0.000 for ~1.3 s and no tilt transient before the pivot topple, but it is an avoidable impact on the ankle gears at every start. (b) Topple stiffness: TOPPLE_STIFFNESS_NM_PER_RAD corrected to ~70.9 N.m/rad (16.3312 kg total mass, whole-body CoM z=0.4823 m in the base frame -> CoM 0.4423 m above the geometric sole (the pybullet AABB reports 0.039 - its ~1 mm contact-break padding - and the FK figure is the geometric truth)). The earlier ~108 N.m/rad used h=0.675 m, which is the base inertial origin height above the base ORIGIN, not the CoM height above the SOLE - it overestimated gravity by ~1.5x. The K=0.7 gain is therefore a ~2.4x margin, not 1.5x; gain values themselves unchanged (the unstable-direction conclusion for the earlier K=0.12/0.15 still holds: ~29 N.m/rad < 71 N.m/rad). Note the same-day failure-mode (3) text above quotes ~86 N.m/rad at the 0.675 m CoM - superseded by the 71 N.m/rad figure; the qualitative conclusion (ankle PD saturating at 20 N.m is marginal and the 45-degree leg-axis mounting breaks the 1:1 tilt-to-ankle map) is unchanged. Evidence: docs/status/evidence/r53-bhl-ankle-fix-2026-09-17/sole_height_probe.{py,txt} (re-runnable). Tests: test_r5_3_bhl_balance.py 62 pass; full adapter suite 243 passed + 2 pre-existing environment failures in test_r5_3_bhl_policy_adapter that fail identically on clean HEAD (stale anyio/pytest plugin pin, unrelated). Next: live dispatch-path re-run with z=0.042 to confirm no spawn-drop transient; the open controller-design item is unchanged.  Continuation (2026-09-21, spawn sign + control-rate root cause + plant validation of the committed law): (a) SPAWN SIGN - the 2026-09-18 z=0.042 was itself sign-flipped: the sole is ABOVE the base origin, so the base origin must spawn BELOW ground; robots.yaml corrected z 0.042 -> -0.038 (2 mm settling margin). Plant-verified in pybullet: base at -0.038 establishes 8 foot contacts with Fz ~157 N (the full weight) within 25 ms; the same robot at +0.042 never touches down. The sole_height_probe RESULT line and yaml comment now derive the negative spawn explicitly. (b) CONTROL-RATE ROOT CAUSE of the ~5.5 s pivot topple: reproduced in MuJoCo on BOTH the legs-only biped and the full model with the exact committed law (balance_targets + pd_effort_command, 50 Hz, +/-20 N.m) - the 50 Hz control rate is discretely unstable (zero-order-hold torque staleness) for Kp=120 on the low-inertia ankle/foot links; rate sweep at 500 Hz sim: stable at >= 125 Hz, diverges at 50/25 Hz; BALANCE_RATE_HZ 50 -> 250. At 250 Hz the pure stance hold never exceeds 0.015 rad in 12 s and the full model rejects a pitch+roll nudge. (c) BALANCE SIGN re-validated at 250 Hz with the exact target-shift law: perturbed-stance max tilt 0.008 rad (committed +K) vs 0.129 rad (sign flipped) vs 0.014 rad (no reaction) - the committed same-sign law actively damps; it is correct. (d) STATIC FEASIBILITY: gravity-holding torque at the rest pose is <= 0.79 N.m on every joint (steady-state position-servo measurement, base pinned); note pybullet calculateInverseDynamics(flags=1) is unreliable here - it reports 116.6 N.m on arm_left_shoulder_pitch, contradicted by both the servo measurement and analytic gravity moments - so the stance hold is statically trivially feasible and every observed failure was dynamic. (e) LIVE GAZEBO A/B MATRIX at the corrected spawn (docs/status/evidence/r53-bhl-ankle-fix-2026-09-17/live_ab_matrix.md): base variants - 50 Hz node/100 Hz physics; 250 Hz node/100 Hz physics; 250 Hz node/500 Hz physics (empty+nav_empty worlds max_step_size 0.01 -> 0.002, also clearing the gz_ros2_control period-mismatch warning); imu_invert_tilt:=true (new diagnostic parameter on humanoid_standing_controller, default false); arms zero-drive A/B (STANCE_PD_ARMS 0/0, reverted - no effect); use_sim_time:=true on the node - ALL fall ~2.5-3 s after spawn with the same exponential runaway; the live divergence is invariant to all five interventions, so the remaining cause sits deeper in the gz_ros2_control command/measurement loop (next suspects: