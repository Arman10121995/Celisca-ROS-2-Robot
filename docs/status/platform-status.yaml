          - "docs/status/evidence/r52-go2-policy-2026-09-25/perturbation_trial_20260925T20N/: negative control - a 20 N pulse produced no response distinguishable from nominal stance noise (pulse-window tilt 0.026 rad below the 0.030 rad pre-pulse window), consistent with the estimated ~30 N static tipping threshold absorbing the disturbance. Recorded so the 35 N result is not over-read as general disturbance rejection."
          - "docs/status/evidence/r52-go2-policy-2026-09-25/perturbation_trial_20260925T152342Z/: retained negative evidence - the first attempt used ROS_DOMAIN_ID=241, outside this host's CycloneDDS port range, and failed at node creation before any trial ran. Valid trials used domain 231."
