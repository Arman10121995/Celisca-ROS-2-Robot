          the exact committed law (balance_targets + pd_effort_command, 50 Hz, +/-20
          N.m) - the 50 Hz control rate is discretely unstable (zero-order-hold torque
          staleness) for Kp=120 on the low-inertia ankle/foot links; rate sweep at
          500 Hz sim: stable at >= 125 Hz, diverges at 50/25 Hz; BALANCE_RATE_HZ 50
