        evidence:
          - "Named host recorded (docs/status/evidence/r82-isaac-jetson-2026-09-16/host.json): Jetson AGX Orin Developer Kit, L4T R36.5.2, kernel 5.15.199-tegra aarch64, Ubuntu 22.04.5, 12 cores, 61 GiB, Orin nvgpu driver 540.5.0, CUDA 12.6; Isaac Sim 6.0.1 local source build under its own Python 3.12 via robot_lab_utils.isaac_env.find_isaac_python; PhysX falls back to CPU ('Failed to load CUDA module data. Cuda error code 222')."
          - "Live startup/command/sensor/reset on that host: 2026-09-16 cross-backend probe (scripts/sim_sensor_probe.sh, probe_isaac.json + launch log) - /scan 360/360 rays within 5 cm of the map ray-cast (median 0.000 m); RGB-D 320x240 rgb8 + 32FC1 with centre depth 7.340 m vs 7.338 m ray-cast, finite-depth fraction 0.754; straight 0.3 m/s -> pose speed 0.298 m/s, abs vy 0.0044, wheel velocities 9.088/9.097 rad/s against 9.09 commanded; 0.15 m/s + 0.6 rad/s -> yaw rate 0.587 rad/s; /robot_lab/reset returns to 0.000 m from start with a monotonic clock. Same probe re-run against PyBullet and MuJoCo for comparison."
          - "Wheel-drive instability isolated and fixed: the 53 g wheels (~2e-5 kg m^2 about the axle) make a velocity drive unstable without rotor inertia, and colliders generated from visual meshes give faceted convex-hull wheels that bounce and drift. The runtime now authors physxJoint:armature 0.005 on driven wheel joints and imports the description's own <collision> geometry by default. Offline variant matrix (isaac_drive_diag.py, drive_variants.txt): straight 0.300 m/s with 0.000 rad/s yaw drift and turn 0.590-0.595 rad/s for 0.6 commanded."
          - "Live R4 mission (docs/status/evidence/r82-isaac-mission-2026-09-16): 5 evaluation seeds (1201-1205) drive bumperbot 1.5 m ahead of its spawn pose in nav_empty through the harness robot-lab-live-mission on isolated ROS domains; all 5 truthful success outcomes, 0 contact events, 1.3507 +/- 0.0004 m measured trajectory (min 1.3501, max 1.3510), mean 5.44 s sim, mean RTF 0.131 on this host, real rosbag2 captures of 4840-4897 msgs/run. Cross-backend: MuJoCo 1.3531 +/- 0.0027 m at RTF 0.378, PyBullet 1.3535 +/- 0.0014 m at RTF 0.349 for the same scenario."
          - "The mission is reproducible through the repo's own test entry point: src/robot_lab/robot_lab_benchmark/test/test_live_mission.py::test_live_mission_isaac_seed1201 (added 2026-09-16, opt-in via ROBOT_LAB_RUN_LIVE_MISSION=1, mirroring the MuJoCo/PyBullet live tests) passes for real: 1 passed in 70.65 s, exit 0, having driven the mission through 'ros2 run robot_lab_benchmark robot-lab-live-mission' rather than a bare console script. The default suite still skips it (20 passed, 3 skipped) so the regular run never touches a ROS graph."
          - "Child failure / offline are not reported as success: src/robot_lab_bringup/test/test_isaac_runtime_shutdown.py 5 passed (EOF-graceful, hung-wrapper SIGTERM->SIGKILL, SIGTERM-honouring, already-stopped, stop budget inside launch's escalation) plus the live SIGINT stop (launch exits in 2 s, no Kit process left, verified with the process group); test_readiness_contracts.py::test_isaac_health_reports_offline_mode asserts WARN health with no physics in offline mode and test_simulator_backends.py asserts the spawner warns instead of claiming a spawn."
        next_action: "Complete 2026-09-16. Remaining limits, recorded rather than assumed: missions are qualified on the open arena nav_empty only (obstacle worlds belong to R6.1/R8.1); the mission controller consumes /odom/ground_truth (truth, not a localization estimate) so no localization stack is qualified on Isaac; the ~15 % wheel/body speed gap from the 2026-09-14 drive work is not isolated, though the 2026-09-16 probe measures wheel velocities and body speed within 1 %; Isaac publishes /scan every 12 physics steps (27 msgs per run), so scan-driven autonomy would need its own check; RTF 0.131 with PhysX on the CPU; other robots are not run through Isaac."
