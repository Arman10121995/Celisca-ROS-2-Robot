          tilt 2.86 rad, run 2 (12 s) SAFE_STOP at knees ~0.17-0.26 rad, part way
          into the squat — geometric instability of position-controlled standing without
          CoM/balance feedback, not ramp dynamics. Remaining R5.3 residual is therefore
          precisely scoped as closed-loop balance: either (a) effort-interface joint
          drive with the training PD gains (kp 10-20, kd 2) so the policy loop closes,
          or (b) a dedicated standing/balance controller for the squat-to-stand transition.
          Both are controller work, not bringup work. Option (a) implemented (2026-09-17,
          see docs/status/evidence/r53-bhl-effort-interface-2026-09-16/): the bhl_joint
          macro in bhl_ros2_control.xacro now declares an effort command interface
          (+/-20 N.m, matching the URDF bound and the balance controller saturation)
          in place of the position command interface, and bhl_controllers.yaml declares
          bhl_standing_controller as effort_controllers/JointGroupEffortController.
          Correction (same day, static verification of the installed plugin): that
          controller type is a *pure effort forwarder* - it derives from forward_command_controller/ForwardCommandController,
          its installed header states it ''forwards the commanded efforts down to
          a set of joints'', and its library exposes only interface_name as a parameter
          name (no kp/kd/ki/gains). Declaring kp/kd on it would therefore have been
          silently ignored, and the policy''s position values (rad) would have been
          written to the effort interfaces as torques (N.m). The kp/kd were removed
          from bhl_controllers.yaml (a contract test now asserts the file carries
          no dead gains) and the PD-effort loop is closed in the publishing nodes
          instead: humanoid_policy_controller and humanoid_standing_controller gained
          a command_interface parameter (effort by default, matching the description;
          position publishes raw targets and is kept for the position marshalling
          path) and convert their targets via bhl_balance.pd_effort_command (tau =
          Kp*(q* - q) + Kd*(0 - qdot), clamped to +/-20 N.m, zero effort for a joint
          with no measurement, zero on SAFE_STOP), with node parameters kp_legs/kd_legs/kp_arms/kd_arms
          defaulting to the repo''s own stance-PD constants (legs 120/4, arms 60/2
          - the vendored policy configs declare no gains, so the earlier ''kp 10-20,
          kd 2'' was a scoping estimate, not a value read from the checkpoints). pd_effort_command
          gained optional leg_gains/arm_gains overrides for this (pinned by TestPdGainOverrides
          in test_r5_3_bhl_balance.py). No separate parameter-file wiring was needed:
          the description plugin already loads this exact bhl_controllers.yaml, and
          the controller''s 22-joint list still equals BHL_JOINT_NAMES so the adapter/policy
          command ordering stays correct. A redundant bhl_controllers_effort.yaml
          draft was deleted (referenced by nothing; its ankle joint order diverged
          from the canonical order). Contract tests updated and green (2026-09-17):
