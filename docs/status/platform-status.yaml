EffortController. Correction (same day, static verification of the installed plugin): that controller type is a *pure effort forwarder* - it derives from forward_command_controller/ForwardCommandController, its installed header states it 'forwards the commanded efforts down to a set of joints', and its library exposes only interface_name as a parameter name (no kp/kd/ki/gains). Declaring kp/kd on it would therefore have been silently ignored, and the policy's position values (rad) would have been written to the effort interfaces as torques (N.m). The kp/kd were removed from bhl_controllers.yaml (a contract test now asserts the file carries no dead gains) and the PD-effort loop is closed in the publishing nodes instead: humanoid_policy_controller and humanoid_standing_controller gained a command_interface parameter (effort by default, matching the description; position publishes raw targets and is kept for the position marshalling path) and convert their targets via bhl_balance.pd_effort_command (tau = Kp*(q* - q) + Kd*(0 - qdot), clamped to +/-20 N.m, zero effort for a joint with no measurement, zero on SAFE_STOP), with node parameters kp_legs/kd_legs/kp_arms/kd_arms defaulting to the repo's own stance-PD constants (legs 120/4, arms 60/2 - the vendored policy configs declare no gains, so the earlier 'kp 10-20, kd 2' was a scoping estimate, not a value read from the checkpoints). pd_effort_command gained optional leg_gains/arm_gains overrides for this (pinned by TestPdGainOverrides in test_r5_3_bhl_balance.py). No separate parameter-file wiring was needed: the description plugin already loads this exact bhl_controllers.yaml, and the controller's 22-joint list still equals BHL_JOINT_NAMES so the adapter/policy command ordering stays correct. A redundant bhl_controllers_effort.yaml draft was deleted (referenced by nothing; its ankle joint order diverged from the canonical order). Contract tests updated and green (2026-09-17): test_sim_profiles.py (controller type + 22 