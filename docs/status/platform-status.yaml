table stance of the effort path. Remaining failure mode (3), open: a rigid-body pivot topple about the foot edge (tilt 0.005 to 1.27 rad in ~0.6 s with joints nearly still), caused by restoring stiffness (ankle PD 120 N.m/rad saturating at 20 N.m ~ 0.167 rad) being marginal against the gravity toppling stiffness (~86 N.m/rad at the 0.675 m CoM) and degraded further by the BHL 45-degree leg-axis mounting, which means body tilt does not map 1:1 onto ankle joint error. Holding stance needs gravity compensation from the URDF dynamics and/or a proper leg Jacobian (tilt to joint torques through the 45-degree axes) and/or a hip strategy with knees flexed inside the joint limits - quantitative justification for the option (b) dedicated balance controller; this is controller design, not bringup or wiring. Fast suite re-run after the changes: PASS (registry cross-reference PASS).  Continuation (2026-09-18, geometry audit of the parallel-ankle fix 80925bf): the same-sign parallel-ankle law stands (re-derived FK confirms both ankle-pitch axes +Y and both ankle-roll axes +X at the rest pose), but two of its pinned numbers were wrong and are corrected. (a) Sole height: the rest-pose sole bottom is +0.0400 m above the base origin, not +0.076 m - the earlier estimate ignored the Rx(90 deg) rotation of the sole collision box (box center z=0.06 in the base frame, half-thickness 0.02; the 0.006 m collision-origin z offset lives in the ROTATED ankle_roll frame and the box 0.04 m thickness axis maps to link y, not z). Verified three independent ways: full-SE(3) URDF FK of every foot collision element, pybullet collision AABBs with the base link pinned at the origin (z [+0.039,+0.081] incl. ~1 mm contact margin), and gz sdf -p on the exact spawned model (model frame == base link frame). Spawn z in robots.yaml corrected 0.078 -> 0.042: the old value dropped the soles 3.8 cm onto the ground at EVERY spawn - a symmetric flat drop, which is why the 2026-09-17 live trace shows clean tilt 0.000 for ~1.3 s and no tilt transient before the pivot topple, but it is an avoidable impact on the ankle gears at every start. (b) Topple stiffness: TOPPLE_STIFFNESS_NM_PER_RAD corrected to ~70.9 N.m/rad (16.3312 kg total mass, whole-body CoM z=0.4823 m in the base frame -> CoM 0.4423 m above the geometric sole (the pybullet AABB reports 0.039 - its ~1 mm contact-break padding - and the FK figure is the geometric truth)). The earlier ~108 N.m/rad used h=0.675 m, which is the base inertial origin height above the base ORIGIN, not the CoM height above the SOLE - it overestimated gravity by ~1.5x. The K=0.7 gain is therefore a ~2.4x margin, not 1.5x; gain values themselves unchanged (the unstable-direction conclusion for the earlier K=0.12/0.15 still holds: ~29 N.m/rad < 71 N.m/rad). Note the same-day failure-mode (3) text above quotes ~86 N.m/rad at the 0.675 m CoM - superseded by the 71 N.m/rad figure; the qualitative conclusion (ankle PD saturating at 20 N.m is marginal and the 45-degree leg-axis mounting breaks the 1:1 tilt-to-ankle map) is unchanged. Evidence: docs/status/evidence/r53-bhl-ankle-fix-2026-09-17/sole_height_probe.{py,txt} (re-runnable). Tests: test_r5_3_bhl_balance.py 62 pass; full adapter suite 243 passed + 2 pre-existing environment failures in test_r5_3_bhl_policy_adapter that fail identically on clean HEAD (stale anyio/pytest plugin pin, unrelated). Next: live dispatch-path re-run with z=0.042 to confirm no spawn-drop transient; the open controller-design item is unchanged.  Continuation (2026-09-21, spawn sign + control-rate root cause + plant validation of the committed law): (a) SPAWN SIGN - the 2026-09-18 z=0.042 was itself sign-flipped: the sole is ABOVE the base origin, so the base origin must spawn BELOW ground; robots.yaml corrected z 0.042 -> -0.038 (2 mm settling margin). Plant-verified in pybullet: base at -0.038 establishes 8 foot contacts with Fz ~157 N (the full weight) within 25 ms; the same robot at +0.042 never touches down. The so