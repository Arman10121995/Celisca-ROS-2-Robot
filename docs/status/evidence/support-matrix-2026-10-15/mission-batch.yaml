# Mission reports of October 13-15 indexed by scripts/r9_3_index_missions.py.
# Order matters: within one robot/map/backend/pattern cell the last record
# controls the matrix, so rounds are listed in the order they ran.
date: '2026-10-15'
scope: "Exact hashed named simulation screens through October 15; unlisted cells remain untested."
source_files:
  - scripts/sim_nav_mission.py
  - scripts/sim_nav_mission.sh
  - scripts/gazebo_isolation.sh
  - src/robot_lab_bringup/launch/simulated_robot.launch.py
  - src/robot_lab_bringup/config/sim_maps.yaml
  - src/robot_lab_navigation/launch/navigation.launch.py
  - src/robot_lab_navigation/config/controller_server.yaml
  - src/robot_lab_navigation/config/planner_server.yaml
  - src/robot_lab_robots/config/robots.yaml
  - src/robot_lab_mujoco/python/robot_lab_mujoco/mujoco_spawner.py
  - src/robot_lab_pybullet/python/robot_lab_pybullet/pybullet_spawner.py
  - src/robot_lab_isaac/python/robot_lab_isaac/isaac_runtime.py
  - src/robot_lab_isaac/python/robot_lab_isaac/isaac_spawner.py
legged_files: &legged
  - src/robot_lab_algorithms/robot_lab_algorithms/leg_odometry.py
  - src/robot_lab_navigation/config/robots/unitree_go2.yaml
  - src/robot_lab_navigation/config/robots/unitree_a1.yaml
  - src/robot_lab_navigation/config/robots/unitree_b2.yaml
  - src/robot_lab_navigation/config/robots/unitree_g1_29dof.yaml
legged_scope: &legged_scope >-
  nav_obstacle mission (detour goal, cancel after travel with stop check,
  resume, near-obstacle goal) for a walking robot on its provisioned policy
  with leg kinematic odometry; truth-measured final poses after a settled
  simulated second. Round details in docs/status/evidence/p7-legged-navigation-2026-10-13.
legged_limits: &legged_limits
  - One goal seed per report; repeats are separate records
  - Flat nav_obstacle world; no terrain
  - Source hashes derived from git at the recorded revision after the run
groups:
