      before each arc) corrects the heading after Nav2 arrives.  Gates within
      0.30 m of truth, the bay within 0.15 m and 10 degrees, footprint clear.
    limitations:
      - One run per cell; Gazebo repeated (course-r2, indexed after course, so it controls the Gazebo cells); flat floor, no traffic
      - No depth trim; most failures park 0.15-0.18 m short along the bay
