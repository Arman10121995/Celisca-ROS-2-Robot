<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 707" role="img"><title>01 · System at a glance</title><desc>C4 context / containers · click a component to trace its role and sources; designed diagram, not live telemetry.</desc><rect width="100%" height="100%" fill="#101824" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c93ad" /></marker></defs><text x="35" y="32" fill="#edf3fc" font-family="sans-serif" font-size="20">01 · System at a glance</text><polyline points="300,136.0 335.0,136.0 335.0,136.0 370,136.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="340.0" y="129.0" fill="#b8cadd" font-family="sans-serif" font-size="10">select</text><polyline points="370,136.0 335.0,136.0 335.0,291.0 300,291.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="340.0" y="206.5" fill="#b8cadd" font-family="sans-serif" font-size="10">resolve</text><polyline points="670,136.0 485.0,136.0 485.0,291.0 300,291.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="490.0" y="206.5" fill="#b8cadd" font-family="sans-serif" font-size="10">manifest</text><polyline points="300,291.0 335.0,291.0 335.0,291.0 370,291.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="340.0" y="284.0" fill="#b8cadd" font-family="sans-serif" font-size="10">start</text><polyline points="600,291.0 635.0,291.0 635.0,291.0 670,291.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="640.0" y="284.0" fill="#b8cadd" font-family="sans-serif" font-size="10">native state</text><polyline points="670,291.0 485.0,291.0 485.0,446.0 300,446.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="490.0" y="361.5" fill="#b8cadd" font-family="sans-serif" font-size="10">ROS data</text><polyline points="300,446.0 335.0,446.0 335.0,446.0 370,446.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="340.0" y="439.0" fill="#b8cadd" font-family="sans-serif" font-size="10">measurements</text><polyline points="670,446.0 635.0,446.0 635.0,291.0 600,291.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="640.0" y="361.5" fill="#b8cadd" font-family="sans-serif" font-size="10">forces</text><polyline points="185.0,555 185.0,446.0 185.0,446.0 185.0,337" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="190.0" y="439.0" fill="#b8cadd" font-family="sans-serif" font-size="10">owned run</text><polyline points="300,601.0 335.0,601.0 335.0,601.0 370,601.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="340.0" y="594.0" fill="#b8cadd" font-family="sans-serif" font-size="10">actual result</text><polyline points="600,601.0 635.0,601.0 635.0,601.0 670,601.0" fill="none" stroke="#7c93ad" stroke-width="1.7" marker-end="url(#arrow)" /><text x="640.0" y="594.0" fill="#b8cadd" font-family="sans-serif" font-size="10">artifacts</text><g><title>Select, launch, control and learn in one native Tk workspace.</title><rect x="70" y="90" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#72b7ff" /><text x="82" y="109" fill="#72b7ff" font-family="sans-serif" font-size="9">INTERFACE</text><text x="82" y="130" fill="#f1f5fc" font-family="sans-serif" font-size="13">Control center</text><text x="82" y="149" fill="#bccbdf" font-family="sans-serif" font-size="10">Select, launch, control and learn</text><text x="82" y="162" fill="#bccbdf" font-family="sans-serif" font-size="10">in one native Tk workspace.</text></g><g><title>Robot, world, mode and algorithm selections become explicit configuration.</title><rect x="370" y="90" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#b59bff" /><text x="382" y="109" fill="#b59bff" font-family="sans-serif" font-size="9">CONFIGURATION</text><text x="382" y="130" fill="#f1f5fc" font-family="sans-serif" font-size="13">Profiles &amp; capabilities</text><text x="382" y="149" fill="#bccbdf" font-family="sans-serif" font-size="10">Robot, world, mode and algorithm</text><text x="382" y="162" fill="#bccbdf" font-family="sans-serif" font-size="10">selections become explicit</text></g><g><title>Catalogs link robots, environments, algorithms, scenarios and experiments.</title><rect x="670" y="90" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#b59bff" /><text x="682" y="109" fill="#b59bff" font-family="sans-serif" font-size="9">CONFIGURATION</text><text x="682" y="130" fill="#f1f5fc" font-family="sans-serif" font-size="13">Typed registry</text><text x="682" y="149" fill="#bccbdf" font-family="sans-serif" font-size="10">Catalogs link robots, environments,</text><text x="682" y="162" fill="#bccbdf" font-family="sans-serif" font-size="10">algorithms, scenarios and</text></g><g><title>Resolve selections, start the correct stack and own its shutdown.</title><rect x="70" y="245" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#c0a1ff" /><text x="82" y="264" fill="#c0a1ff" font-family="sans-serif" font-size="9">ORCHESTRATION</text><text x="82" y="285" fill="#f1f5fc" font-family="sans-serif" font-size="13">Bringup &amp; process ownership</text><text x="82" y="304" fill="#bccbdf" font-family="sans-serif" font-size="10">Resolve selections, start the</text><text x="82" y="317" fill="#bccbdf" font-family="sans-serif" font-size="10">correct stack and own its shutdown.</text></g><g><title>Physics advances the robot and produces actual simulated measurements.</title><rect x="370" y="245" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#f49879" /><text x="382" y="264" fill="#f49879" font-family="sans-serif" font-size="9">SIMULATION</text><text x="382" y="285" fill="#f1f5fc" font-family="sans-serif" font-size="13">Simulator plant</text><text x="382" y="304" fill="#bccbdf" font-family="sans-serif" font-size="10">Physics advances the robot and</text><text x="382" y="317" fill="#bccbdf" font-family="sans-serif" font-size="10">produces actual simulated</text></g><g><title>Translate native sensors, commands, clocks and observed truth.</title><rect x="670" y="245" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#f49879" /><text x="682" y="264" fill="#f49879" font-family="sans-serif" font-size="9">SIMULATION</text><text x="682" y="285" fill="#f1f5fc" font-family="sans-serif" font-size="13">Engine ↔ ROS adapters</text><text x="682" y="304" fill="#bccbdf" font-family="sans-serif" font-size="10">Translate native sensors, commands,</text><text x="682" y="317" fill="#bccbdf" font-family="sans-serif" font-size="10">clocks and observed truth.</text></g><g><title>Scan, RGB-D, IMU and joint feedback feed different algorithms.</title><rect x="70" y="400" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#65cdd0" /><text x="82" y="419" fill="#65cdd0" font-family="sans-serif" font-size="9">ROS CONTRACT</text><text x="82" y="440" fill="#f1f5fc" font-family="sans-serif" font-size="13">Sensor streams</text><text x="82" y="459" fill="#bccbdf" font-family="sans-serif" font-size="10">Scan, RGB-D, IMU and joint feedback</text><text x="82" y="472" fill="#bccbdf" font-family="sans-serif" font-size="10">feed different algorithms.</text></g><g><title>Estimate motion from actual wheel/contact/IMU/visual measurements.</title><rect x="370" y="400" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#73d5ad" /><text x="382" y="419" fill="#73d5ad" font-family="sans-serif" font-size="9">ESTIMATION</text><text x="382" y="440" fill="#f1f5fc" font-family="sans-serif" font-size="13">Odometry &amp; estimation</text><text x="382" y="459" fill="#bccbdf" font-family="sans-serif" font-size="10">Estimate motion from actual</text><text x="382" y="472" fill="#bccbdf" font-family="sans-serif" font-size="10">wheel/contact/IMU/visual</text></g><g><title>Convert valid commands into native wheel/joint/rotor/thruster forces.</title><rect x="670" y="400" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#ffc974" /><text x="682" y="419" fill="#ffc974" font-family="sans-serif" font-size="9">CONTROL</text><text x="682" y="440" fill="#f1f5fc" font-family="sans-serif" font-size="13">Actuation adapters</text><text x="682" y="459" fill="#bccbdf" font-family="sans-serif" font-size="10">Convert valid commands into native</text><text x="682" y="472" fill="#bccbdf" font-family="sans-serif" font-size="10">wheel/joint/rotor/thruster forces.</text></g><g><title>Snapshot selected workflows and execute owned, bounded trials.</title><rect x="70" y="555" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#c1ccdf" /><text x="82" y="574" fill="#c1ccdf" font-family="sans-serif" font-size="9">EVIDENCE</text><text x="82" y="595" fill="#f1f5fc" font-family="sans-serif" font-size="13">Experiments &amp; workloads</text><text x="82" y="614" fill="#bccbdf" font-family="sans-serif" font-size="10">Snapshot selected workflows and</text><text x="82" y="627" fill="#bccbdf" font-family="sans-serif" font-size="10">execute owned, bounded trials.</text></g><g><title>Scope every support claim to actual source/model/map/backend/task evidence.</title><rect x="370" y="555" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#c1ccdf" /><text x="382" y="574" fill="#c1ccdf" font-family="sans-serif" font-size="9">EVIDENCE</text><text x="382" y="595" fill="#f1f5fc" font-family="sans-serif" font-size="13">Measurements &amp; status</text><text x="382" y="614" fill="#bccbdf" font-family="sans-serif" font-size="10">Scope every support claim to actual</text><text x="382" y="627" fill="#bccbdf" font-family="sans-serif" font-size="10">source/model/map/backend/task</text></g><g><title>Keep source, generated models, builds, caches, logs and bags on the SSD.</title><rect x="670" y="555" width="230" height="92" rx="12" fill="#1d2a3d" stroke="#c1ccdf" /><text x="682" y="574" fill="#c1ccdf" font-