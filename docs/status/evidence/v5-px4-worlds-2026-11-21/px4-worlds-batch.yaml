  - src/robot_lab_adapter/robot_lab_adapter/px4_sitl_runtime.py
  - src/robot_lab_adapter/robot_lab_adapter/resolver.py
  - src/robot_lab_utils/robot_lab_utils/aerial_planning.py
  - src/robot_lab_utils/robot_lab_utils/aerial_takeoff.py
  scope: Normal owned Tk Run, Check takeoff clearance (clear), Takeoff, seven direction buttons, altitude,
    release, Stop, publisher loss and Land with native X500/PX4 SITL in Gazebo Harmonic on the aerial_course
    world; independent Gazebo body.
  limitations:
  - One run on this world
  - No obstacle planner in the manual screen
  - Static selected-world takeoff check; actors and contacts are not checked
