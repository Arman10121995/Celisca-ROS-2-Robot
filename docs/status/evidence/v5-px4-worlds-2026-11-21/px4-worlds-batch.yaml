# V5: PX4 X500 manual-flight GUI screen on the installed worlds, indexed by
# scripts/r9_3_index_missions.py. terrain_heightfield is not indexed: the takeoff
# gate refused its buried spawn, so no flight report exists (README).
date: '2026-11-22'
scope: Exact hashed named simulation screens; unlisted cells remain untested.
source_files:
- scripts/qualify_px4_drive_gui.py
- src/robot_lab_robots/config/robots.yaml
groups:
- reports:
  - docs/status/evidence/v5-px4-worlds-2026-11-21/aerial_course-fixed/report-measured.json
  report_kind: flight_manual_screen
  identity:
    robot_id: px4_x500
    environment_id: aerial_course
    simulator: gazebo
    task_type: flight
  date: '2026-11-21'
  revision: de9501a3 with the uncommitted takeoff_ready wait in the qualifier (exact producer.py beside
    the report); ROS domain 117, display :0
  hash_revision: de9501a3
  source_files: &id001
  - src/robot_lab_gui/robot_lab_gui/drone_planning_controls.py
  - src/robot_lab_adapter/robot_lab_adapter/px4_planning.py
