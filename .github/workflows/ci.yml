name: ROS 2 CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Install ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install Python dependencies
        shell: bash
        run: |
          pip3 install pytest pybullet mujoco numpy

      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build core workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-skip orbslam3 \
            --event-handlers console_direct+

      - name: Fast PR tests (P7.1)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          bash scripts/test_fast.sh

      - name: Simulator backend tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          cd build/robot_lab_bringup && \
          python3 -m pytest test_simulator_backends.py -v 2>&1 || true
