name: ROS 2 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build core workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-skip orbslam3 \
            --event-handlers console_direct+

      - name: Validate robot_lab_registry
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          # Validate the registry catalogs
          ros2 run robot_lab_registry robot-lab validate -c src/robot_lab/robot_lab_registry/config
          # Run registry test suite
          python3 src/robot_lab/robot_lab_registry/test/test_registry.py
          # Run Bumperbot reference-robot qualification suite (P3.1)
          python3 src/robot_lab/robot_lab_registry/test/test_bumperbot_qualification.py
          # Run Labbot second-robot qualification suite (P3.2)
          python3 src/robot_lab/robot_lab_registry/test/test_labbot_qualification.py

      - name: Test core workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 colcon test \
            --packages-skip orbslam3 --python-testing pytest \
            --event-handlers console_direct+
          colcon test-result --verbose
