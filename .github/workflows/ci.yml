name: ROS 2 CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Install ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install Python dependencies
        shell: bash
        run: |
          pip3 install pytest pybullet mujoco numpy

      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update
          # Fail the job when declared deps cannot resolve (no more || true).
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build core workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          # ORB_SLAM3 is optional (its kit/install are host-specific and
          # it is not part of the audited baseline). Keep it skipped here.
          colcon build --symlink-install --packages-skip orbslam3 \
            --event-handlers console_direct+

      - name: Fast tier (unit/numerical/config; no ROS graph needed)
        shell: bash
        run: |
          bash scripts/test_tiers.sh fast

      - name: Physics tier (optional engines; explicit per-engine skips)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          bash scripts/test_tiers.sh physics

      - name: Integration tier (launch-contract, xacro, qualification)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          bash scripts/test_tiers.sh integration

      - name: Registry cross-reference validation
        shell: bash
        run: |
          PYTHONPATH=src/robot_lab/robot_lab_registry python3 -c "
          from robot_lab_registry.catalog import Registry
          from robot_lab_registry.validation import validate_cross_references
          reg = Registry('src/robot_lab/robot_lab_registry/config')
          reg.load('src/robot_lab/robot_lab_registry/config')
          result = validate_cross_references(reg)
          assert result.valid, f'Cross-reference errors: {result.errors}'
          print('Registry cross-reference validation: PASS')
          "
