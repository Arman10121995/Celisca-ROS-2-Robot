bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.3
    default_server_timeout: 1000
    bt_loop_duration: 10
    wait_for_service_timeout: 1000
    # Resolved portably by robot_lab_navigation/launch/navigation.launch.py
    # via the package share directory; empty means Nav2's built-in default BT.
    default_nav_to_pose_bt_xml: ""
