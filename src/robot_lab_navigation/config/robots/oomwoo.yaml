# Per-robot navigation overlay for 'oomwoo' (merged over controller_server.yaml / planner_server.yaml)
# 0.33 m round robot vacuum (radius 0.165).  The cleaning system drives the
# robot itself; Nav2 is only used for goals sent from the GUI/RViz.
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.17
      inflation_layer:
        inflation_radius: 0.45
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.17
      inflation_layer:
        inflation_radius: 0.45
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.3
      vx_max: 0.3
