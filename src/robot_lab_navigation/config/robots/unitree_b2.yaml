# Per-robot navigation overlay for 'unitree_b2' (merged over controller_server.yaml / planner_server.yaml)
# Walking on its provisioned rl_sar policy with leg kinematic odometry
# (2026-10-13, implemented and experimental; see docs/tutorials/legged-policies.md).
# b2_robot_lab tracks 0.26 of 0.4 m/s, spins (0.89 rad/s) and does not strafe.
# Footprint: about 1.10 x 0.50 m with the legs.
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.55, 0.25], [0.55, -0.25], [-0.55, -0.25], [-0.55, 0.25]]"
      inflation_layer:
        inflation_radius: 0.6
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.55, 0.25], [0.55, -0.25], [-0.55, -0.25], [-0.55, 0.25]]"
      inflation_layer:
        inflation_radius: 0.6
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
    FollowPath:
      desired_linear_vel: 0.35
      vx_max: 0.35
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      regulated_linear_scaling_min_speed: 0.25
      regulated_linear_scaling_min_radius: 0.5
      # Learned gaits barely move below ~0.15 m/s (G1 stalled 0.5 m short of
      # a goal at the 0.1 m/s approach speed, MuJoCo 2026-10-13).
      min_approach_linear_velocity: 0.2
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      max_angular_accel: 2.0
