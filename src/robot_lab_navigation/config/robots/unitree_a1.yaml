# Per-robot navigation overlay for 'unitree_a1' (merged over controller_server.yaml / planner_server.yaml)
# Walking on its provisioned rl_sar policy with leg kinematic odometry
# (2026-10-13, implemented and experimental; see docs/tutorials/legged-policies.md).
# a1_legged_gym spins on the spot (0.93 of 1.0 rad/s) and tracks 0.36 of 0.4 m/s.
# Footprint: about 0.6 x 0.3 m, circumscribed radius about 0.34 m.
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.34
      inflation_layer:
        inflation_radius: 0.6
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.34
      inflation_layer:
        inflation_radius: 0.6
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
    FollowPath:
      desired_linear_vel: 0.4
      vx_max: 0.4
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      regulated_linear_scaling_min_speed: 0.2
      regulated_linear_scaling_min_radius: 0.5
      min_approach_linear_velocity: 0.1
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      max_angular_accel: 2.0
