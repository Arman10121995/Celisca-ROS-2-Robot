# Per-robot navigation overlay for 'unitree_a1' (merged over controller_server.yaml / planner_server.yaml)
# Walking on its provisioned rl_sar policy with leg kinematic odometry
# (2026-10-13, implemented and experimental; see docs/tutorials/legged-policies.md).
# a1_legged_gym spins on the spot (0.93 of 1.0 rad/s) and tracks 0.36 of 0.4 m/s.
# Footprint: about 0.60 x 0.32 m with the legs.
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.30, 0.16], [0.30, -0.16], [-0.30, -0.16], [-0.30, 0.16]]"
      inflation_layer:
        inflation_radius: 0.45
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.30, 0.16], [0.30, -0.16], [-0.30, -0.16], [-0.30, 0.16]]"
      inflation_layer:
        inflation_radius: 0.45
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
    FollowPath:
      desired_linear_vel: 0.4
      vx_max: 0.4
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      regulated_linear_scaling_min_speed: 0.25
      regulated_linear_scaling_min_radius: 0.5
      # Learned gaits barely move below ~0.15 m/s (G1 stalled 0.5 m short of
      # a goal at the 0.1 m/s approach speed, MuJoCo 2026-10-13).
      min_approach_linear_velocity: 0.2
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      # RPP ramps its in-place turn from the measured yaw rate by
      # max_angular_accel * dt; a gait that does not respond to 0.1 rad/s
      # never ramps up (B2 and A1 turned at 0.03 rad/s and failed to make
      # progress, MuJoCo 2026-10-13), so the ramp is effectively removed.
      max_angular_accel: 20.0
