# Per-robot navigation overlay for 'labbot' (merged over controller_server.yaml / planner_server.yaml)
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.18
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.18
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.03
    FollowPath:
      # DWB's RotateToGoal critic has its own tolerance. Match the goal
      # checker so it keeps translating until the requested arrival window.
      xy_goal_tolerance: 0.07
      desired_linear_vel: 0.5
      rotate_to_heading_angular_vel: 0.15
