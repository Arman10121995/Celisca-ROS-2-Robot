# Per-robot navigation overlay for 'unitree_go2' (merged over controller_server.yaml / planner_server.yaml)
# Walking on its provisioned rl_sar policy with leg kinematic odometry
# (2026-10-13, implemented and experimental; see docs/tutorials/legged-policies.md).
# go2_himloco tracks 0.26-0.36 m/s of a 0.4 m/s command and turns only while
# walking (0.014 of 1.0 rad/s on the spot, MuJoCo 2026-10-12), so RPP never
# rotates in place and the goal yaw is not enforced (yaw tolerance > pi).
# Footprint: the 0.70 x 0.31 m body (head included) with the legs; a 0.38 m circle
# put the 0.5 m spawn clearance of nav_obstacle inside the inscribed zone, so RPP
# reported "collision ahead" from the start (MuJoCo, 2026-10-13).
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.36, 0.18], [0.36, -0.18], [-0.33, -0.18], [-0.33, 0.18]]"
      # 0.7 m at cost scaling 2.0 (2026-10-16): with 0.45 m at the default
      # 3.0, barely past the 0.40 m circumscribed radius, the Isaac seed-3
      # route to goal B ran beside the block until Regulated Pure Pursuit
      # stopped on "collision ahead" and the goal aborted (as the cars did).
      inflation_layer:
        inflation_radius: 0.7
        cost_scaling_factor: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.36, 0.18], [0.36, -0.18], [-0.33, -0.18], [-0.33, 0.18]]"
      inflation_layer:
        inflation_radius: 0.45
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.2
    FollowPath:
      desired_linear_vel: 0.4
      vx_max: 0.4
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.8
      regulated_linear_scaling_min_speed: 0.25
      regulated_linear_scaling_min_radius: 0.5
      # Learned gaits barely move below ~0.15 m/s (G1 stalled 0.5 m short of
      # a goal at the 0.1 m/s approach speed, MuJoCo 2026-10-13).
      min_approach_linear_velocity: 0.2
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      # RPP ramps its in-place turn from the measured yaw rate by
      # max_angular_accel * dt; a gait that does not respond to 0.1 rad/s
      # never ramps up (B2 and A1 turned at 0.03 rad/s and failed to make
      # progress, MuJoCo 2026-10-13), so the ramp is effectively removed.
      max_angular_accel: 20.0
