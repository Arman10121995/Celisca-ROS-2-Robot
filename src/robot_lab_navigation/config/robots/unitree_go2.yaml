# Per-robot navigation overlay for 'unitree_go2' (merged over controller_server.yaml / planner_server.yaml)
# Walking on its provisioned rl_sar policy with leg kinematic odometry
# (2026-10-13, implemented and experimental; see docs/tutorials/legged-policies.md).
# go2_himloco tracks 0.26-0.36 m/s of a 0.4 m/s command and turns only while
# walking (0.014 of 1.0 rad/s on the spot, MuJoCo 2026-10-12), so RPP never
# rotates in place and the goal yaw is not enforced (yaw tolerance > pi).
# Footprint: 0.70 x 0.31 m body, circumscribed radius about 0.38 m.
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.38
      inflation_layer:
        inflation_radius: 0.65
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.38
      inflation_layer:
        inflation_radius: 0.65
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.2
    FollowPath:
      desired_linear_vel: 0.4
      vx_max: 0.4
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.8
      regulated_linear_scaling_min_speed: 0.2
      regulated_linear_scaling_min_radius: 0.5
      min_approach_linear_velocity: 0.1
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      max_angular_accel: 2.0
