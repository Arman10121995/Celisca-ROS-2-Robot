# Source chassis x ±0.3595 m, wheels y ±0.3315 m; include a small margin.
controller_server:
  ros__parameters:
    FollowPath:
      min_vel_x: -0.3
      max_vel_x: 0.3
      max_speed_xy: 0.3
      max_vel_theta: 0.4
      vx_max: 0.3
      vx_min: -0.3
      wz_max: 0.4
      desired_linear_vel: 0.3
    progress_checker:
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.38, 0.35], [0.38, -0.35], [-0.38, -0.35], [-0.38, 0.35]]"
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.65
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.38, 0.35], [0.38, -0.35], [-0.38, -0.35], [-0.38, 0.35]]"
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.65
