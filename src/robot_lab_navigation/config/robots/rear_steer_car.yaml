# Per-robot navigation overlay for 'rear_steer_car' (rear-steered car: the fixed front axle is the base frame and the body extends 0.42 m behind it).
# The footprint polygon replaces robot_radius; the car-specific planner and
# path-follower settings come from navigation.launch.py (motion_model:=ackermann).
controller_server:
  ros__parameters:
    # 2026-10-16: with the 0.25 m default the stateful goal checker ended
    # every car goal as soon as the estimate entered that circle, so goal B
    # finished 0.26-0.36 m from truth in all four backends.  Every other
    # wheeled base already uses 0.07-0.08 m; a car needs room to settle
    # without turning on the spot.
    general_goal_checker:
      xy_goal_tolerance: 0.1
planner_server:
  ros__parameters:
    # 2026-10-19 (car course, MuJoCo and Gazebo): Hybrid-A*'s analytic
    # Reeds-Shepp shot (3 m) is only collision-checked, not cost-weighted,
    # so the path from the spawn to gate 1 grazed cone 0. A rear-steered
    # body swings its 0.42 m tail outward while correcting; it reached the
    # cone's lethal cells, the controller stopped ("collision ahead") and
    # every replan started "in lethal space". Shorter shots and a stronger
    # cost penalty keep the searched path off the cones.
    GridBased:
      analytic_expansion_max_length: 1.0
      cost_penalty: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.10, 0.17], [0.10, -0.17], [-0.42, -0.17], [-0.42, 0.17]]"
      # 2026-10-16: with 0.35 m at the default 3.0 falloff, less than the
      # 0.45 m circumscribed radius, Hybrid-A* routed the seed-3 detour
      # within a cell of the nav_obstacle block, where the swinging body end
      # touched lethal cells and the next replan aborted.  Wider and flatter
      # keeps the route off the block while the near-obstacle goal (0.55 m
      # clearance) stays reachable.
      inflation_layer:
        inflation_radius: 0.6
        cost_scaling_factor: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.10, 0.17], [0.10, -0.17], [-0.42, -0.17], [-0.42, 0.17]]"
      inflation_layer:
        inflation_radius: 0.35
