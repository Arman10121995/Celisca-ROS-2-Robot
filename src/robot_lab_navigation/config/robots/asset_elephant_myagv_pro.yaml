# Official CAD envelope; lab sensor/contact/controller adapter remains experimental.
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[0.29,0.205],[0.29,-0.205],[-0.29,-0.205],[-0.29,0.205]]'
      footprint_padding: 0.03
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[0.29,0.205],[0.29,-0.205],[-0.29,-0.205],[-0.29,0.205]]'
      footprint_padding: 0.03
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    general_goal_checker:
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.04
      stateful: true
    progress_checker:
      required_movement_radius: 0.04
      movement_time_allowance: 30.0
    FollowPath:
      # DWB's RotateToGoal has its own XY threshold. It must match the
      # goal checker or translation stops before the tighter goal is reached.
      xy_goal_tolerance: 0.07
      trans_stopped_velocity: 0.02
      vx_samples: 12
      vy_samples: 5
      vtheta_samples: 12
      sim_time: 1.2
      min_vel_x: -0.2
      max_vel_x: 0.3
      min_vel_y: -0.2
      max_vel_y: 0.2
      max_vel_theta: 0.4
      max_speed_xy: 0.3
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.5
      decel_lim_x: -0.3
      decel_lim_y: -0.3
      decel_lim_theta: -0.5
