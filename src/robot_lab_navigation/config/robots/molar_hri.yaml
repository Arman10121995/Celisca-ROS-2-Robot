# Per-robot navigation overlay for 'molar_hri' and 'probot_l' (merged over
# controller_server.yaml / planner_server.yaml).  Footprint from the
# description's collision boxes below the deck (x -0.325..0.375 m,
# y +/-0.31 m), unpadded: CELISCA floor 1's narrowest opening on the measured
# route is 0.80 m (0.40 m clearance), 9 cm each side of the 0.62 m body.
# A steep inflation decay keeps the middle of such an opening cheap.
# base_link is the root frame.  The drive
# limits (0.25 m/s, 0.5 rad/s) are the profile's; the base is inhibited
# while the telescope is out (articulation contract), so navigate with it in.
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_link
      footprint: "[[0.375, 0.31], [0.375, -0.31], [-0.325, -0.31], [-0.325, 0.31]]"
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_link
      footprint: "[[0.375, 0.31], [0.375, -0.31], [-0.325, -0.31], [-0.325, 0.31]]"
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 60.0
    general_goal_checker:
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
    FollowPath:
      xy_goal_tolerance: 0.1
      desired_linear_vel: 0.22
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 0.5
      min_approach_linear_velocity: 0.04
      regulated_linear_scaling_min_speed: 0.08
      max_vel_x: 0.25
      max_speed_xy: 0.25
      max_vel_theta: 0.5
      acc_lim_x: 0.3
      decel_lim_x: -0.3
      acc_lim_theta: 0.5
      decel_lim_theta: -0.5
bt_navigator:
  ros__parameters:
    robot_base_frame: base_link
behavior_server:
  ros__parameters:
    robot_base_frame: base_link
    rotational_acc_lim: 0.5
    max_rotational_vel: 0.5
