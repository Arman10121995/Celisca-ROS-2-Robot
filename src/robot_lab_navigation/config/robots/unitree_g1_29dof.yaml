# Per-robot navigation overlay for 'unitree_g1_29dof' (merged over controller_server.yaml / planner_server.yaml)
# Walking on its provisioned rl_sar policy with leg kinematic odometry
# (2026-10-13, implemented and experimental; see docs/tutorials/legged-policies.md).
# g1_robomimic_locomotion walks 0.38-0.39 m/s, spins and strafes
# (MuJoCo and Isaac, 2026-10-12). Footprint radius about 0.3 m.
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.3
      # Plan through the middle of corridors: the G1 walked 0.44-0.48 m from
      # the west wall while still turning, its leg-odometry estimate sat
      # 0.1-0.2 m nearer, and the planner found that estimated start inside
      # the inscribed radius (Isaac seed 3, 2026-10-13).  A wider, flatter
      # inflation keeps planned paths further from walls.
      inflation_layer:
        inflation_radius: 0.8
        cost_scaling_factor: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.3
      inflation_layer:
        inflation_radius: 0.55
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
    FollowPath:
      desired_linear_vel: 0.35
      vx_max: 0.35
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      regulated_linear_scaling_min_speed: 0.3
      regulated_linear_scaling_min_radius: 0.5
      # Learned gaits do not move below a policy-specific speed.  The G1
      # stalled 0.5 m short of a goal at a 0.1 m/s approach speed, and it
      # stands still at 0.2 in MuJoCo and Isaac while its leg odometry
      # creeps on: in Isaac, Nav2 declared both goals reached 0.49 and
      # 0.58 m from truth (round 3, 2026-10-13).  It walks 0.29 m/s at 0.3.
      min_approach_linear_velocity: 0.3
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      # RPP ramps its in-place turn from the measured yaw rate by
      # max_angular_accel * dt; a gait that does not respond to 0.1 rad/s
      # never ramps up (B2 and A1 turned at 0.03 rad/s and failed to make
      # progress, MuJoCo 2026-10-13), so the ramp is effectively removed.
      max_angular_accel: 20.0
