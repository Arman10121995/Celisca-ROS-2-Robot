# Official PAL TIAGo (PMB2 base, round, 0.27 m radius); lab drive limits
# from the profile (0.2 m/s, 0.4 rad/s, 0.2 m/s^2). The fetch node replaces
# the footprint with the arm and payload while it carries (R5.9).
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.3
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.55
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.3
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.55
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    general_goal_checker:
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.05
      stateful: true
    progress_checker:
      required_movement_radius: 0.04
      movement_time_allowance: 30.0
    FollowPath:
      # DWB's RotateToGoal has its own XY threshold. It must match the
      # goal checker or translation stops before the tighter goal is reached.
      xy_goal_tolerance: 0.07
      trans_stopped_velocity: 0.02
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 16
      sim_time: 1.5
      min_vel_x: -0.1
      max_vel_x: 0.2
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.4
      max_speed_xy: 0.2
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      acc_lim_theta: 0.4
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -0.4
