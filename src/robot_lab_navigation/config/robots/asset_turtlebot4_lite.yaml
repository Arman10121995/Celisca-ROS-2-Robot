# Original Create 3 collision radius at rest: 0.177682 m.
# The 0.185 m envelope includes the caster and TurtleBot4 attachments.
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_link
      robot_radius: 0.185
      inflation_layer:
        inflation_radius: 0.35
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_link
      robot_radius: 0.185
      inflation_layer:
        inflation_radius: 0.35
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 60.0
    general_goal_checker:
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.015
    # Native suspension/casters need a slow final rotation to settle within
    # the heading window after the controller stops publishing.
    FollowPath:
      desired_linear_vel: 0.25
      rotate_to_heading_angular_vel: 0.12
      max_angular_accel: 2.0
      min_approach_linear_velocity: 0.04
      regulated_linear_scaling_min_speed: 0.1
      max_vel_x: 0.3
      max_speed_xy: 0.3
      max_vel_theta: 1.2
      acc_lim_x: 0.5
      decel_lim_x: -0.5
      acc_lim_theta: 2.0
      decel_lim_theta: -2.0
bt_navigator:
  ros__parameters:
    robot_base_frame: base_link
behavior_server:
  ros__parameters:
    robot_base_frame: base_link
    rotational_acc_lim: 2.0
    max_rotational_vel: 0.6
