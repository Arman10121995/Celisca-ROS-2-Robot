# Chassis and the full wheel swept envelope, with a small clearance.
controller_server:
  ros__parameters:
    # 2026-10-13: as for the 4WS car, the base progress checker (0.5 m in
    # 10 s) aborted goals reached to 0.09 m while DWB made its slow final
    # alignment (MuJoCo rerun); same checker and arrival heading as 4WS.
    progress_checker:
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.05
    FollowPath:
      xy_goal_tolerance: 0.08
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.25, 0.22], [0.25, -0.22], [-0.25, -0.22], [-0.25, 0.22]]"
      footprint_padding: 0.05
      inflation_layer:
        inflation_radius: 0.65
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.25, 0.22], [0.25, -0.22], [-0.25, -0.22], [-0.25, 0.22]]"
      footprint_padding: 0.05
      inflation_layer:
        inflation_radius: 0.65
