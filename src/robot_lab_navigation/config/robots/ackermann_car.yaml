# Per-robot navigation overlay for 'ackermann_car' (front-steered car: the fixed rear axle is the base frame and the body extends 0.42 m ahead of it).
# The footprint polygon replaces robot_radius; the car-specific planner and
# path-follower settings come from navigation.launch.py (motion_model:=ackermann).
controller_server:
  ros__parameters:
    # 2026-10-16: with the 0.25 m default the stateful goal checker ended
    # every car goal as soon as the estimate entered that circle, so goal B
    # finished 0.26-0.36 m from truth in all four backends.  Every other
    # wheeled base already uses 0.07-0.08 m; a car needs room to settle
    # without turning on the spot.
    general_goal_checker:
      xy_goal_tolerance: 0.1
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.42, 0.17], [0.42, -0.17], [-0.10, -0.17], [-0.10, 0.17]]"
      inflation_layer:
        inflation_radius: 0.35
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[0.42, 0.17], [0.42, -0.17], [-0.10, -0.17], [-0.10, 0.17]]"
      inflation_layer:
        inflation_radius: 0.35
