        - "performance_metrics"
    
    # Experiment 3: Regulated Pure Pursuit - Path Following
    local_planning_regulated_pure_pursuit:
      experiment_id: "local_planning_regulated_pure_pursuit"
      category: "local_planning"
      method_id: "regulated_pure_pursuit"
      input_stratum: "planning_2d_continuous"
      robot_class: "mobile"
      environment: "nav_maze"
      simulator: "gazebo"
      seeds: [6011, 6012, 6013, 6014, 6015]
      duration_seconds: 25.0
      description: "Benchmark Regulated Pure Pursuit path-following local planner in maze environment"
      
      metrics:
        - "path_following_error"
        - "curvature_handling"
        - "speed_regulation"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "waypoint_reaching_time"
        - "smoothness_score"
        
      success_criteria:
        path_following_error: "<= 0.1"  # meters
        curvature_handling: ">= 0.8"
        speed_regulation: "<= 0.2"  # max speed error
        
      failure_criteria:
        path_following_error: "> 0.5"  # meters
        curvature_handling: "< 0.5"
        speed_regulation: "> 0.5"  # max speed error
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 5.0
        memory_limit_mb: 256
        real_time_factor_min: 0.95
        timeout_seconds: 35.0
        
      input_generation:
        type: "path_following"
        lookahead_distance: 0.5
        max_lookahead_distance: 2.0
        curvature_gain: 1.0
        path_types: ["straight", "curved", "complex"]
        path_velocities: [0.2, 0.3, 0.4]
        
      expected_output:
        - "Twist messages"
        - "Path following status"
        - "Waypoint progress"
        
      artifacts:
        - "global_paths"
        - "following_errors"
        - "speed_profiles"
        - "performance_metrics"
    
    # Experiment 4: TEB - Trajectory Optimization
    local_planning_teb:
      experiment_id: "local_planning_teb"
      category: "local_planning"
      method_id: "teb_local_planner"
      input_stratum: "perception_lidar_2d_dense"
      robot_class: "mobile"
      environment: "small_warehouse"
      simulator: "gazebo"
      seeds: [6016, 6017, 6018, 6019, 6020]
      duration_seconds: 30.0
      description: "Benchmark Timed Elastic Band local planner with trajectory optimization"
      
      metrics:
        - "collision_rate"
        - "goal_reached_rate"
        - "optimization_success_rate"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "trajectory_optimality"
        - "constraint_satisfaction"
        
      success_criteria:
        collision_rate: "0.0"
        goal_reached_rate: ">= 0.85"
        optimization_success_rate: ">= 0.9"
        
      failure_criteria:
        collision_rate: "> 0.1"
        goal_reached_rate: "< 0.6"
        optimization_success_rate: "< 0.7"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 20.0
        memory_limit_mb: 2048
        real_time_factor_min: 0.6
        timeout_seconds: 50.0
        
      input_generation:
        type: "optimization_navigation"
        max_vel_x: 0.5
        max_vel_theta: 0.5
        acc_lim_x: 0.2
        acc_lim_theta: 0.3
        min_obstacle_dist: 0.1
        weight_time: 1.0
        weight_kinematics: 1.0
        weight_obstacles: 1.0
        environments: ["warehouse", "obstacle_field", "narrow_passage"]
        
      expected_output:
        - "Twist messages"
        - "Trajectory messages"
        - "Optimization status"
        
      artifacts:
        - "optimized_trajectories"
        - "constraint_violations"
        - "cost_evaluations"
        - "performance_metrics"
    
    # Experiment 5: MPPI - Stochastic Optimization
    local_planning_mppi:
      experiment_id: "local_planning_mppi"
      category: "local_planning"
      method_id: "mppi_local_planner"
      input_stratum: "perception_lidar_2d_dense"
      robot_class: "mobile"
      environment: "nav_dynamic"
      simulator: "gazebo"
      seeds: [6021, 6022, 6023, 6024, 6025]
      duration_seconds: 35.0
      description: "Benchmark MPPI local planner with stochastic trajectory optimization in dynamic environment"
      
      metrics:
        - "collision_rate"
        - "goal_reached_rate"
        - "sample_diversity"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "stochastic_robustness"
        - "cost_landscape_quality"
        
      success_criteria:
        collision_rate: "<= 0.05"
        goal_reached_rate: ">= 0.8"
        sample_diversity: ">= 0.85"
        
      failure_criteria:
        collision_rate: "> 0.2"
        goal_reached_rate: "< 0.5"
        sample_diversity: "< 0.6"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 30.0
        memory_limit_mb: 4096
        real_time_factor_min: 0.5
        timeout_seconds: 60.0
        
      input_generation:
        type: "stochastic_navigation"
        num_samples: 100
        time_horizon: 2.0
        time_step: 0.1
        temperature: 0.1
        noise_covariance: [0.01, 0.01, 0.001]
        environments: ["dynamic_obstacles", "unpredictable_motion", "cluttered"]
        
      expected_output:
        - "Twist messages"
        - "Trajectory messages"
        - "Sample distributions"
        
      artifacts:
        - "sampled_trajectories"
        - "cost_distributions"
        - "optimization_history"
        - "performance_metrics"

  # =============================================================================
  # R7.8 CONTROL METHODS - 5 benchmark experiments  
  # =============================================================================
  
  control:
    # Experiment 1: PID - Linear Plant
    control_pid_linear:
      experiment_id: "control_pid_linear"
      category: "control"
      method_id: "pid_controller"
      input_stratum: "control_linear_plant"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [7001, 7002, 7003, 7004, 7005]
      duration_seconds: 10.0
      description: "Benchmark PID controller for linear plant with anti-windup and bumpless transfer"
      
      metrics:
        - "rise_time"
        - "settling_time"
        - "overshoot_percent"
        - "steady_state_error"
        - "anti_windup_effectiveness"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "disturbance_rejection"
        
      success_criteria:
        settling_time: "<= 2.0"  # seconds
        overshoot_percent: "<= 5.0"  # percent
        steady_state_error: "<= 0.01"  # normalized
        anti_windup_effectiveness: ">= 0.95"
        
      failure_criteria:
        settling_time: "> 5.0"  # seconds
        overshoot_percent: "> 20.0"  # percent
        steady_state_error: "> 0.05"  # normalized
        anti_windup_effectiveness: "< 0.7"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 0.5
        memory_limit_mb: 128
        real_time_factor_min: 1.0
        timeout_seconds: 20.0
        
      input_generation:
        type: "step_response"
        setpoints: [0.2, 0.3, 0.4]
        k_p: [1.0, 1.0]
        k_i: [0.1, 0.1]
        k_d: [0.01, 0.01]
        disturbances: ["none", "step", "sinusoidal"]
        
      expected_output:
        - "Twist messages"
        - "Control effort"
        - "Error signals"
        
      artifacts:
        - "step_responses"
        - "error_signals"
        - "control_efforts"
        - "performance_metrics"
    
    # Experiment 2: LQR - Linear Plant
    control_lqr_linear:
      experiment_id: "control_lqr_linear"
      category: "control"
      method_id: "lqr_controller"
      input_stratum: "control_linear_plant"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [7006, 7007, 7008, 7009, 7010]
      duration_seconds: 15.0
      description: "Benchmark LQR controller for optimal linear system control"
      
      metrics:
        - "cost_function_value"
        - "state_convergence"
        - "control_effort_magnitude"
        - "stability_margins"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "robustness_to_noise"
        
      success_criteria:
        cost_function_value: "<= 0.1"  # normalized
        state_convergence: "exponential"
        stability_margins: ">= 0.3"  # gain margin
        
      failure_criteria:
        cost_function_value: "> 1.0"  # normalized
        stability_margins: "< 0.1"  # gain margin
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 2.0
        memory_limit_mb: 256
        real_time_factor_min: 0.9
        timeout_seconds: 25.0
        
      input_generation:
        type: "regulator_design"
        q_matrix: [[1.0, 0.0], [0.0, 1.0]]
        r_matrix: [[1.0, 0.0], [0.0, 1.0]]
        a_matrix: [[0.0, 1.0], [0.0, 0.0]]
        b_matrix: [[0.0], [1.0]]
        disturbances: ["gaussian_noise", "step_disturbance"]
        
      expected_output:
        - "Twist messages"
        - "Optimal control signals"
        - "State trajectories"
        
      artifacts:
        - "riccati_solutions"
        - "control_gains"
        - "state_trajectories"
        - "performance_metrics"
    
    # Experiment 3: MPC - Constrained Linear Plant
    control_mpc_constrained:
      experiment_id: "control_mpc_constrained"
      category: "control"
      method_id: "mpc_controller"
      input_stratum: "control_constrained"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [7011, 7012, 7013, 7014, 7015]
      duration_seconds: 20.0
      description: "Benchmark MPC controller for constrained linear system with constraint satisfaction"
      
      metrics:
        - "constraint_violation_count"
        - "cost_function_value"
        - "solution_time"
        - "feasibility_rate"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "tracking_accuracy"
        
      success_criteria:
        constraint_violation_count: "0"
        feasibility_rate: "1.0"
        solution_time: "<= 0.01"  # seconds
        
      failure_criteria:
        constraint_violation_count: "> 5"
        feasibility_rate: "< 0.8"
        solution_time: "> 0.1"  # seconds
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 15.0
        memory_limit_mb: 1024
        real_time_factor_min: 0.7
        timeout_seconds: 35.0
        
      input_generation:
        type: "constrained_control"
        prediction_horizon: 10
        control_horizon: 5
        state_constraints: [[-1.0, -1.0], [1.0, 1.0]]
        control_constraints: [[-0.5, -0.5], [0.5, 0.5]]
        setpoint_profiles: ["step", "ramp", "sinusoidal"]
        
      expected_output:
        - "Twist messages"
        - "Control signals"
        - "Constraint status"
        
      artifacts:
        - "optimization_solutions"
        - "constraint_monitoring"
        - "cost_evaluations"
        - "performance_metrics"
    
    # Experiment 4: Nonlinear MPC - Nonlinear Plant
    control_nonlinear_mpc:
      experiment_id: "control_nonlinear_mpc"
      category: "control"
      method_id: "nonlinear_mpc"
      input_stratum: "control_nonlinear_plant"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [7016, 7017, 7018, 7019, 7020]
      duration_seconds: 25.0
      description: "Benchmark Nonlinear MPC for nonlinear plant model with SQP optimization"
      
      metrics:
        - "solution_quality"
        - "convergence_iterations"
        - "solution_time"
        - "feasibility_rate"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "nonlinear_handling"
        
      success_criteria:
        convergence_iterations: "<= 10"
        solution_quality: ">= 0.8"  # normalized
        feasibility_rate: ">= 0.9"
        
      failure_criteria:
        convergence_iterations: "> 20"
        solution_quality: "< 0.5"  # normalized
        feasibility_rate: "< 0.7"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 30.0
        memory_limit_mb: 2048
        real_time_factor_min: 0.5
        timeout_seconds: 45.0
        
      input_generation:
        type: "nonlinear_control"
        prediction_horizon: 5
        control_horizon: 3
        max_iterations: 20
        tolerance: 1e-6
        nonlinearity_levels: ["mild", "moderate", "strong"]
        
      expected_output:
        - "Twist messages"
        - "Optimization status"
        - "Nonlinear model predictions"
        
      artifacts:
        - "sqp_iterations"
        - "linearization_accuracy"
        - "convergence_history"
        - "performance_metrics"
    
    # Experiment 5: Feedback Linearization - Nonlinear Plant with Disturbance Recovery
    control_feedback_linearization:
      experiment_id: "control_feedback_linearization"
      category: "control"
      method_id: "feedback_linearization"
      input_stratum: "control_nonlinear_plant"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [7021, 7022, 7023, 7024, 7025]
      duration_seconds: 15.0
      description: "Benchmark Feedback Linearization controller for exact linearization of nonlinear system with disturbance rejection and recovery testing"
      
      metrics:
        - "linearization_quality"
        - "tracking_accuracy"
        - "control_effort_usage"
        - "robustness_to_uncertainty"
        - "disturbance_rejection_time"
        - "recovery_success_rate"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "stability_envelope"
        
      success_criteria:
        linearization_quality: ">= 0.95"
        tracking_accuracy: "<= 0.02"  # normalized
        control_effort_usage: "<= 0.8"  # fraction of max effort
        disturbance_rejection_time: "<= 2.0"  # seconds
        recovery_success_rate: ">= 0.9"
        
      failure_criteria:
        linearization_quality: "< 0.7"
        tracking_accuracy: "> 0.1"  # normalized
        control_effort_usage: "> 1.0"  # exceeds max effort
        disturbance_rejection_time: "> 5.0"  # seconds
        recovery_success_rate: "< 0.7"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 5.0
        memory_limit_mb: 512
        real_time_factor_min: 0.8
        timeout_seconds: 30.0
        
      input_generation:
        type: "linearization_control_with_disturbances"
        desired_dynamics: [1.0, 1.0]
        max_control_effort: 10.0
        reference_trajectories: ["sinusoidal", "step", "ramp"]
        model_uncertainties: ["none", "small", "medium"]
        disturbance_types: ["step", "sinusoidal", "impulse"]
        disturbance_magnitudes: [0.1, 0.5, 1.0]
        
      expected_output:
        - "Twist messages"
        - "Linearized system outputs"
        - "Control effort signals"
        - "Disturbance responses"
        
      artifacts:
        - "lie_derivatives"
        - "linearization_accuracy"
        - "tracking_errors"
        - "disturbance_responses"
        - "recovery_tests"
        - "performance_metrics"