# R7.2-R7.8 Benchmark Experiments
# Comprehensive benchmark experiment configurations for all algorithm categories
# with input strata, metrics, success/failure criteria, and resource budgets

benchmark_experiments:
  # =============================================================================
  # R7.2 PERCEPTION PIPELINES - 5 benchmark experiments
  # =============================================================================
  
  perception:
    # Experiment 1: Obstacle Detection - Sparse 2D LiDAR
    perception_obstacle_sparse_lidar:
      experiment_id: "perception_obstacle_sparse_lidar"
      category: "perception"
      method_id: "obstacle_detector"
      input_stratum: "perception_lidar_2d_sparse"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [1001, 1002, 1003, 1004, 1005]
      duration_seconds: 10.0
      description: "Benchmark obstacle detection with sparse 2D LiDAR (100 points/scan) in open environment"
      
      metrics:
        - "detection_accuracy"
        - "false_positive_rate"
        - "false_negative_rate"
        - "compute_time_mean"
        - "compute_time_std"
        - "memory_usage_peak"
        - "detection_latency"
        
      success_criteria:
        detection_accuracy: ">= 0.95"
        false_positive_rate: "<= 0.05"
        false_negative_rate: "<= 0.05"
        compute_time_mean: "<= 0.01"  # seconds
        
      failure_criteria:
        detection_accuracy: "< 0.8"
        compute_time_mean: "> 0.1"  # seconds
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 1.0  # core-seconds per run
        memory_limit_mb: 512
        real_time_factor_min: 0.9
        timeout_seconds: 15.0
        
      input_generation:
        type: "synthetic"
        num_obstacles: [1, 3, 5]
        obstacle_sizes: [0.2, 0.5, 0.8]
        scan_points: 100
        scan_frequency_hz: 10.0
        noise_std: 0.02
        
      expected_output:
        - "MarkerArray with obstacle detections"
        - "PointCloud2 with filtered points"
        
      artifacts:
        - "raw_scan_data"
        - "detection_results"
        - "performance_metrics"
        - "timing_data"
    
    # Experiment 2: Scan Clustering - Dense 2D LiDAR
    perception_cluster_dense_lidar:
      experiment_id: "perception_cluster_dense_lidar"
      category: "perception"
      method_id: "scan_clusterer"
      input_stratum: "perception_lidar_2d_dense"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [1006, 1007, 1008, 1009, 1010]
      duration_seconds: 15.0
      description: "Benchmark scan clustering with dense 2D LiDAR (2000 points/scan) in office environment"
      
      metrics:
        - "clustering_accuracy"
        - "precision_per_cluster"
        - "recall_per_cluster"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "cluster_count_variance"
        
      success_criteria:
        clustering_accuracy: ">= 0.85"
        precision_per_cluster: ">= 0.80"
        recall_per_cluster: ">= 0.80"
        compute_time_mean: "<= 0.05"  # seconds
        
      failure_criteria:
        clustering_accuracy: "< 0.7"
        compute_time_mean: "> 0.1"  # seconds
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 2.0
        memory_limit_mb: 1024
        real_time_factor_min: 0.8
        timeout_seconds: 20.0
        
      input_generation:
        type: "synthetic"
        num_obstacles: [2, 4, 6]
        obstacle_arrangements: ["line", "cluster", "random"]
        scan_points: 2000
        scan_frequency_hz: 20.0
        noise_std: 0.01
        
      expected_output:
        - "MarkerArray with cluster bounding boxes"
        - "PointCloud2 with segmented points"
        
      artifacts:
        - "raw_scan_data"
        - "cluster_assignments"
        - "bounding_boxes"
        - "performance_metrics"
    
    # Experiment 3: Euclidean Clustering - Dense 2D LiDAR
    perception_euclidean_dense_lidar:
      experiment_id: "perception_euclidean_dense_lidar"
      category: "perception"
      method_id: "euclidean_clusterer"
      input_stratum: "perception_lidar_2d_dense"
      robot_class: "mobile"
      environment: "nav_maze"
      simulator: "gazebo"
      seeds: [1011, 1012, 1013, 1014, 1015]
      duration_seconds: 12.0
      description: "Benchmark Euclidean clustering with dense LiDAR in maze environment"
      
      metrics:
        - "cluster_purity"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "cluster_size_std"
        
      success_criteria:
        cluster_purity: ">= 0.80"
        compute_time_mean: "<= 0.1"  # seconds
        
      failure_criteria:
        cluster_purity: "< 0.6"
        compute_time_mean: "> 0.5"  # seconds
        memory_usage_peak: "> 2048"  # MB
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 5.0
        memory_limit_mb: 2048
        real_time_factor_min: 0.7
        timeout_seconds: 25.0
        
      input_generation:
        type: "synthetic"
        num_obstacles: [5, 8, 10]
        scan_points: 3000
        scan_frequency_hz: 15.0
        noise_std: 0.005
        
      expected_output:
        - "MarkerArray with cluster markers"
        - "PointCloud2 with colored clusters"
        
      artifacts:
        - "raw_point_cloud"
        - "cluster_labels"
        - "performance_metrics"
    
    # Experiment 4: DBSCAN - Dense 2D/3D LiDAR
    perception_dbscan_dense_lidar:
      experiment_id: "perception_dbscan_dense_lidar"
      category: "perception"
      method_id: "dbscan_clusterer"
      input_stratum: "perception_lidar_2d_dense"
      robot_class: "mobile"
      environment: "small_warehouse"
      simulator: "gazebo"
      seeds: [1016, 1017, 1018, 1019, 1020]
      duration_seconds: 18.0
      description: "Benchmark DBSCAN density-based clustering in warehouse with varying obstacle densities"
      
      metrics:
        - "density_estimation_error"
        - "cluster_count_accuracy"
        - "noise_classification_rate"
        - "compute_time_mean"
        - "memory_usage_peak"
        
      success_criteria:
        cluster_count_accuracy: ">= 0.85"
        noise_classification_rate: ">= 0.90"
        compute_time_mean: "<= 0.15"  # seconds
        
      failure_criteria:
        cluster_count_accuracy: "< 0.7"
        noise_classification_rate: "< 0.8"
        compute_time_mean: "> 0.5"  # seconds
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 8.0
        memory_limit_mb: 2048
        real_time_factor_min: 0.6
        timeout_seconds: 30.0
        
      input_generation:
        type: "synthetic"
        num_obstacles: [3, 6, 9]
        obstacle_densities: ["sparse", "medium", "dense"]
        scan_points: 2500
        scan_frequency_hz: 10.0
        eps: 0.2
        min_samples: 5
        
      expected_output:
        - "MarkerArray with DBSCAN clusters"
        - "PointCloud2 with classified points"
        
      artifacts:
        - "raw_point_cloud"
        - "density_estimates"
        - "noise_points"
        - "performance_metrics"
    
    # Experiment 5: RANSAC Ground Removal - RGB-D
    perception_ransac_rgbd:
      experiment_id: "perception_ransac_rgbd"
      category: "perception"
      method_id: "ransac_ground_removal"
      input_stratum: "perception_rgbd"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [1021, 1022, 1023, 1024, 1025]
      duration_seconds: 15.0
      description: "Benchmark RANSAC ground plane removal with RGB-D data in office environment"
      
      metrics:
        - "ground_plane_estimation_error"
        - "inlier_ratio"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "ground_removal_accuracy"
        
      success_criteria:
        inlier_ratio: ">= 0.80"
        ground_removal_accuracy: ">= 0.90"
        compute_time_mean: "<= 0.05"  # seconds
        
      failure_criteria:
        inlier_ratio: "< 0.6"
        ground_removal_accuracy: "< 0.7"
        compute_time_mean: "> 0.2"  # seconds
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 10.0
        memory_limit_mb: 4096
        real_time_factor_min: 0.5
        timeout_seconds: 35.0
        
      input_generation:
        type: "synthetic"
        num_ground_points: [1000, 2000, 3000]
        num_obstacle_points: [200, 500, 800]
        depth_image_resolution: [320, 240]
        depth_frequency_hz: 30.0
        max_iterations: 1000
        distance_threshold: 0.05
        
      expected_output:
        - "PointCloud2 with ground plane removed"
        - "PointCloud2 with obstacles only"
        
      artifacts:
        - "raw_rgbd_data"
        - "plane_parameters"
        - "inlier_outlier_classification"
        - "performance_metrics"

  # =============================================================================
  # R7.3 LOCALIZATION METHODS - 5 benchmark experiments
  # =============================================================================
  
  localization:
    # Experiment 1: Dead Reckoning - Odometry Only
    localization_dead_reckoning_odometry:
      experiment_id: "localization_dead_reckoning_odometry"
      category: "localization"
      method_id: "dead_reckoning"
      input_stratum: "localization_odometry_only"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [2001, 2002, 2003, 2004, 2005]
      duration_seconds: 20.0
      description: "Benchmark dead reckoning with wheel odometry in open environment with straight-line motion"
      
      metrics:
        - "ate_final"  # Absolute Trajectory Error at end
        - "ate_mean"
        - "rpe_mean"
        - "position_drift_rate"
        - "orientation_drift_rate"
        - "compute_time_mean"
        - "memory_usage_peak"
        
      success_criteria:
        ate_final: "<= 0.5"  # meters
        position_drift_rate: "<= 0.025"  # m/s per m/s command
        compute_time_mean: "<= 0.001"  # seconds
        
      failure_criteria:
        ate_final: "> 2.0"  # meters
        position_drift_rate: "> 0.1"  # m/s per m/s command
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 0.5
        memory_limit_mb: 256
        real_time_factor_min: 1.0
        timeout_seconds: 30.0
        
      input_generation:
        type: "command_velocity"
        commands: ["straight_0.2", "straight_0.3", "straight_0.4"]
        command_duration: [5.0, 10.0, 15.0]
        noise_levels: ["low", "medium"]
        
      expected_output:
        - "Odometry messages"
        - "TF transforms"
        
      artifacts:
        - "ground_truth_trajectory"
        - "estimated_trajectory"
        - "error_analysis"
        - "timing_data"
    
    # Experiment 2: AMCL - LiDAR Map Localization
    localization_amcl_lidar_map:
      experiment_id: "localization_amcl_lidar_map"
      category: "localization"
      method_id: "amcl"
      input_stratum: "localization_lidar_map"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [2006, 2007, 2008, 2009, 2010]
      duration_seconds: 30.0
      description: "Benchmark AMCL localization with LiDAR in known office map with loop closure"
      
      metrics:
        - "ate_final"
        - "ate_convergence_time"
        - "success_rate"
        - "particle_diversity"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "localization_failures"
        
      success_criteria:
        ate_final: "<= 0.2"  # meters
        ate_convergence_time: "<= 10.0"  # seconds
        success_rate: ">= 0.9"
        
      failure_criteria:
        ate_final: "> 1.0"  # meters
        ate_convergence_time: "> 30.0"  # seconds
        success_rate: "< 0.7"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 10.0
        memory_limit_mb: 1024
        real_time_factor_min: 0.8
        timeout_seconds: 45.0
        
      input_generation:
        type: "navigation"
        waypoints: [[0,0], [2,0], [2,2], [0,2], [0,0]]
        map_resolution: 0.05
        laser_scan_points: 360
        max_particles: 2000
        
      expected_output:
        - "Odometry messages"
        - "ParticleCloud messages"
        - "TF transforms"
        
      artifacts:
        - "particle_clouds"
        - "estimated_poses"
        - "error_analysis"
        - "convergence_plots"
    
    # Experiment 3: ICP - LiDAR Scan Matching
    localization_icp_lidar:
      experiment_id: "localization_icp_lidar"
      category: "localization"
      method_id: "icp_localization"
      input_stratum: "localization_lidar_map"
      robot_class: "mobile"
      environment: "nav_maze"
      simulator: "gazebo"
      seeds: [2011, 2012, 2013, 2014, 2015]
      duration_seconds: 25.0
      description: "Benchmark ICP localization with LiDAR scan matching in maze environment"
      
      metrics:
        - "ate_final"
        - "ate_convergence_rate"
        - "icp_iterations_mean"
        - "fitness_score"
        - "compute_time_mean"
        - "memory_usage_peak"
        
      success_criteria:
        ate_final: "<= 0.3"  # meters
        fitness_score: "<= 0.1"  # mean squared error
        
      failure_criteria:
        ate_final: "> 1.0"  # meters
        fitness_score: "> 0.5"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 15.0
        memory_limit_mb: 2048
        real_time_factor_min: 0.6
        timeout_seconds: 40.0
        
      input_generation:
        type: "scan_matching"
        initial_poses: [[0,0,0], [1,1,π/4], [2,1,π/2]]
        scan_frequency_hz: 10.0
        scan_points: 720
        max_iterations: 100
        
      expected_output:
        - "Odometry messages"
        - "TF transforms"
        
      artifacts:
        - "scan_pairs"
        - "transformation_matrices"
        - "error_analysis"
        - "convergence_data"
    
    # Experiment 4: NDT - LiDAR Registration
    localization_ndt_lidar:
      experiment_id: "localization_ndt_lidar"
      category: "localization"
      method_id: "ndt_localization"
      input_stratum: "localization_lidar_map"
      robot_class: "mobile"
      environment: "small_warehouse"
      simulator: "gazebo"
      seeds: [2016, 2017, 2018, 2019, 2020]
      duration_seconds: 35.0
      description: "Benchmark NDT localization with 3D LiDAR registration in warehouse environment"
      
      metrics:
        - "ate_final"
        - "ndt_score"
        - "convergence_time"
        - "compute_time_mean"
        - "memory_usage_peak"
        
      success_criteria:
        ate_final: "<= 0.25"  # meters
        ndt_score: ">= 0.7"
        
      failure_criteria:
        ate_final: "> 1.0"  # meters
        ndt_score: "< 0.4"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 20.0
        memory_limit_mb: 4096
        real_time_factor_min: 0.5
        timeout_seconds: 50.0
        
      input_generation:
        type: "ndt_matching"
        resolution: 0.1
        scan_frequency_hz: 5.0
        max_iterations: 50
        
      expected_output:
        - "Odometry messages"
        - "TF transforms"
        
      artifacts:
        - "ndt_cells"
        - "score_estimates"
        - "error_analysis"
        - "memory_profiles"
    
    # Experiment 5: RGB-D SLAM - Visual Localization
    localization_rgbd_slam:
      experiment_id: "localization_rgbd_slam"
      category: "localization"
      method_id: "rgbd_slam_localization"
      input_stratum: "localization_multi_sensor"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [2021, 2022, 2023, 2024, 2025]
      duration_seconds: 40.0
      description: "Benchmark RGB-D SLAM localization with visual features in textured office environment"
      
      metrics:
        - "ate_final"
        - "rpe_mean"
        - "mapping_quality"
        - "feature_tracking_rate"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "keyframe_frequency"
        
      success_criteria:
        ate_final: "<= 0.15"  # meters
        feature_tracking_rate: ">= 0.8"
        
      failure_criteria:
        ate_final: "> 0.5"  # meters
        feature_tracking_rate: "< 0.5"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 30.0
        memory_limit_mb: 8192
        real_time_factor_min: 0.3
        timeout_seconds: 60.0
        
      input_generation:
        type: "visual_slam"
        camera_resolution: [640, 480]
        camera_frequency_hz: 30.0
        feature_type: "ORB"
        num_features: 1000
        depth_threshold: 3.0
        
      expected_output:
        - "Odometry messages"
        - "Map messages"
        - "KeyFrame messages"
        
      artifacts:
        - "feature_matches"
        - "map_point_cloud"
        - "keyframe_poses"
        - "error_analysis"

  # =============================================================================
  # R7.4 STATE ESTIMATION METHODS - 5 benchmark experiments
  # =============================================================================
  
  state_estimation:
    # Experiment 1: EKF 3D - Linear Dynamics
    state_estimation_ekf_3d_linear:
      experiment_id: "state_estimation_ekf_3d_linear"
      category: "state_estimation"
      method_id: "ekf_3d_estimator"
      input_stratum: "state_estimation_linear_dynamics"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [3001, 3002, 3003, 3004, 3005]
      duration_seconds: 15.0
      description: "Benchmark EKF 3D estimation with linear dynamics and IMU+odometry sensor fusion"
      
      metrics:
        - "rmse_position"
        - "rmse_orientation"
        - "rmse_velocity"
        - "covariance_consistency"
        - "nees_score"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "convergence_time"
        
      success_criteria:
        rmse_position: "<= 0.05"  # meters
        rmse_orientation: "<= 0.01"  # radians
        rmse_velocity: "<= 0.02"  # m/s
        nees_score: "[0.8, 1.2]"  # should be around 1.0
        
      failure_criteria:
        rmse_position: "> 0.2"  # meters
        rmse_orientation: "> 0.1"  # radians
        nees_score: "< 0.5 or > 2.0"  # not consistent
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 5.0
        memory_limit_mb: 512
        real_time_factor_min: 0.9
        timeout_seconds: 25.0
        
      input_generation:
        type: "sensor_fusion"
        motion_type: "straight_line"
        velocities: [0.1, 0.2, 0.3]
        imu_noise_std: [0.001, 0.001, 0.001]
        odometry_noise_std: [0.01, 0.01, 0.005]
        initial_covariance: [0.1, 0.1, 0.1, 0.01, 0.01, 0.01]
        
      expected_output:
        - "Odometry messages with covariance"
        - "PoseWithCovariance messages"
        
      artifacts:
        - "estimated_states"
        - "covariance_matrices"
        - "nees_analysis"
        - "error_plots"
    
    # Experiment 2: Linear Kalman Filter - Linear Dynamics
    state_estimation_linear_kf:
      experiment_id: "state_estimation_linear_kf"
      category: "state_estimation"
      method_id: "linear_kalman_filter"
      input_stratum: "state_estimation_linear_dynamics"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [3006, 3007, 3008, 3009, 3010]
      duration_seconds: 20.0
      description: "Benchmark Linear Kalman Filter for optimal estimation in linear system"
      
      metrics:
        - "rmse_position"
        - "rmse_velocity"
        - "kalman_gain_stability"
        - "innovation_sequence_whiteness"
        - "compute_time_mean"
        - "memory_usage_peak"
        
      success_criteria:
        rmse_position: "<= 0.03"  # meters
        rmse_velocity: "<= 0.01"  # m/s
        innovation_sequence_whiteness: ">= 0.9"  # should be white noise
        
      failure_criteria:
        rmse_position: "> 0.1"  # meters
        innovation_sequence_whiteness: "< 0.7"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 2.0
        memory_limit_mb: 256
        real_time_factor_min: 1.0
        timeout_seconds: 30.0
        
      input_generation:
        type: "linear_motion"
        motion_profiles: ["sinusoidal", "step", "ramp"]
        process_noise_std: [0.001, 0.001]
        measurement_noise_std: [0.01, 0.01]
        initial_conditions: [0.0, 0.0, 0.0]
        
      expected_output:
        - "Odometry messages with covariance"
        
      artifacts:
        - "state_estimates"
        - "kalman_gains"
        - "innovation_sequences"
        - "error_analysis"
    
    # Experiment 3: UKF - Nonlinear Dynamics
    state_estimation_ukf_nonlinear:
      experiment_id: "state_estimation_ukf_nonlinear"
      category: "state_estimation"
      method_id: "ukf_estimator"
      input_stratum: "state_estimation_nonlinear_dynamics"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [3011, 3012, 3013, 3014, 3015]
      duration_seconds: 25.0
      description: "Benchmark Unscented Kalman Filter for nonlinear dynamics with significant nonlinearities"
      
      metrics:
        - "rmse_position"
        - "rmse_orientation"
        - "estimation_consistency"
        - "sigma_point_diversity"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "nonlinear_handling"
        
      success_criteria:
        rmse_position: "<= 0.1"  # meters
        estimation_consistency: ">= 0.85"
        
      failure_criteria:
        rmse_position: "> 0.3"  # meters
        estimation_consistency: "< 0.7"
        crash_or_error: true
        
      resource_budget:
        cpu_limit: 15.0
        memory_limit_mb: 1024
        real_time_factor_min: 0.7
        timeout_seconds: 40.0
        
      input_generation:
        type: "nonlinear_motion"
        motion_profiles: ["circular", "figure_eight", "spiral"]
        alpha: 0.1
        beta: 2.0
        kappa: 0.0
        nonlinearity_level: "high"
        
      expected_output:
        - "Odometry messages with covariance"
        - "PoseWithCovariance messages"
        
      artifacts:
        - "sigma_points"
        - "transformed_points"
        - "state_estimates"
        - "error_analysis"
    
    # Experiment 4: Particle Filter - Nonlinear Dynamics
    state_estimation_particle_filter:
      experiment_id: "state_estimation_particle_filter"
      category: "state_estimation"
      method_id: "particle_filter"
      input_stratum: "state_estimation_nonlinear_dynamics"
      robot_class: "mobile"
      environment: "small_office"
      simulator: "gazebo"
      seeds: [3016, 3017, 3018, 3019, 3020]
      duration_seconds: 30.0
      description: "Benchmark Particle Filter for highly nonlinear systems and non-Gaussian noise"
      
      metrics:
        - "rmse_position"
        - "effective_sample_size"
        - "particle_diversity"
        - "convergence_time"
        - "compute_time_mean"
        - "memory_usage_peak"
        - "resampling_frequency"
        
      success_criteria:
        rmse_position: "<= 0.15"  # meters
        effective_sample_size: ">= 500"
        particle_diversity: ">= 0.8"
        
      failure_criteria:
        rmse_position: "> 0.5"  # meters
        effective_sample_size: "< 200"
