        initial_errors: [0.1, 0.2, 0.3]
        k_p: 1.0
        k_i: 0.01
        
      expected_output:
        - "Imu messages"
        - "Pose messages"
        
      artifacts:
        - "convergence_curves"
        - "error_analysis"
        - "parameter_tuning"
        - "disturbance_tests"
    
    # Experiment 3: Madgwick Filter - Attitude Only
    sensor_fusion_madgwick_attitude:
      experiment_id: "sensor_fusion_madgwick_attitude"
      category: "sensor_fusion"
      method_id: "madgwick_filter"
      input_stratum: "sensor_fusion_attitude_only"
      robot_class: "mobile"
      environment: "nav_empty"
      simulator: "gazebo"
      seeds: [4011, 4012, 4013, 4014, 4015]
      duration_seconds: 20.0
      description: "Benchmark Madgwick AHRS Filter using gradient descent optimization"
      
      metrics:
        - "convergence_rate"
        - "solution_quality"
        - "gradient_norm"
        - "compute_time_mean"
        - "memory_usage_peak"
        
      success_criteria:
        convergence_rate: "<= 0.1"  # error reduction per second
        gradient_norm: "<= 1e-6"
        
      failure_criteria:
        convergence_rate: "> 0.5"  # error reduction per second
        gradient_norm: "> 1e-3"
