        - "compute_time_mean"
        - "memory_usage_peak"
        - "calibration_quality"
        
      success_criteria:
        position_rmse: "<= 0.05"  # meters
        orientation_rmse: "<= 0.01"  # radians
        sensor_consistency: ">= 0.9"
        
