      resource_budget:
        cpu_limit: 3.0
        memory_limit_mb: 128
        real_time_factor_min: 0.9
        timeout_seconds: 30.0
        
      input_generation:
        type: "attitude_optimization"
        initial_conditions: ["upside_down", "tilted", "random"]
        beta: 0.1
        zeta: 0.0
        reference_vectors: ["gravity", "magnetic"]
        
      expected_output:
        - "Imu messages"
        - "Pose messages"
        
      artifacts:
        - "gradient_descent_history"
        - "convergence_analysis"
        - "error_analysis"
    
    # Experiment 4: Wheel-IMU Fusion - Pose
    sensor_fusion_wheel_imu_pose:
