# R7.2-R7.8 Method Subrecords
# Comprehensive method definitions with mathematical foundations, equations, and input strata
# for benchmarking algorithm breadth requirements

method_subrecords:
  # =============================================================================
  # R7.2 PERCEPTION PIPELINES
  # =============================================================================
  
  perception:
    # Rewritten 2026-10-13 to the implemented methods (see docs/status/evidence/r7*-2026-10-13).
    obstacle_detector:
      method_id: obstacle_detector
      category: perception
      display_name: Single-Linkage Obstacle Detector
      implementation_ref: robot_lab_algorithms.perception.ObstacleDetector
      mathematical_foundation: Connected components of scan points under a distance threshold
      equations:
      - Points p_i = r_i (cos a_i, sin a_i)
      - Edge (i, j) if |p_i - p_j| <= d (KD-tree neighbourhoods)
      - Clusters = connected components (BFS)
      source_references:
      - Ester et al. single-linkage background; Bentley, Multidimensional binary search trees (1975)
      applicable_robots:
      - bumperbot
      - labbot
      input_strata:
      - perception_lidar_2d_sparse
      - perception_lidar_2d_dense
      output_types:
      - MarkerArray
      parameters:
        cluster_distance: 0.5
      assumptions:
      - Obstacles are separated by more than d
      limitations:
      - Chains through close objects merge them
      computational_complexity: O(N log N)
      memory_requirements: Low
    scan_clusterer:
      method_id: scan_clusterer
      category: perception
      display_name: Breakpoint Scan Segmenter
      implementation_ref: robot_lab_algorithms.perception.ScanClusterer
      mathematical_foundation: Sequential breakpoint detection along the scan, fixed or adaptive (range-dependent) threshold
      equations:
      - Break between beams i-1, i when |p_i - p_{i-1}| > D
      - 'Adaptive: D = r_{i-1} sin(da) / sin(lambda - da) + 3 sigma'
      source_references:
      - Borges and Aldon, Line extraction in 2D range images for mobile robotics, JIRS 40 (2004)
      applicable_robots:
      - bumperbot
      - labbot
      input_strata:
      - perception_lidar_2d_sparse
      - perception_lidar_2d_dense
      output_types:
      - MarkerArray
      parameters:
        cluster_distance: 0.3
        adaptive: false
        lambda_deg: 10
      assumptions:
      - Beams ordered by angle
      limitations:
      - Fixed threshold splits far grazing surfaces
      computational_complexity: O(N)
      memory_requirements: Low
    euclidean_clusterer:
      method_id: euclidean_clusterer
      category: perception
      display_name: Euclidean Clustering
      implementation_ref: robot_lab_algorithms.perception.EuclideanClusterer
      mathematical_foundation: Region growing on a KD-tree (PCL EuclideanClusterExtraction)
      equations:
      - Connected components of points under tolerance t
      - Keep clusters with at least min_points points
      source_references:
      - Rusu, Semantic 3D object maps for everyday manipulation (PhD thesis, 2009)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - perception_pointcloud_3d
      output_types:
      - MarkerArray
      parameters:
        tolerance: 0.1
        min_points: 5
      assumptions:
      - Ground removed beforehand
      limitations:
      - Sparse surfaces fragment; touching objects merge
      computational_complexity: O(N log N)
      memory_requirements: Low
    dbscan_clusterer:
      method_id: dbscan_clusterer
      category: perception
      display_name: DBSCAN
      implementation_ref: robot_lab_algorithms.perception.DBSCANClusterer
      mathematical_foundation: Density-based clustering with core, border and noise points
      equations:
      - 'Core point: |N_eps(p)| >= min_samples (p included)'
      - Clusters grow through core points only; border points join; the rest is noise
      source_references:
      - Ester, Kriegel, Sander and Xu, A density-based algorithm for discovering clusters, KDD 1996
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - perception_pointcloud_3d
      - perception_lidar_2d_dense
      output_types:
      - MarkerArray
      parameters:
        eps: 0.1
        min_samples: 5
      assumptions:
      - Roughly uniform density per object
      limitations:
      - Low-density parts become noise
      computational_complexity: O(N log N)
      memory_requirements: Low
    ransac_ground_removal:
      method_id: ransac_ground_removal
      category: perception
      display_name: RANSAC Ground Removal
      implementation_ref: robot_lab_algorithms.perception.RANSACGroundRemoval
      mathematical_foundation: RANSAC plane hypotheses restricted to near-vertical normals, least-squares refinement on the inliers
      equations:
      - 'Plane from 3 points: n = (p2 - p1) x (p3 - p1) / |...|, skip if |n_z| < c'
      - Inliers |n . (p - p1)| <= d; keep the largest set
      - Refine z = a x + b y + c by least squares
      source_references:
      - Fischler and Bolles, Random sample consensus, CACM 24(6) 1981
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - perception_pointcloud_3d
      output_types:
      - PointCloud2
      parameters:
        max_iterations: 100
        distance_threshold: 0.05
        normal_threshold: 0.85
      assumptions:
      - The ground is the largest near-horizontal plane
      limitations:
      - 'One plane: no ramps or steps'
      computational_complexity: O(K N)
      memory_requirements: Low

  # =============================================================================
  # R7.3 LOCALIZATION METHODS
  # =============================================================================
  
  localization:
    # Rewritten 2026-10-13 to the implemented methods (see docs/status/evidence/r7*-2026-10-13).
    dead_reckoning:
      method_id: dead_reckoning
      category: localization
      display_name: Dead Reckoning
      implementation_ref: robot_lab_algorithms.scan_matching.DeadReckoning
      mathematical_foundation: Composition of odometry increments
      equations:
      - x_{k+1} = x_k (+) u_k
      source_references:
      - Thrun, Burgard and Fox, Probabilistic Robotics (2005), ch. 5
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - localization_2d_known_map
      output_types:
      - PoseWithCovarianceStamped
      parameters: {}
      assumptions:
      - Odometry available
      limitations:
      - Unbounded drift
      computational_complexity: O(1)
      memory_requirements: Low
    icp_localization:
      method_id: icp_localization
      category: localization
      display_name: ICP (point to point)
      implementation_ref: robot_lab_algorithms.scan_matching.IcpPointToPoint
      mathematical_foundation: Iterative closest point to the map surface cells, closed-form 2D rigid alignment
      equations:
      - Correspondences q_i = NN(R p_i + t) within a shrinking gate
      - R, t = argmin sum |R p_i + t - q_i|^2 via SVD of the cross-covariance
      source_references:
      - Besl and McKay, A method for registration of 3-D shapes, IEEE PAMI 14(2) 1992
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - localization_2d_known_map
      output_types:
      - PoseWithCovarianceStamped
      parameters:
        iterations: 25
        gate: 0.5
      assumptions:
      - Known occupancy map
      - Odometry increments between scans
      limitations:
      - 'Local: needs a good initial guess'
      computational_complexity: O(I N log M)
      memory_requirements: Low
    plicp_localization:
      method_id: plicp_localization
      category: localization
      display_name: ICP (point to line)
      implementation_ref: robot_lab_algorithms.scan_matching.IcpPointToLine
      mathematical_foundation: Gauss-Newton on point-to-line distances with map normals and robust weights
      equations:
      - r_i = n_i . (R p_i + t - q_i)
      - Normals from PCA of 8 map neighbours
      - Cauchy-like weights 1 / (1 + (r/0.05)^2)
      source_references:
      - Censi, An ICP variant using a point-to-line metric, ICRA 2008
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - localization_2d_known_map
      output_types:
      - PoseWithCovarianceStamped
      parameters:
        iterations: 20
      assumptions:
      - Known occupancy map
      - Odometry increments between scans
      limitations:
      - Local; degenerate along long corridors
      computational_complexity: O(I N log M)
      memory_requirements: Low
    ndt_localization:
      method_id: ndt_localization
      category: localization
      display_name: 2D NDT
      implementation_ref: robot_lab_algorithms.scan_matching.NdtMatcher
      mathematical_foundation: Normal distributions transform on 0.5 m cells, reweighted Gauss-Newton with line search
      equations:
      - Cell Gaussians (mu, S) from map surface points
      - score = sum exp(-d^T S^-1 d / 2), d = R p + t - mu
      - 'IRLS: H = sum w J^T S^-1 J, g = sum w J^T S^-1 d'
      source_references:
      - Biber and Strasser, The normal distributions transform, IROS 2003
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - localization_2d_known_map
      output_types:
      - PoseWithCovarianceStamped
      parameters:
        cell: 0.5
        iterations: 20
      assumptions:
      - Known occupancy map
      - Odometry increments between scans
      limitations:
      - Basin about one cell
      computational_complexity: O(I N log C)
      memory_requirements: Low
    correlative_localization:
      method_id: correlative_localization
      category: localization
      display_name: Correlative Scan Matching
      implementation_ref: robot_lab_algorithms.scan_matching.CorrelativeMatcher
      mathematical_foundation: Exhaustive coarse-to-fine search on a Gaussian likelihood field
      equations:
      - L(x) = mean_i exp(-dist(T_x p_i)^2 / (2 sigma^2))
      - Coarse 0.1 m / 2.5 deg over +-0.3 m, +-10 deg; fine 0.025 m / 0.5 deg
      source_references:
      - Olson, Real-time correlative scan matching, ICRA 2009
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - localization_2d_known_map
      output_types:
      - PoseWithCovarianceStamped
      parameters:
        window: 0.3
        sigma: 0.05
      assumptions:
      - Known occupancy map
      - Odometry increments between scans
      limitations:
      - Resolution-limited; fixed window
      computational_complexity: O(W N)
      memory_requirements: Low

  # =============================================================================
  # R7.4 STATE ESTIMATION METHODS
  # =============================================================================
  
  state_estimation:
    # Rewritten 2026-10-13 to the implemented methods (see docs/status/evidence/r7*-2026-10-13).
    linear_kalman_filter:
      method_id: linear_kalman_filter
      category: state_estimation
      display_name: Linear Kalman Filter (constant velocity)
      implementation_ref: robot_lab_algorithms.tracking_filters.CvKalman
      mathematical_foundation: Kalman filter on [x, y, vx, vy]
      equations:
      - x_{k+1} = F x_k + G a, a ~ N(0, q^2 I)
      - z = H x + v, v ~ N(0, r^2 I)
      - Standard predict/update
      source_references:
      - Kalman, J. Basic Eng. 82 (1960)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - estimation_position_fixes
      output_types:
      - Odometry
      parameters:
        accel_std: 0.5
        measurement_std: 0.3
      assumptions:
      - Planar motion
      - Position fixes with known noise
      limitations:
      - No turn-rate model
      computational_complexity: O(1)
      memory_requirements: Low
    ekf_3d_estimator:
      method_id: ekf_3d_estimator
      category: state_estimation
      display_name: EKF (CTRV)
      implementation_ref: robot_lab_algorithms.tracking_filters.CtrvEkf
      mathematical_foundation: Extended Kalman filter on the constant turn rate and velocity model
      equations:
      - state [x, y, theta, v, w]
      - 'f: arc motion over dt; F = df/dx (numerical)'
      - Q from white longitudinal and yaw accelerations
      source_references:
      - Bar-Shalom, Li and Kirubarajan, Estimation with Applications to Tracking and Navigation (2001)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - estimation_position_fixes
      output_types:
      - Odometry
      parameters:
        accel_std: 0.5
        yaw_accel_std: 0.5
      assumptions:
      - Planar motion
      - Position fixes with known noise
      limitations:
      - (v, theta) ambiguity folded to v >= 0
      computational_complexity: O(1)
      memory_requirements: Low
    ukf_estimator:
      method_id: ukf_estimator
      category: state_estimation
      display_name: UKF (CTRV)
      implementation_ref: robot_lab_algorithms.tracking_filters.CtrvUkf
      mathematical_foundation: Unscented Kalman filter on the CTRV model
      equations:
      - 2n + 1 sigma points, alpha 0.5, beta 2, kappa 0
      - Circular mean for theta
      source_references:
      - Wan and van der Merwe, The unscented Kalman filter for nonlinear estimation, AS-SPCC 2000
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - estimation_position_fixes
      output_types:
      - Odometry
      parameters:
        accel_std: 0.5
      assumptions:
      - Planar motion
      - Position fixes with known noise
      limitations:
      - Same model as the EKF
      computational_complexity: O(n^3)
      memory_requirements: Low
    particle_filter:
      method_id: particle_filter
      category: state_estimation
      display_name: Particle Filter (CTRV)
      implementation_ref: robot_lab_algorithms.tracking_filters.CtrvParticleFilter
      mathematical_foundation: Sequential importance resampling on the CTRV model
      equations:
      - 500 particles propagated with sampled accelerations
      - w_i *= N(z; p_i, r^2 I)
      - Systematic resampling when 1 / sum w^2 < N/2
      source_references:
      - Gordon, Salmond and Smith, IEE Proc. F 140(2) 1993
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - estimation_position_fixes
      output_types:
      - Odometry
      parameters:
        particles: 500
        accel_std: 0.5
      assumptions:
      - Planar motion
      - Position fixes with known noise
      limitations:
      - Sampling noise; needs many particles in 5D
      computational_complexity: O(N)
      memory_requirements: Low
    motion_model_estimator:
      method_id: motion_model_estimator
      category: state_estimation
      display_name: Interacting Multiple Model
      implementation_ref: robot_lab_algorithms.tracking_filters.ImmFilter
      mathematical_foundation: IMM of a straight-line and a turning CTRV EKF
      equations:
      - 'Mixing: x0_j = sum_i mu_{i|j} x_i'
      - Model probabilities from the measurement likelihoods
      - Markov switching 0.05
      source_references:
      - Blom and Bar-Shalom, IEEE TAC 33(8) 1988
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - estimation_position_fixes
      output_types:
      - Odometry
      parameters:
        switch: 0.05
      assumptions:
      - Planar motion
      - Position fixes with known noise
      limitations:
      - Two models only
      computational_complexity: O(M)
      memory_requirements: Low
    pose_graph_estimator:
      method_id: pose_graph_estimator
      category: state_estimation
      display_name: Sliding-Window Smoother
      implementation_ref: robot_lab_algorithms.tracking_filters.WindowSmoother
      mathematical_foundation: Fixed-lag least squares over the last 20 fixes with constant-velocity factors
      equations:
      - min sum |p_i - z_i|^2 / r^2 + sum |p_{i+1} - 2 p_i + p_{i-1}|^2 / (q dt^2)^2
      - 'Estimate: newest pose; velocity from its last difference'
      source_references:
      - Dellaert and Kaess, Factor Graphs for Robot Perception, FnT Robotics 6(1-2) 2017
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - estimation_position_fixes
      output_types:
      - Odometry
      parameters:
        window: 20
      assumptions:
      - Planar motion
      - Position fixes with known noise
      limitations:
      - 'Linear model: heading from differences'
      computational_complexity: O(W^3)
      memory_requirements: Low

  # =============================================================================
  # R7.5 SENSOR FUSION METHODS
  # =============================================================================
  
  sensor_fusion:
    # Rewritten 2026-10-13 to the implemented methods (see docs/status/evidence/r7*-2026-10-13).
    complementary_imu:
      method_id: complementary_imu
      category: sensor_fusion
      display_name: Complementary Attitude Filter
      implementation_ref: robot_lab_algorithms.fusion_filters.ComplementaryAttitude
      mathematical_foundation: Gyro integration with roll and pitch pulled toward the accelerometer tilt
      equations:
      - q <- q * exp(w dt)
      - roll_a = atan2(a_y, a_z), pitch_a = atan2(-a_x, sqrt(a_y^2 + a_z^2))
      - alpha = tau / (tau + dt)
      source_references:
      - Euston et al., A complementary filter for attitude estimation of a fixed-wing UAV, IROS 2008
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - sensor_fusion_attitude_imu
      output_types:
      - Imu
      parameters:
        tau: 4.0
      assumptions:
      - IMU gyro and accelerometer
      - 'No magnetometer: yaw unobservable'
      limitations:
      - Leans with linear acceleration
      computational_complexity: O(1)
      memory_requirements: Low
    mahony_filter:
      method_id: mahony_filter
      category: sensor_fusion
      display_name: Mahony Explicit Complementary Filter
      implementation_ref: robot_lab_algorithms.fusion_filters.MahonyAhrs
      mathematical_foundation: PI feedback of the gravity cross error into the gyro
      equations:
      - v = R(q)^T e_z, e = a/|a| x v
      - w_c = w + kp e + ki integral(e)
      - q <- q * exp(w_c dt)
      source_references:
      - Mahony, Hamel and Pflimlin, IEEE TAC 53(5) 2008
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - sensor_fusion_attitude_imu
      output_types:
      - Imu
      parameters:
        kp: 0.25
        ki: 0.05
      assumptions:
      - IMU gyro and accelerometer
      - 'No magnetometer: yaw unobservable'
      limitations:
      - Fixed gain
      computational_complexity: O(1)
      memory_requirements: Low
    madgwick_filter:
      method_id: madgwick_filter
      category: sensor_fusion
      display_name: Madgwick Gradient-Descent Filter
      implementation_ref: robot_lab_algorithms.fusion_filters.MadgwickAhrs
      mathematical_foundation: One normalised gradient step per sample on the gravity objective
      equations:
      - f(q) = R(q)^T e_z - a/|a|
      - q_dot = q * (0, w) / 2 - beta J^T f / |J^T f|
      source_references:
      - Madgwick, An efficient orientation filter for inertial and inertial/magnetic sensor arrays (2010)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - sensor_fusion_attitude_imu
      output_types:
      - Imu
      parameters:
        beta: 0.02
      assumptions:
      - IMU gyro and accelerometer
      - 'No magnetometer: yaw unobservable'
      limitations:
      - Fixed gain
      computational_complexity: O(1)
      memory_requirements: Low
    attitude_eskf:
      method_id: attitude_eskf
      category: sensor_fusion
      display_name: Attitude Error-State Kalman Filter
      implementation_ref: robot_lab_algorithms.fusion_filters.AttitudeEskf
      mathematical_foundation: Error-state Kalman filter on attitude and gyro bias
      equations:
      - Error state [dtheta, db]; F = [[I - [w x] dt, -I dt], [0, I]]
      - h = R(q)^T e_z, H = [[h x], 0]
      - R_a covers sensor noise and platform acceleration
      source_references:
      - Sola, Quaternion kinematics for the error-state Kalman filter, arXiv:1711.02508 (2017)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      - unitree_g1_29dof
      input_strata:
      - sensor_fusion_attitude_imu
      output_types:
      - Imu
      parameters:
        linear_accel_std: 2.0
      assumptions:
      - IMU gyro and accelerometer
      - 'No magnetometer: yaw unobservable'
      limitations:
      - z bias weakly observable
      computational_complexity: O(1)
      memory_requirements: Low
    wheel_imu_fusion:
      method_id: wheel_imu_fusion
      category: sensor_fusion
      display_name: Wheel + IMU EKF
      implementation_ref: robot_lab_algorithms.fusion_filters.WheelImuEkf
      mathematical_foundation: EKF on [x, y, theta, v, b_g] with a zero angular rate update at standstill
      equations:
      - theta_{k+1} = theta_k + (g_z - b) dt
      - z_w = [v, g_z - b], tight yaw-rate noise when the wheels stop
      source_references:
      - Thrun, Burgard and Fox, Probabilistic Robotics (2005)
      applicable_robots:
      - bumperbot
      - labbot
      input_strata:
      - sensor_fusion_pose_wheel_imu
      output_types:
      - Odometry
      parameters:
        wheel_rate_noise: 0.2
      assumptions:
      - Wheel speed and yaw rate
      - Gyro with slowly varying bias
      limitations:
      - Position drifts without absolute fixes
      computational_complexity: O(1)
      memory_requirements: Low
    gps_odom_fusion:
      method_id: gps_odom_fusion
      category: sensor_fusion
      display_name: Wheel + IMU + GNSS EKF
      implementation_ref: robot_lab_algorithms.fusion_filters.WheelImuEkf
      mathematical_foundation: The wheel/IMU EKF with GNSS position updates
      equations:
      - z_gnss = [x, y] + v, v ~ N(0, 0.5^2 I)
      source_references:
      - Thrun, Burgard and Fox, Probabilistic Robotics (2005)
      applicable_robots:
      - bumperbot
      - labbot
      input_strata:
      - sensor_fusion_pose_wheel_imu_gnss
      output_types:
      - Odometry
      parameters:
        gnss_noise: 0.5
      assumptions:
      - Wheel speed and yaw rate
      - Gyro with slowly varying bias
      - GNSS in a local tangent plane
      limitations:
      - GNSS outages fall back to dead reckoning
      computational_complexity: O(1)
      memory_requirements: Low
    wheel_imu_gnss_ukf:
      method_id: wheel_imu_gnss_ukf
      category: sensor_fusion
      display_name: Wheel + IMU + GNSS UKF
      implementation_ref: robot_lab_algorithms.fusion_filters.WheelImuGnssUkf
      mathematical_foundation: Unscented Kalman filter on the same model and measurements
      equations:
      - Sigma points (alpha 0.3, beta 2, kappa 0); circular heading mean
      source_references:
      - Wan and van der Merwe, AS-SPCC 2000
      applicable_robots:
      - bumperbot
      - labbot
      input_strata:
      - sensor_fusion_pose_wheel_imu_gnss
      output_types:
      - Odometry
      parameters:
        gnss_noise: 0.5
      assumptions:
      - Wheel speed and yaw rate
      - Gyro with slowly varying bias
      limitations:
      - Costs about three times the EKF
      computational_complexity: O(n^3)
      memory_requirements: Low

  # =============================================================================
  # R7.6 GLOBAL PLANNING METHODS
  # =============================================================================
  
  global_planning:
    # Rewritten 2026-10-13 to the measured comparison arms (R7.6/R7.7 evidence).
    a_star_planner:
      method_id: a_star_planner
      category: global_planning
      display_name: Smac 2D A*
      implementation_ref: nav2_smac_planner/SmacPlanner2D
      mathematical_foundation: A* on the costmap grid with cost-aware edges
      equations:
      - f = g + h, h = Euclidean distance
      - edge cost includes costmap cost
      source_references:
      - Hart, Nilsson and Raphael, IEEE TSSC 4(2) 1968
      - Macenski et al., Smac planner, 2023
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        tolerance: 0.25
      assumptions:
      - Static 2D costmap
      limitations:
      - Grid-resolution paths
      computational_complexity: O(N log N)
      memory_requirements: Medium
    navfn_planner:
      method_id: navfn_planner
      category: global_planning
      display_name: NavFn (Dijkstra wavefront)
      implementation_ref: nav2_navfn_planner/NavfnPlanner
      mathematical_foundation: Dijkstra potential field propagated from the goal
      equations:
      - Potential propagation over the costmap; path by gradient descent
      source_references:
      - Brock and Khatib, High-speed navigation using the global dynamic window approach, ICRA 1999
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        use_astar: false
      assumptions:
      - Static 2D costmap
      limitations:
      - Grid-resolution paths
      computational_complexity: O(N log N)
      memory_requirements: Medium
    hybrid_a_star_planner:
      method_id: hybrid_a_star_planner
      category: global_planning
      display_name: Smac Hybrid-A*
      implementation_ref: nav2_smac_planner/SmacPlannerHybrid
      mathematical_foundation: A* over (x, y, heading) with Dubins/Reeds-Shepp motion primitives
      equations:
      - Expansion by curvature-limited arcs, minimum turning radius 0.4 m (Bumperbot)
      - Analytic expansion near the goal
      source_references:
      - Dolgov et al., Path planning for autonomous vehicles in unknown semi-structured environments, IJRR 29(5) 2010
      applicable_robots:
      - bumperbot
      - labbot
      - ackermann_car
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        minimum_turning_radius: 0.4
      assumptions:
      - Curvature-limited vehicle
      limitations:
      - Arrival loops on a differential base (R7.6)
      computational_complexity: O(N log N)
      memory_requirements: Medium
    state_lattice_planner:
      method_id: state_lattice_planner
      category: global_planning
      display_name: Smac State Lattice
      implementation_ref: nav2_smac_planner/SmacPlannerLattice
      mathematical_foundation: Search over precomputed kinematically feasible motion primitives
      equations:
      - Lattice of primitives for a 0.5 m turning radius (diff variant)
      source_references:
      - Pivtoraiko, Knepper and Kelly, Differentially constrained mobile robot motion planning in state lattices, JFR 26(3) 2009
      applicable_robots:
      - bumperbot
      - labbot
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        lattice_filepath: diff 0.5 m
      assumptions:
      - Primitive set matches the robot
      limitations:
      - Detours of 13-51 m on short maze goals (R7.6)
      computational_complexity: O(N log N)
      memory_requirements: Medium
    rrt_planner:
      method_id: rrt_planner
      category: global_planning
      display_name: RRT
      implementation_ref: robot_lab_algorithms.grid_planners.rrt
      mathematical_foundation: Goal-biased rapidly-exploring random tree with collision-checked edges
      equations:
      - Sample q (goal bias), extend nearest node by step, keep collision-free edges
      source_references:
      - LaValle, Rapidly-exploring random trees (1998)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        blocked_at: 80
        step: 0.5
      assumptions:
      - Free space sampled from the costmap
      limitations:
      - Long, jagged paths; no optimality
      computational_complexity: O(K log K)
      memory_requirements: Medium
    rrt_star_planner:
      method_id: rrt_star_planner
      category: global_planning
      display_name: RRT*
      implementation_ref: robot_lab_algorithms.grid_planners.rrt_star
      mathematical_foundation: RRT with best-parent choice and rewiring, anytime within 1 s
      equations:
      - Choose parent minimising cost within radius r(n); rewire neighbours
      source_references:
      - Karaman and Frazzoli, Sampling-based algorithms for optimal motion planning, IJRR 30(7) 2011
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        time_budget: 1.0
        blocked_at: 80
      assumptions:
      - Free space sampled from the costmap
      limitations:
      - May find no path within the budget in a maze
      computational_complexity: O(K log K)
      memory_requirements: Medium
    prm_planner:
      method_id: prm_planner
      category: global_planning
      display_name: PRM
      implementation_ref: robot_lab_algorithms.grid_planners.prm
      mathematical_foundation: 'Probabilistic roadmap: 600 free samples, k = 12 nearest-neighbour edges, Dijkstra'
      equations:
      - Roadmap edges collision-checked on the grid
      source_references:
      - Kavraki et al., Probabilistic roadmaps for path planning in high-dimensional configuration spaces, IEEE TRA 12(4) 1996
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        samples: 600
        k: 12
        blocked_at: 80
      assumptions:
      - Static map
      limitations:
      - Straight edges cut corners
      computational_complexity: O(K log K)
      memory_requirements: Medium
    voronoi_planner:
      method_id: voronoi_planner
      category: global_planning
      display_name: Voronoi Roadmap
      implementation_ref: robot_lab_algorithms.grid_planners.voronoi
      mathematical_foundation: Path along the generalized Voronoi diagram (maximum clearance)
      equations:
      - Voronoi of obstacle points, keep edges with clearance >= 0.75 x separation
      - Connect start/goal, Dijkstra
      source_references:
      - 'Choset and Burdick, Sensor-based exploration: the hierarchical generalized Voronoi graph, IJRR 19(2) 2000'
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - planning_2d_static_maze
      output_types:
      - Path
      parameters:
        separation: 0.75
      assumptions:
      - Static map
      limitations:
      - Longer paths (16% on nav_maze)
      computational_complexity: O(N log N)
      memory_requirements: Medium

  # =============================================================================
  # R7.7 LOCAL PLANNING METHODS
  # =============================================================================
  
  local_planning:
    # Rewritten 2026-10-13 to the measured comparison arms (R7.6/R7.7 evidence).
    pure_pursuit:
      method_id: pure_pursuit
      category: local_planning
      display_name: Nav2 Regulated Pure Pursuit
      implementation_ref: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      mathematical_foundation: Pure pursuit on a lookahead point with curvature and cost speed regulation
      equations:
      - kappa = 2 y / L^2
      - v regulated by curvature, proximity and approach distance; rotate to heading above 45 deg
      source_references:
      - Macenski et al., Regulated pure pursuit for robot path tracking, Autonomous Robots 47 (2023)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - local_planning_maze
      output_types:
      - Twist
      parameters:
        desired_linear_vel: 0.3
        lookahead_dist: 0.6
      assumptions:
      - Accurate localization
      limitations:
      - Conservative in narrow passages
      computational_complexity: O(N)
      memory_requirements: Medium
    dwb_local_planner:
      method_id: dwb_local_planner
      category: local_planning
      display_name: Nav2 DWB
      implementation_ref: dwb_core::DWBLocalPlanner
      mathematical_foundation: 'Trajectory rollout: dynamic window velocity samples, rollouts scored with critics'
      equations:
      - 'Critics: path/goal distance and alignment, obstacle footprint, oscillation, rotate-to-goal'
      source_references:
      - Fox, Burgard and Thrun, The dynamic window approach to collision avoidance, IEEE RAM 4(1) 1997
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - local_planning_maze
      output_types:
      - Twist
      parameters:
        sim_time: 1.7
      assumptions:
      - Critic weights tuned for the robot
      limitations:
      - Local minima at inflation edges (P3)
      computational_complexity: O(V T)
      memory_requirements: Medium
    mppi_controller:
      method_id: mppi_controller
      category: local_planning
      display_name: Nav2 MPPI
      implementation_ref: nav2_mppi_controller::MPPIController
      mathematical_foundation: 'Trajectory optimization: model predictive path integral over 2000 noisy control sequences (2.8 s), weighted average'
      equations:
      - u* = sum w_k u_k, w_k = exp(-(S_k - min S) / lambda)
      source_references:
      - Williams et al., Information theoretic MPC for model-based reinforcement learning, ICRA 2017
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - local_planning_maze
      output_types:
      - Twist
      parameters:
        batch_size: 2000
        vx_max: 0.3
      assumptions:
      - Critic weights tuned for the robot
      limitations:
      - Did not settle into Bumperbot arrival window (R7.7)
      computational_complexity: O(K T)
      memory_requirements: Medium
    regulated_pure_pursuit:
      method_id: regulated_pure_pursuit
      category: local_planning
      display_name: robot_lab Pure Pursuit (FollowPath adapter)
      implementation_ref: robot_lab_algorithms.nav2_adapters.pure_pursuit
      mathematical_foundation: Pure pursuit with curvature slowdown below a 0.9 m turn radius, served as Nav2 FollowPath
      equations:
      - kappa = 2 y / L^2, v reduced when 1/kappa < 0.9 m, rotate to heading above 45 deg
      source_references:
      - Coulter, Implementation of the pure pursuit path tracking algorithm, CMU-RI-TR-92-01 (1992)
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - local_planning_maze
      output_types:
      - Twist
      parameters:
        lookahead: 0.6
      assumptions:
      - Accurate localization
      limitations:
      - No cost-based regulation
      computational_complexity: O(N)
      memory_requirements: Medium
    follow_the_gap:
      method_id: follow_the_gap
      category: local_planning
      display_name: robot_lab Follow-the-Gap (FollowPath adapter)
      implementation_ref: robot_lab_algorithms.nav2_adapters.follow_the_gap
      mathematical_foundation: 'Reactive: steer toward the free scan gap closest to the path direction'
      equations:
      - Open beams beyond a clearance horizon; gaps wider than the robot; speed from free space ahead
      source_references:
      - 'Sezer and Gokasan, A novel obstacle avoidance algorithm: follow the gap method, RAS 60(9) 2012'
      applicable_robots:
      - bumperbot
      - labbot
      - unitree_go2
      input_strata:
      - local_planning_maze
      output_types:
      - Twist
      parameters:
        robot_radius: 0.12
      assumptions:
      - 2D scan sees obstacles
      limitations:
      - Cuts closest to walls (R7.7)
      computational_complexity: O(N)
      memory_requirements: Medium

  # =============================================================================
  # R7.8 CONTROL METHODS
  # Path tracking on one differential-drive (unicycle) plant; implementation
  # robot_lab_algorithms.tracking_control, served as Nav2 FollowPath by
  # nav2_local_planner.  Rewritten 2026-10-13: the earlier records described
  # generic textbook forms that the single-axis demonstration nodes did not
  # implement.  Benchmark: docs/status/evidence/r78-control-benchmark-2026-10-13/.
  # =============================================================================

  control:
    pid_controller:
      method_id: "pid_controller"
      category: "control"
      display_name: "PID Path-Tracking Controller"
      implementation_ref: "robot_lab_algorithms.tracking_control.PidTracker"
      mathematical_foundation: "PID on a heading error that folds in the lateral offset, with curvature feedforward"
      equations:
        - "theta_d = theta_r(s*) - atan(k_lat * e_lat)"
        - "e = wrap(theta_d - theta)"
        - "w = kappa(s*) v_r + K_p e + K_i I + K_d de_f/dt  (de_f: first-order filtered derivative, tau 0.3 s)"
        - "I grows only while |w| < w_max or e drives w back from saturation; |I| <= i_max (conditional integration)"
        - "v = v_r(s*) max(0, cos e_theta)"
      source_references:
        - "Astrom and Hagglund - Advanced PID Control (2006), integrator windup"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_linear_plant"
        - "control_constrained"
      output_types: ["Twist"]
      parameters:
        kp: 2.0
        ki: 0.3
        kd: 0.1
        k_lat: 2.0
        i_max: 1.0
      assumptions:
        - "Differential-drive plant that can turn in place"
        - "Path smooth at the 0.25 m resampling scale"
      limitations:
        - "Gains tuned on the model plant, not identified on the robot"
        - "No preview: reacts to corners only when they are reached"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"

    lqr_controller:
      method_id: "lqr_controller"
      category: "control"
      display_name: "LQR Path-Tracking Controller"
      implementation_ref: "robot_lab_algorithms.tracking_control.LqrTracker"
      mathematical_foundation: "Discrete LQR on the lateral/heading error linearised about the path"
      equations:
        - "z = [e_lat, e_theta], u = w - kappa v_r"
        - "z_{k+1} = [[1, v dt], [0, 1]] z_k + [[v dt^2/2], [dt]] u_k"
        - "P = A'PA - A'PB (R + B'PB)^-1 B'PA + Q  (DARE)"
        - "K(v) = (R + B'PB)^-1 B'PA; w = kappa v_r - K(v_r) z"
      source_references:
        - "Anderson and Moore - Optimal Control: Linear Quadratic Methods (1990)"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_linear_plant"
      output_types: ["Twist"]
      parameters:
        q_lat: 6.0
        q_heading: 1.0
        r: 0.6
        dt: 0.05
      assumptions:
        - "Small heading error (linearisation)"
        - "Speed changes slowly relative to the gain schedule (0.01 m/s steps)"
      limitations:
        - "Unconstrained design: saturation is applied afterwards"
        - "Large initial heading errors leave the linearised region (envelope test)"
      computational_complexity: "O(1) per step after one DARE per speed bucket"
      memory_requirements: "Minimal"

    mpc_controller:
      method_id: "mpc_controller"
      category: "control"
      display_name: "Constrained Linear MPC Path Tracker"
      implementation_ref: "robot_lab_algorithms.tracking_control.LinearMpcTracker"
      mathematical_foundation: "Linear time-varying MPC on the lateral error model with hard turn-rate bounds"
      equations:
        - "z_{k+1} = A(v_k) z_k + B(v_k)(w_k - kappa_k v_k), (v_k, kappa_k) from the path preview"
        - "min sum_k z_k' Q z_k + r (w_k - kappa_k v_k)^2 + s (w_k - w_{k-1})^2, terminal weight 4Q"
        - "s.t. -w_max <= w_k <= w_max, k = 0..N-1"
        - "Condensed QP with box bounds solved exactly by bounded-variable least squares (BVLS)"
      source_references:
        - "Rawlings, Mayne and Diehl - Model Predictive Control: Theory, Computation, and Design (2017)"
        - "Stark and Parker - Bounded-variable least-squares (1995)"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_constrained"
      output_types: ["Twist"]
      parameters:
        horizon: 20
        dt: 0.1
        q_lat: 6.0
        q_heading: 1.0
        r: 0.6
        rate: 0.4
        q_terminal: 4.0
      assumptions:
        - "Linearised error model along the previewed path"
      limitations:
        - "Speed follows the reference profile; only the turn rate is optimised"
        - "Rate penalty is soft; acceleration limits are not constraints"
      computational_complexity: "BVLS on N=20 variables per step"
      memory_requirements: "Low"

    nonlinear_mpc:
      method_id: "nonlinear_mpc"
      category: "control"
      display_name: "Nonlinear MPC Path Tracker"
      implementation_ref: "robot_lab_algorithms.tracking_control.NonlinearMpcTracker"
      mathematical_foundation: "Nonlinear MPC on the unicycle kinematics, single shooting with an adjoint gradient"
      equations:
        - "x_{k+1} = x_k + v_k cos(theta_k) dt, y_{k+1} = y_k + v_k sin(theta_k) dt, theta_{k+1} = theta_k + w_k dt"
        - "J = sum q_p |p_k - p_rk|^2 + q_th 2(1 - cos(theta_k - theta_rk)) + r_v (v_k - v_rk)^2 + r_w (w_k - w_rk)^2 + rate penalties"
        - "dJ/du from the backward (adjoint) recursion lambda_k = dl/dx_k + (df/dx_k)' lambda_{k+1}"
        - "v_min <= v_k <= v_max, |w_k| <= w_max; L-BFGS-B, at most 30 iterations, warm-started from the shifted solution"
      source_references:
        - "Grune and Pannek - Nonlinear Model Predictive Control (2017)"
        - "Byrd, Lu, Nocedal and Zhu - L-BFGS-B (1995)"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_nonlinear_plant"
        - "control_constrained"
      output_types: ["Twist"]
      parameters:
        horizon: 15
        dt: 0.1
        q_position: 8.0
        q_heading: 1.0
        r_v: 1.0
        r_w: 0.2
        max_iterations: 30
      assumptions:
        - "Kinematic plant; actuator lag not modelled"
      limitations:
        - "Iteration-limited, so not always converged; compute time can exceed the 50 ms period under load"
      computational_complexity: "O(N * iterations) per step"
      memory_requirements: "Low"

    feedback_linearization:
      method_id: "feedback_linearization"
      category: "control"
      display_name: "Feedback-Linearisation Path Tracker"
      implementation_ref: "robot_lab_algorithms.tracking_control.FeedbackLinearizationTracker"
      mathematical_foundation: "Static input-output linearisation of a point ahead of the wheel axle"
      equations:
        - "P = (x + d cos theta, y + d sin theta)"
        - "P_dot = M(theta) [v, w], M = [[cos theta, -d sin theta], [sin theta, d cos theta]], det M = d"
        - "P_dot_des = P_dot_r + K (P_r - P), P_r = path(s* + d) moving at v_r"
        - "[v, w] = M^-1 P_dot_des"
      source_references:
        - "Oriolo, De Luca and Vendittelli - WMR control via dynamic feedback linearization, IEEE TCST 10(6), 2002"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_nonlinear_plant"
      output_types: ["Twist"]
      parameters:
        offset: 0.2
        gain: 1.5
      assumptions:
        - "d != 0; the point P, not the axle, is linearised"
      limitations:
        - "Forward-only saturation (v >= 0) breaks exactness when P must move backwards"
        - "The axle cuts inside corners by up to about d"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"

    backstepping_controller:
      method_id: "backstepping_controller"
      category: "control"
      display_name: "Backstepping Path Tracker"
      implementation_ref: "robot_lab_algorithms.tracking_control.BacksteppingTracker"
      mathematical_foundation: "Lyapunov/backstepping tracking law for the unicycle"
      equations:
        - "e_x = cos(th)(x_r - x) + sin(th)(y_r - y), e_y = -sin(th)(x_r - x) + cos(th)(y_r - y), e_th = th_r - th"
        - "v = v_r cos(e_th) + c_x e_x"
        - "w = w_r + c_th e_th + gamma v_r e_y sin(e_th)/e_th"
        - "V = (e_x^2 + e_y^2)/2 + e_th^2/(2 gamma), V_dot = -c_x e_x^2 - (c_th/gamma) e_th^2 <= 0"
      source_references:
        - "Jiang and Nijmeijer - Tracking control of mobile robots: a case study in backstepping, Automatica 33(7), 1997"
        - "Kanayama, Kimura, Miyazaki and Noguchi - A stable tracking control method for an autonomous mobile robot, ICRA 1990"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_nonlinear_plant"
      output_types: ["Twist"]
      parameters:
        c_x: 1.0
        c_theta: 2.0
        gamma: 8.0
      assumptions:
        - "Reference speed v_r > 0 for lateral convergence"
      limitations:
        - "Saturation is outside the Lyapunov argument"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"
