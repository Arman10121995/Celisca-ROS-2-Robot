# R7.2-R7.8 Method Subrecords
# Comprehensive method definitions with mathematical foundations, equations, and input strata
# for benchmarking algorithm breadth requirements

method_subrecords:
  # =============================================================================
  # R7.2 PERCEPTION PIPELINES
  # =============================================================================
  
  perception:
    obstacle_detector:
      method_id: "obstacle_detector"
      category: "perception"
      display_name: "Laser Scan Obstacle Detector"
      implementation_ref: "robot_lab_algorithms.obstacle_detector"
      mathematical_foundation: "Ray-based obstacle detection with range thresholding"
      equations:
        - "obstacle_range = min(range_measurements)"
        - "obstacle_present = (obstacle_range < threshold)"
        - "obstacle_angle = argmin(range_measurements)"
      source_references:
        - "ROS LaserScan message documentation"
        - "Standard robotics obstacle detection methods"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_sparse"
        - "perception_lidar_2d_dense"
      output_types: ["MarkerArray", "PointCloud2"]
      parameters:
        range_threshold: 1.0
        min_height: 0.1
        max_height: 0.5
      assumptions:
        - "2D LiDAR in horizontal plane"
        - "Static obstacles"
      limitations:
        - "Cannot detect overhanging obstacles"
        - "Limited to 2D detection"
      computational_complexity: "O(n)"
      memory_requirements: "Low"
      
    scan_clusterer:
      method_id: "scan_clusterer"
      category: "perception" 
      display_name: "Scan Clustering Obstacle Detector"
      implementation_ref: "robot_lab_algorithms.scan_clusterer"
      mathematical_foundation: "Connected components clustering on range data"
      equations:
        - "cluster_formation: points grouped by proximity threshold"
        - "bounding_box: [min_x, max_x, min_y, max_y] per cluster"
      source_references:
        - "Probabilistic Robotics - Thrun, Burgard, Fox"
        - "Connected component labeling algorithms"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_sparse"
        - "perception_lidar_2d_dense"
      output_types: ["MarkerArray", "PointCloud2"]
      parameters:
        cluster_threshold: 0.2
        min_cluster_size: 5
      assumptions:
        - "Obstacles are contiguous in scan"
        - "Flat ground"
      limitations:
        - "Fails with sparse point clouds"
        - "Sensitive to threshold"
      computational_complexity: "O(n log n)"
      memory_requirements: "Medium"
      
    euclidean_clusterer:
      method_id: "euclidean_clusterer"
      category: "perception"
      display_name: "Euclidean Distance Clustering"
      implementation_ref: "robot_lab_algorithms.euclidean_clusterer"
      mathematical_foundation: "Distance-based clustering using Euclidean metrics"
      equations:
        - "distance = sqrt((x2-x1)^2 + (y2-y1)^2)"
        - "cluster_merge = distance < threshold"
      source_references:
        - "SciKit-learn DBSCAN implementation"
        - "Euclidean space clustering methods"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_dense"
      output_types: ["MarkerArray", "PointCloud2"]
      parameters:
        cluster_radius: 0.3
        min_points_per_cluster: 3
      assumptions:
        - "3D point cloud input"
        - "Uniform point density"
      limitations:
        - "Computationally expensive for large clouds"
        - "Sensitive to parameter tuning"
      computational_complexity: "O(n^2)"
      memory_requirements: "High"
      
    dbscan_clusterer:
      method_id: "dbscan_clusterer"
      category: "perception"
      display_name: "DBSCAN Density-Based Clustering"
      implementation_ref: "robot_lab_algorithms.dbscan_clusterer"
      mathematical_foundation: "Density-based clustering with noise classification"
      equations:
        - "core_point: |N_eps(p)| >= min_samples"
        - "border_point: |N_eps(p)| < min_samples but reachable from core"
        - "noise: points not core or border"
      source_references:
        - "Ester et al. - DBSCAN: A Density-based algorithm for Discovering Clusters"
        - "Scikit-learn clustering documentation"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_dense"
        - "perception_lidar_3d"
      output_types: ["MarkerArray", "PointCloud2"]
      parameters:
        eps: 0.2
        min_samples: 5
      assumptions:
        - "Clusters have similar density"
        - "Noise points are distinguishable"
      limitations:
        - "Fails with varying density clusters"
        - "Parameter sensitive"
      computational_complexity: "O(n log n)"
      memory_requirements: "Medium"
      
    ransac_ground_removal:
      method_id: "ransac_ground_removal"
      category: "perception"
      display_name: "RANSAC Ground Plane Removal"
      implementation_ref: "robot_lab_algorithms.ransac_ground_removal"
      mathematical_foundation: "RANdom SAmple Consensus for plane fitting and removal"
      equations:
        - "plane_model: ax + by + cz + d = 0"
        - "inlier_threshold: |ax_i + by_i + cz_i + d| < threshold"
        - "iterations: log(1-p)/log(1-w^s) where p=0.99, w=inlier_ratio, s=samples"
      source_references:
        - "Fischler and Bolles - Random Sample Consensus"
        - "PCL RANSAC implementation"
      applicable_robots: ["bumperbot"]
      input_strata:
        - "perception_lidar_3d"
        - "perception_rgbd"
      output_types: ["PointCloud2", "PointCloud2"]
      parameters:
        max_iterations: 1000
        distance_threshold: 0.05
        min_inliers: 100
      assumptions:
        - "Ground plane is dominant feature"
        - "Points are in 3D space"
      limitations:
        - "Computationally intensive"
        - "May fail with non-planar surfaces"
      computational_complexity: "O(n*k)"
      memory_requirements: "High"

  # =============================================================================
  # R7.3 LOCALIZATION METHODS
  # =============================================================================
  
  localization:
    dead_reckoning:
      method_id: "dead_reckoning"
      category: "localization"
      display_name: "Wheel Odometry Dead Reckoning"
      implementation_ref: "robot_lab_algorithms.dead_reckoning"
      mathematical_foundation: "Kinematic model integration of wheel encoder data"
      equations:
        - "dx = (v_left + v_right) * dt / 2"
        - "dtheta = (v_right - v_left) * dt / wheelbase"
        - "x_{k+1} = x_k + dx * cos(theta_k)"
        - "y_{k+1} = y_k + dx * sin(theta_k)"
        - "theta_{k+1} = theta_k + dtheta"
      source_references:
        - "Probabilistic Robotics - Wheel Odometry Motion Model"
        - "ROS Dead Reckoning implementation"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "localization_odometry_only"
      output_types: ["Odometry", "TF"]
      parameters:
        wheelbase: 0.256
        wheel_radius: 0.0315
        ticks_per_revolution: 4096
      assumptions:
        - "No wheel slippage"
        - "Flat floor"
        - "Known wheelbase and radius"
      limitations:
        - "Unbounded error growth over time"
        - "Sensitive to wheel slippage and calibration"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"
      
    amcl:
      method_id: "amcl"
      category: "localization"
      display_name: "Adaptive Monte Carlo Localization"
      implementation_ref: "robot_lab_algorithms.amcl"
      mathematical_foundation: "Particle filter with KLD sampling and laser likelihood"
      equations:
        - "particle_weight = p(z_t | x_t, m) * p(x_t | x_{t-1}, u_t)"
        - "effective_sample_size = 1 / sum(w_i^2)"
        - "KLD_sampling: sample when N_eff < N/2"
        - "beam_model: z_k ~ N(0, sigma_hit) if hit, L_max if max_range"
      source_references:
        - "Fox et al. - Monte Carlo Localization"
        - "AMCL ROS package documentation"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "localization_lidar_map"
      output_types: ["Odometry", "ParticleCloud"]
      parameters:
        min_particles: 50
        max_particles: 5000
        kld_err: 0.01
        kld_z: 0.99
        laser_likelihood_beam: 0.1
      assumptions:
        - "Known map of environment"
        - "LiDAR scan corresponds to static map features"
      limitations:
        - "Requires initial pose estimate"
        - "Computationally intensive with many particles"
        - "Struggles with symmetrical environments"
      computational_complexity: "O(n*log(n)) where n=particles"
      memory_requirements: "Medium"
      
    icp_localization:
      method_id: "icp_localization"
      category: "localization"
      display_name: "Iterative Closest Point Localization"
      implementation_ref: "robot_lab_algorithms.icp_localization"
      mathematical_foundation: "Point cloud registration using iterative closest point algorithm"
      equations:
        - "error = sum(||p - R*q - t||^2) for correspondences (p,q)"
        - "J = sum(J_p^T J_p) where J_p is Jacobian for point p"
        - "delta_x = (J^T J)^-1 J^T error_vector"
      source_references:
        - "Besl and McKay - A Method for Registration of 3-D Shapes and 2-D Images"
        - "PCL ICP implementation"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "localization_lidar_map"
      output_types: ["Odometry", "TF"]
      parameters:
        max_iterations: 100
        transformation_epsilon: 1e-6
        max_correspondence_distance: 0.1
        euclidean_fitness_epsilon: 0.001
      assumptions:
        - "Good initial pose estimate"
        - "Significant overlap between scans"
      limitations:
        - "Requires good initial alignment"
        - "Sensitive to outliers"
        - "Local minima possible"
      computational_complexity: "O(n*m*k) where n,m=point counts, k=iterations"
      memory_requirements: "High"
      
    ndt_localization:
      method_id: "ndt_localization"
      category: "localization"
      display_name: "Normal Distributions Transform Localization"
      implementation_ref: "robot_lab_algorithms.ndt_localization"
      mathematical_foundation: "Probabilistic registration using normal distribution transforms"
      equations:
        - "score = sum(p( x_i - (R*q_j + t) ) for correspondences"
        - "NDT cell: p(x) = N(mean, covariance) for points in cell"
        - "gradient = d(score)/d(transform)"
      source_references:
        - "Biber and Straßer - The Normal Distributions Transform"
        - "PCL NDT implementation"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "localization_lidar_map"
      output_types: ["Odometry", "TF"]
      parameters:
        resolution: 0.1
        step_size: 0.1
        transformation_epsilon: 0.01
        max_iterations: 50
      assumptions:
        - "3D structure in environment"
        - "Good initial pose"
      limitations:
        - "Computationally expensive"
        - "Memory intensive for fine resolution"
        - "Sensitive to resolution parameter"
      computational_complexity: "O(n*k) where n=cells, k=iterations"
      memory_requirements: "Very High"
      
    rgbd_slam_localization:
      method_id: "rgbd_slam_localization"
      category: "localization"
      display_name: "RGB-D SLAM Localization"
      implementation_ref: "robot_lab_algorithms.rgbd_slam_localization"
      mathematical_foundation: "Visual odometry and mapping using RGB-D data"
      equations:
        - "feature_matching: ORB/SIFT features between frames"
        - "pose_estimation: 5-point algorithm or PnP"
        - "bundle_adjustment: minimize re-projection error"
      source_references:
        - "Henry et al. - RGB-D Mapping: Using depth cameras for dense 3D modeling"
        - "ORB-SLAM2/3 algorithms"
      applicable_robots: ["bumperbot"]
      input_strata:
        - "localization_multi_sensor"
        - "perception_rgbd"
      output_types: ["Odometry", "Map", "KeyFrame"]
      parameters:
        visual_features: 1000
        depth_threshold: 2.0
        min_matches: 20
      assumptions:
        - "RGB-D camera calibration available"
        - "Textured environment"
      limitations:
        - "Requires good lighting conditions"
        - "Sensitive to camera calibration"
        - "Computationally intensive"
      computational_complexity: "O(n^2)"
      memory_requirements: "Very High"

  # =============================================================================
  # R7.4 STATE ESTIMATION METHODS
  # =============================================================================
  
  state_estimation:
    ekf_3d_estimator:
      method_id: "ekf_3d_estimator"
      category: "state_estimation"
      display_name: "Extended Kalman Filter 3D Estimator"
      implementation_ref: "robot_lab_algorithms.ekf_3d_estimator"
      mathematical_foundation: "Extended Kalman Filter for nonlinear systems in 3D space"
      equations:
        - "State prediction: x_{k|k-1} = f(x_{k-1|k-1}, u_k, dt)"
        - "Covariance prediction: P_{k|k-1} = F_k P_{k-1|k-1} F_k^T + Q_k"
        - "Kalman gain: K_k = P_{k|k-1} H_k^T (H_k P_{k|k-1} H_k^T + R_k)^-1"
        - "State update: x_{k|k} = x_{k|k-1} + K_k (z_k - h(x_{k|k-1}))"
        - "Covariance update: P_{k|k} = (I - K_k H_k) P_{k|k-1}"
      source_references:
        - "Maybeck - Stochastic Models, Estimation and Control"
        - "Groves - Principles of GNSS, Inertial, and Multisensor Integrated Navigation Systems"
      applicable_robots: ["bumperbot", "labbot", "go2", "berkeley_humanoid_lite"]
      input_strata:
        - "state_estimation_linear_dynamics"
        - "state_estimation_nonlinear_dynamics"
        - "state_estimation_high_frequency"
      output_types: ["Odometry", "PoseWithCovariance"]
      parameters:
        initial_covariance: [0.1, 0.1, 0.1, 0.01, 0.01, 0.01]
        process_noise_covariance: [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]
        measurement_noise_covariance: [0.05, 0.05, 0.05, 0.01, 0.01, 0.01]
      assumptions:
        - "Gaussian noise distributions"
        - "Small nonlinearities allow linearization"
        - "Known system dynamics model"
      limitations:
        - "Sensitive to model errors"
        - "Linearization errors can cause divergence"
        - "Requires good initial estimate"
      computational_complexity: "O(n^3) where n=state dimension"
      memory_requirements: "Medium"
      
    linear_kalman_filter:
      method_id: "linear_kalman_filter"
      category: "state_estimation"
      display_name: "Linear Kalman Filter Estimator"
      implementation_ref: "robot_lab_algorithms.linear_kalman_filter"
      mathematical_foundation: "Optimal estimator for linear systems with Gaussian noise"
      equations:
        - "State prediction: x_{k|k-1} = F_k x_{k-1|k-1} + B_k u_k"
        - "Covariance prediction: P_{k|k-1} = F_k P_{k-1|k-1} F_k^T + Q_k"
        - "Measurement prediction: z_{k|k-1} = H_k x_{k|k-1}"
        - "Innovation covariance: S_k = H_k P_{k|k-1} H_k^T + R_k"
        - "Kalman gain: K_k = P_{k|k-1} H_k^T S_k^-1"
        - "State update: x_{k|k} = x_{k|k-1} + K_k (z_k - z_{k|k-1})"
        - "Covariance update: P_{k|k} = (I - K_k H_k) P_{k|k-1}"
      source_references:
        - "Kalman - A New Approach to Linear Filtering and Prediction Problems"
        - "Maybeck - Stochastic Models, Estimation and Control"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "state_estimation_linear_dynamics"
        - "state_estimation_high_frequency"
      output_types: ["Odometry", "PoseWithCovariance"]
      parameters:
        state_dimension: 3
        measurement_dimension: 3
        process_noise_std: [0.05, 0.05, 0.01]
        measurement_noise_std: [0.1, 0.1, 0.05]
      assumptions:
        - "Linear system dynamics"
        - "Gaussian noise distributions"
        - "Known system matrices F, B, H"
      limitations:
        - "Only works for linear systems"
        - "Requires exact model knowledge"
      computational_complexity: "O(n^3)"
      memory_requirements: "Low"
      
    ukf_estimator:
      method_id: "ukf_estimator"
      category: "state_estimation"
      display_name: "Unscented Kalman Filter Estimator"
      implementation_ref: "robot_lab_algorithms.ukf_estimator"
      mathematical_foundation: "Deterministic sampling approach for nonlinear systems using Unscented Transform"
      equations:
        - "Sigma points: X_i = x_{k-1|k-1} + (sqrt((n+lambda)P_{k-1|k-1}))_i"
        - "Transformed points: X_i^* = f(X_i)"
        - "Mean prediction: x_{k|k-1} = sum(w_i_m * X_i^*)"
        - "Covariance prediction: P_{k|k-1} = sum(w_i_c * (X_i^* - x_{k|k-1})(X_i^* - x_{k|k-1})^T) + Q_k"
        - "lambda = alpha^2 * (n + kappa) - n"
      source_references:
        - "Julier and Uhlmann - Unscented Filtering and Nonlinear Estimation"
        - "Wan and Van Der Merwe - The Unscented Kalman Filter for Nonlinear Estimation"
      applicable_robots: ["bumperbot", "labbot", "go2"]
      input_strata:
        - "state_estimation_nonlinear_dynamics"
        - "state_estimation_high_frequency"
      output_types: ["Odometry", "PoseWithCovariance"]
      parameters:
        alpha: 0.1
        beta: 2.0
        kappa: 0.0
        scaling_factor: 1.0
      assumptions:
        - "Nonlinear but smooth system dynamics"
        - "Gaussian noise distributions"
      limitations:
        - "Computationally more expensive than EKF"
        - "Still assumes Gaussian distributions"
        - "Can suffer from sampling issues in high dimensions"
      computational_complexity: "O(n^3)"
      memory_requirements: "Medium"
      
    particle_filter:
      method_id: "particle_filter"
      category: "state_estimation"
      display_name: "Particle Filter Estimator"
      implementation_ref: "robot_lab_algorithms.particle_filter"
      mathematical_foundation: "Sequential Monte Carlo method for nonlinear, non-Gaussian systems"
      equations:
        - "Particles: x_i_{k} ~ p(x_k | x_{k-1}^{(i)}, u_k, z_k)"
        - "Importance weights: w_i = p(z_k | x_k^{(i)}) / q(x_k^{(i)} | x_{k-1}^{(i)}, z_k)"
        - "Resampling: x_k^{(i)} ~ sum_j w_j delta(x_k^{(j)}) when N_eff < threshold"
        - "Effective sample size: N_eff = 1 / sum(w_i^2)"
      source_references:
        - "Arulampalam et al. - A tutorial on particle filters for online nonlinear/non-Gaussian Bayesian tracking"
        - "Thrun et al. - Probabilistic Robotics"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "state_estimation_nonlinear_dynamics"
        - "state_estimation_low_frequency"
      output_types: ["Odometry", "PoseWithCovariance"]
      parameters:
        num_particles: 1000
        resampling_threshold: 0.5
        diffusion_factor: 0.1
      assumptions:
        - "Importance density can be sampled from"
        - "Non-Gaussian distributions possible"
      limitations:
        - "Computationally very expensive"
        - "Sensitive to particle depletion"
        - "Requires many particles for good performance"
        - "Curse of dimensionality"
      computational_complexity: "O(n*m) where n=particles, m=state dimension"
      memory_requirements: "Very High"
      
    error_state_ekf:
      method_id: "error_state_ekf"
      category: "state_estimation"
      display_name: "Error-State Extended Kalman Filter"
      implementation_ref: "robot_lab_algorithms.error_state_ekf"
      mathematical_foundation: "EKF that estimates error from nominal trajectory"
      equations:
        - "Error state: delta_x = x_true - x_nominal"
        - "Error dynamics: delta_x_{k+1} = A_k delta_x_k + w_k"
        - "Measurement residual: delta_z = z_k - h(x_nominal_k)"
        - "Correction: delta_x_corrected = K_k * delta_z"
        - "State update: x_estimated = x_nominal + delta_x_corrected"
      source_references:
        - "Groves - Principles of GNSS, Inertial, and Multisensor Integrated Navigation Systems"
        - "Shin - Estimation Techniques forNavigation Systems"
      applicable_robots: ["bumperbot", "labbot", "go2", "berkeley_humanoid_lite"]
      input_strata:
        - "state_estimation_nonlinear_dynamics"
        - "state_estimation_high_frequency"
      output_types: ["Odometry", "PoseWithCovariance"]
      parameters:
        nominal_trajectory_source: "odometry"
        error_state_dimension: 6
        convergence_threshold: 1e-6
      assumptions:
        - "Nominal trajectory is close to true trajectory"
        - "Error dynamics are approximately linear"
        - "Gaussian noise distributions"
      limitations:
        - "Depends on quality of nominal trajectory"
        - "Error state approximation may not hold"
      computational_complexity: "O(n^3)"
      memory_requirements: "Medium"

  # =============================================================================
  # R7.5 SENSOR FUSION METHODS
  # =============================================================================
  
  sensor_fusion:
    complementary_imu:
      method_id: "complementary_imu"
      category: "sensor_fusion"
      display_name: "Complementary Filter for IMU Attitude Estimation"
      implementation_ref: "robot_lab_algorithms.complementary_imu"
      mathematical_foundation: "Complementary filter combining gyro and accelerometer data"
      equations:
        - "Attitude prediction (gyro): q_{k|k-1} = q_{k-1} ⊗ exp(0.5 * [0, ω_x dt, ω_y dt, ω_z dt])^T"
        - "Attitude correction (accel): q_correction = [1, 0, 0, 0] ⊗ [0, a_x, a_y, a_z]"
        - "Complementary fusion: q_k = alpha * q_{k|k-1} + (1-alpha) * q_correction"
        - "Normalization: q_k = q_k / ||q_k||"
      source_references:
        - "Mahony - Complementary filter design for orientation estimation"
        - "Madgwick et al. - An efficient orientation filter for inertial and inertial/magnetic sensor arrays"
      applicable_robots: ["bumperbot", "labbot", "go2", "berkeley_humanoid_lite"]
      input_strata:
        - "sensor_fusion_attitude_only"
      output_types: ["Imu", "Pose"]
      parameters:
        alpha: 0.98
        sample_rate_hz: 100.0
      assumptions:
        - "Accelerometer measures gravity vector when static"
        - "Gyro measures angular velocity accurately"
        - "Small time steps"
      limitations:
        - "Accelerometer noise affects roll/pitch estimation"
        - "Gyro drift affects yaw estimation"
        - "Requires tuning of alpha parameter"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"
      
    mahony_filter:
      method_id: "mahony_filter"
      category: "sensor_fusion"
      display_name: "Mahony AHRS Filter"
      implementation_ref: "robot_lab_algorithms.mahony_filter"
      mathematical_foundation: "PI-based complementary filter with improved convergence"
      equations:
        - "Error calculation: e = a_measured × v_estimated - a_reference × v_estimated"
        - "PI correction: I += e * dt * K_i"
        - "Angular rate correction: ω_correction = e * K_p + I"
        - "Attitude update: q_{k+1} = q_k ⊗ exp(0.5 * [0, ω_x+ω_correction_x, ω_y+ω_correction_y, ω_z+ω_correction_z]^T * dt)"
      source_references:
        - "Mahony - Complementary filter design for orientation estimation"
        - "Mahony et al. - Nonlinear complementary filters on the special orthogonal group"
      applicable_robots: ["bumperbot", "labbot", "go2", "berkeley_humanoid_lite"]
      input_strata:
        - "sensor_fusion_attitude_only"
      output_types: ["Imu", "Pose"]
      parameters:
        k_p: 1.0
        k_i: 0.01
        sample_rate_hz: 100.0
      assumptions:
        - "Reference vector is known (gravity)"
        - "Small angle errors"
        - "Constant sample rate"
      limitations:
        - "Slow convergence for large initial errors"
        - "Requires tuning of PI gains"
        - "Sensitive to accelerometer bias"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"
      
    madgwick_filter:
      method_id: "madgwick_filter"
      category: "sensor_fusion"
      display_name: "Madgwick AHRS Filter"
      implementation_ref: "robot_lab_algorithms.madgwick_filter"
      mathematical_foundation: "Gradient descent optimization on SO(3) for attitude estimation"
      equations:
        - "Objective function: J = lambda_0 * e_0^2 + lambda_1 * e_1^2 + lambda_2 * e_2^2 + lambda_3 * e_3^2"
        - "Error terms: e_i = a_measured × v_estimated - a_reference × v_estimated for i=0..3"
        - "Jacobian: J_q = -2 * [lambda_0*e_0, lambda_1*e_1, lambda_2*e_2, lambda_3*e_3]"
        - "Quaternion update: q_dot = 0.5 * q ⊗ ω_gyro - mu * J_q"
        - "Discrete update: q_{k+1} = q_k + q_dot * dt"
      source_references:
        - "Madgwick et al. - An efficient orientation filter for inertial and inertial/magnetic sensor arrays"
        - "Madgwick - An efficient orientation filter for inertial/magnetic sensor arrays"
      applicable_robots: ["bumperbot", "labbot", "go2", "berkeley_humanoid_lite"]
      input_strata:
        - "sensor_fusion_attitude_only"
      output_types: ["Imu", "Pose"]
      parameters:
        beta: 0.1
        zeta: 0.0
        sample_rate_hz: 100.0
      assumptions:
        - "Reference vector is known"
        - "Small rotation rates"
        - "Gradient descent converges"
      limitations:
        - "Requires parameter tuning"
        - "Sensitive to initial conditions"
        - "May not converge for large errors"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"
      
    wheel_imu_fusion:
      method_id: "wheel_imu_fusion"
      category: "sensor_fusion"
      display_name: "Wheel Odometry and IMU Fusion"
      implementation_ref: "robot_lab_algorithms.wheel_imu_fusion"
      mathematical_foundation: "Extended Kalman Filter for fusing wheel encoder and IMU data"
      equations:
        - "State: x = [x, y, z, vx, vy, vz, roll, pitch, yaw]^T"
        - "Wheel odometry model: v_left, v_right -> linear velocity and angular velocity"
        - "IMU model: f = [vx, vy, vz, 0, 0, 0, ωx, ωy, ωz]^T"
        - "Measurement model: h_wheel = [v_left, v_right], h_imu = [ax, ay, az, ωx, ωy, ωz]"
      source_references:
        - "Groves - Principles of GNSS, Inertial, and Multisensor Integrated Navigation Systems"
        - "Shin - Estimation Techniques for Navigation Systems"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "sensor_fusion_pose"
      output_types: ["Odometry", "Imu"]
      parameters:
        wheelbase: 0.256
        wheel_radius: 0.0315
        imu_noise_std: [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]
        wheel_noise_std: [0.05, 0.05]
      assumptions:
        - "Wheel encoder and IMU are time-synchronized"
        - "No wheel slippage"
        - "IMU has good calibration"
      limitations:
        - "Sensitive to wheel encoder errors"
        - "IMU drift over time"
        - "Requires initial alignment"
      computational_complexity: "O(n^3)"
      memory_requirements: "Medium"
      
    gps_odom_fusion:
      method_id: "gps_odom_fusion"
      category: "sensor_fusion"
      display_name: "GPS and Odometry Fusion"
      implementation_ref: "robot_lab_algorithms.gps_odom_fusion"
      mathematical_foundation: "Kalman Filter for fusing GPS position with wheel odometry velocity"
      equations:
        - "State: x = [x, y, z, vx, vy, vz]^T"
        - "Prediction model: x_{k|k-1} = F x_{k-1|k-1} + B u_k"
        - "GPS measurement: z_gps = [lat, lon, alt] + noise"
        - "Odometry measurement: z_odom = [vx, vy, ω]^T + noise"
        - "Fusion: Combine position and velocity measurements with appropriate noise models"
      source_references:
        - "Groves - Principles of GNSS, Inertial, and Multisensor Integrated Navigation Systems"
        - "Maybeck - Stochastic Models, Estimation and Control"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "sensor_fusion_pose"
        - "sensor_fusion_multi_sensor"
      output_types: ["Odometry", "NavSatFix"]
      parameters:
        gps_noise_std: [2.0, 2.0, 5.0]  # meters
        odometry_noise_std: [0.05, 0.05, 0.01]  # m/s, m/s, rad/s
        fusion_rate_hz: 10.0
      assumptions:
        - "GPS provides absolute position"
        - "Odometry provides relative velocity"
        - "Synchronized measurements"
      limitations:
        - "GPS signal may be unavailable"
        - "GPS accuracy varies"
        - "Requires coordinate transformations"
      computational_complexity: "O(n^3)"
      memory_requirements: "Medium"
      
    wheel_imu_gnss_ukf:
      method_id: "wheel_imu_gnss_ukf"
      category: "sensor_fusion"
      display_name: "Wheel/IMU/GNSS Unscented Kalman Filter Fusion"
      implementation_ref: "robot_lab_algorithms.wheel_imu_gnss_ukf"
      mathematical_foundation: "Unscented Kalman Filter for multi-sensor fusion"
      equations:
        - "State: x = [x, y, z, vx, vy, vz, roll, pitch, yaw, bg_x, bg_y, bg_z, ba_x, ba_y, ba_z]^T"
        - "Wheel model: v = R * ω where ω is wheel angular velocity"
        - "IMU model: f = [vx, vy, vz, ax, ay, az, ωx, ωy, ωz, 0, 0, 0, 0, 0, 0]^T"
        - "GNSS model: h_gps = [x, y, z] + noise"
        - "UKF update: Use unscented transform for nonlinear updates"
      source_references:
        - "Julier and Uhlmann - Unscented Filtering and Nonlinear Estimation"
        - "Groves - Principles of GNSS, Inertial, and Multisensor Integrated Navigation Systems"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "sensor_fusion_pose"
        - "sensor_fusion_multi_sensor"
      output_types: ["Odometry", "Imu", "NavSatFix"]
      parameters:
        alpha: 0.1
        beta: 2.0
        kappa: 1.0
        process_noise_std: [0.1, 0.1, 0.1, 0.05, 0.05, 0.05, 0.01, 0.01, 0.01]
        measurement_noise_std: [0.5, 0.5, 1.0, 0.01, 0.01, 0.01, 0.001, 0.001, 0.001]
      assumptions:
        - "Multiple sensors are time-synchronized"
        - "GNSS provides position updates"
        - "IMU provides high-frequency motion data"
        - "Wheel encoders provide velocity information"
      limitations:
        - "Computationally expensive"
        - "Requires careful parameter tuning"
        - "Sensitive to sensor failures"
        - "High dimensional state space"
      computational_complexity: "O(n^3)"
      memory_requirements: "High"

  # =============================================================================
  # R7.6 GLOBAL PLANNING METHODS
  # =============================================================================
  
  global_planning:
    dijkstra_planner:
      method_id: "dijkstra_planner"
      category: "global_planning"
      display_name: "Dijkstra's Algorithm Planner"
      implementation_ref: "robot_lab_algorithms.dijkstra_planner"
      mathematical_foundation: "Graph-based shortest path in weighted graph using Dijkstra's algorithm"
      equations:
        - "Total cost: C = sum(cost(cell_i)) for cells in path"
        - "Greedy selection: node = argmin(cost_to_come[node]) among frontier"
        - "Cost update: cost_to_come[neighbor] = min(cost_to_come[current] + edge_cost)"
        - "Termination: when goal node has minimum cost in frontier"
      source_references:
        - "Dijkstra - A note on two problems in connexion with graphs"
        - "CLRS - Introduction to Algorithms"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "planning_2d_grid"
      output_types: ["Path", "NavPath"]
      parameters:
        resolution: 0.05
        cost_weights: [1.0, 1.0, 0.1]  # [obstacle, inflation, unknown]
        max_planning_time: 5.0
      assumptions:
        - "2D occupancy grid map"
        - "Non-negative edge costs"
        - "Discrete grid-based planning"
        - "Graph-based algorithm family"
      limitations:
        - "Only works on grid maps"
        - "Computationally expensive for large maps"
        - "Does not consider dynamic obstacles"
        - "Produces angular paths"
      computational_complexity: "O(E + V log V) where E=edges, V=vertices"
      memory_requirements: "High"
      
    a_star_planner:
      method_id: "a_star_planner"
      category: "global_planning"
      display_name: "A* Search Planner"
      implementation_ref: "robot_lab_algorithms.a_star_planner"
      mathematical_foundation: "Graph-based optimal path finding using A* search with heuristic on grid graphs"
      equations:
        - "f(n) = g(n) + h(n) where g(n) = cost from start, h(n) = heuristic to goal"
        - "g(n) = g(parent) + cost(parent, n)"
        - "Euclidean heuristic: h(n) = distance(n, goal)"
        - "Manhattan heuristic: h(n) = |x_n - x_goal| + |y_n - y_goal| for 4-connected grid"
      source_references:
        - "Hart, Nilsson, Raphael - A Formal Basis for the Heuristic Determination of Minimum Cost Paths"
        - "Russell and Norvig - Artificial Intelligence: A Modern Approach"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "planning_2d_grid"
      output_types: ["Path", "NavPath"]
      parameters:
        resolution: 0.05
        heuristic_weight: 1.0
        allow_unknown: false
        cost_weights: [1.0, 1.0, 0.1]
      assumptions:
        - "Admissible heuristic (never overestimates)"
        - "2D occupancy grid map"
        - "Discrete grid-based planning"
        - "Graph-based algorithm family"
      limitations:
        - "Only works on grid maps"
        - "Heuristic must be admissible for optimality"
        - "Memory intensive for large maps"
        - "Does not consider dynamic obstacles"
      computational_complexity: "O(E + V log V)"
      memory_requirements: "High"
      
    rrt_planner:
      method_id: "rrt_planner"
      category: "global_planning"
      display_name: "Rapidly-exploring Random Tree Planner"
      implementation_ref: "robot_lab_algorithms.rrt_planner"
      mathematical_foundation: "Sampling-based planning using rapidly-exploring random trees"
      equations:
        - "Tree extension: x_new = steer(x_near, x_rand)"
        - "Distance metric: d(x1, x2) = Euclidean distance in configuration space"
        - "Nearest neighbor: x_near = argmin(d(x_rand, x) for x in tree)"
        - "Collision checking: is_collision_free(x_near, x_new)"
      source_references:
        - "LaValle - Rapidly-exploring Random Trees: A New Tool for Path Planning"
        - "LaValle - Planning Algorithms"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "planning_2d_continuous"
      output_types: ["Path", "NavPath"]
      parameters:
        max_iterations: 10000
        step_size: 0.1
        goal_bias: 0.05
        collision_check_resolution: 0.01
      assumptions:
        - "Continuous 2D planning space"
        - "Valid collision checking function"
        - "Probabilistic completeness"
      limitations:
        - "Not optimal - finds feasible, not shortest path"
        - "Computationally expensive for high-dimensional spaces"
        - "Sensitive to step size parameter"
        - "May fail in narrow passages"
      computational_complexity: "O(n log n) per iteration where n=tree size"
      memory_requirements: "Medium"
      
    rrt_star_planner:
      method_id: "rrt_star_planner"
      category: "global_planning"
      display_name: "RRT* Planner (Asymptotically Optimal)"
      implementation_ref: "robot_lab_algorithms.rrt_star_planner"
      mathematical_foundation: "Asymptotically optimal sampling-based planner extending RRT"
      equations:
        - "Cost function: c(x) = cost from start to x"
        - "Rewiring: if cost(x_near) + d(x_near, x_new) < cost(x_neighbor)"
        - "Radius reduction: radius = radius * (1 - 1/log(iteration))"
        - "Asymptotic optimality: lim_{n->∞} cost(solution) = cost(optimal)"
      source_references:
        - "Karaman and Frazzoli - Sampling-based Algorithms for Optimal Motion Planning"
        - "LaValle - Planning Algorithms"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "planning_2d_continuous"
      output_types: ["Path", "NavPath"]
      parameters:
        max_iterations: 5000
        step_size: 0.1
        rewiring_radius: 0.5
        goal_bias: 0.05
      assumptions:
        - "Continuous 2D planning space"
        - "Asymptotic optimality requires sufficient iterations"
        - "Cost function is additive"
      limitations:
        - "Slow convergence to optimal solution"
        - "Computationally expensive"
        - "Sensitive to parameter tuning"
        - "Memory intensive for large trees"
      computational_complexity: "O(n log n) per iteration"
      memory_requirements: "High"
      
    prm_planner:
      method_id: "prm_planner"
      category: "global_planning"
      display_name: "Probabilistic Roadmap Planner"
      implementation_ref: "robot_lab_algorithms.prm_planner"
      mathematical_foundation: "Roadmap-based planner using probabilistic sampling"
      equations:
        - "Sampling: x_i ~ uniform(free_configuration_space)"
        - "Connection: edge exists if collision_free(x_i, x_j)"
        - "Roadmap construction: G = (V, E) where V = samples, E = valid connections"
        - "Query: find shortest path in G from start to goal"
      source_references:
        - "Overmars - Motion Planning in STL"
        - "LaValle - Planning Algorithms"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "planning_2d_continuous"
      output_types: ["Path", "NavPath"]
      parameters:
        num_samples: 1000
        k_nearest_neighbors: 10
        collision_check_resolution: 0.01
      assumptions:
        - "Multiple queries on same environment"
        - "Roadmap precomputation is amortized over multiple queries"
        - "Valid collision checking function"
      limitations:
        - "Precomputation time can be long"
        - "May miss narrow passages"
        - "Memory intensive for storing roadmap"
        - "Resolution-dependent quality"
      computational_complexity: "O(n^2) for roadmap construction, O(n log n) for queries"
      memory_requirements: "High"

  # =============================================================================
  # R7.7 LOCAL PLANNING METHODS
  # =============================================================================
  
  local_planning:
    follow_the_gap:
      method_id: "follow_the_gap"
      category: "local_planning"
      display_name: "Follow the Gap Local Planner"
      implementation_ref: "robot_lab_algorithms.follow_the_gap"
      mathematical_foundation: "Reactive planner that follows the largest gap in sensor data using pure reactive behavior"
      equations:
        - "Gap detection: find largest angular gap in laser scan"
        - "Gap size: θ_gap = θ_right - θ_left for gap between θ_left and θ_right"
        - "Target selection: gap with maximum θ_gap where θ_gap > robot_width"
        - "Target heading: θ_target = θ_left + θ_gap/2"
        - "Curvature: κ = 2 * sin(Δθ) / distance_to_gap"
      source_references:
        - "Borenstein and Koren - The Vector Field Histogram"
        - "Urban rover navigation methods"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_sparse"
        - "perception_lidar_2d_dense"
      output_types: ["Twist", "geometry_msgs/Twist"]
      parameters:
        robot_width: 0.2
        min_gap_size: 0.3
        max_angular_velocity: 0.5
        target_distance: 1.0
      assumptions:
        - "2D LiDAR scan available"
        - "Robot can be approximated as circle"
        - "Gaps correspond to navigable space"
        - "Purely reactive behavior - no path planning"
      limitations:
        - "Only considers immediate obstacles"
        - "Can get stuck in local minima"
        - "Does not plan for future obstacles"
        - "Requires gap larger than robot"
        - "No memory of past navigation - purely reactive"
      computational_complexity: "O(n) where n=number of scan points"
      memory_requirements: "Low"
      
    dwb_local_planner:
      method_id: "dwb_local_planner"
      category: "local_planning"
      display_name: "Dynamic Window Approach Local Planner"
      implementation_ref: "robot_lab_algorithms.dwb_local_planner"
      mathematical_foundation: "Reactive trajectory-based planner that evaluates multiple trajectories in velocity space with obstacle avoidance"
      equations:
        - "Trajectory generation: x(t) = x_0 + integral_0^t [v cos(θ), v sin(θ)] dt"
        - "Dynamic window: v ∈ [v_min, v_max], ω ∈ [ω_min, ω_max]"
        - "Cost function: J = α*heading_cost + β*obstacle_cost + γ*velocity_cost"
        - "Obstacle cost: sum over trajectory of distance_to_obstacles"
        - "Optimal control: u* = argmin_J u ∈ U"
      source_references:
        - "Fox et al. - The Dynamic Window Approach to Collision Avoidance"
        - "ROS DWB Local Planner documentation"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_dense"
      output_types: ["Twist", "geometry_msgs/Twist"]
      parameters:
        max_vel_x: 0.5
        min_vel_x: -0.1
        max_vel_theta: 0.5
        min_vel_theta: -0.5
        acc_lim_x: 0.2
        acc_lim_theta: 0.3
        cost_weights: [1.0, 1.0, 0.1]
      assumptions:
        - "Constant acceleration over prediction horizon"
        - "Circular robot footprint"
        - "2D laser scan available"
        - "Reactive obstacle avoidance with short prediction horizon"
      limitations:
        - "Computationally intensive for many trajectories"
        - "Sensitive to cost function weights"
        - "Assumes constant acceleration"
        - "May oscillate in cluttered environments"
        - "Short prediction horizon makes it primarily reactive"
      computational_complexity: "O(k*m*n) where k=trajectories, m=points per trajectory, n=scan points"
      memory_requirements: "Medium"
      
    regulated_pure_pursuit:
      method_id: "regulated_pure_pursuit"
      category: "local_planning"
      display_name: "Regulated Pure Pursuit Planner"
      implementation_ref: "robot_lab_algorithms.regulated_pure_pursuit"
      mathematical_foundation: "Path-following controller using pure pursuit with speed regulation"
      equations:
        - "Lookahead distance: L = min(max_lookahead, max(robot_length, curvature * v^2 / a_max))"
        - "Goal point selection: find point on path at distance L from robot"
        - "Curvature: κ = 2 * |y_goal| / L^2 for lateral offset y_goal"
        - "Angular velocity: ω = v * κ * sign(y_goal)"
        - "Speed regulation: v = min(v_max, sqrt(a_max * L / |κ|))"
      source_references:
        - "Coulter - Implementation of the Pure Pursuit Path Tracking Algorithm"
        - "Amoir and Park - Tracking control of nonholonomic mobile robots"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "planning_2d_continuous"
      output_types: ["Twist", "geometry_msgs/Twist"]
      parameters:
        lookahead_distance: 0.5
        max_lookahead_distance: 2.0
        max_angular_velocity: 0.5
        max_linear_velocity: 0.5
        curvature_gain: 1.0
      assumptions:
        - "Smooth global path available"
        - "Robot can be approximated as point mass"
        - "Nonholonomic constraints"
      limitations:
        - "Requires smooth path to follow"
        - "May cut corners if lookahead too large"
        - "Can oscillate if lookahead too small"
        - "Does not consider obstacles"
      computational_complexity: "O(n) where n=path points"
      memory_requirements: "Low"
      
    teb_local_planner:
      method_id: "teb_local_planner"
      category: "local_planning"
      display_name: "Timed Elastic Band Local Planner"
      implementation_ref: "robot_lab_algorithms.teb_local_planner"
      mathematical_foundation: "Trajectory optimization considering time, kinematics, and obstacles"
      equations:
        - "Elastic band: path represented as sequence of pose-time pairs"
        - "Cost function: J = w_time*time_cost + w_dist*distance_cost + w_kin*kinematic_cost + w_obs*obstacle_cost"
        - "Time optimization: minimize total time subject to constraints"
        - "Kinematic constraints: v <= v_max, ω <= ω_max, |a| <= a_max"
        - "Obstacle avoidance: distance_from_obstacles >= safety_margin"
      source_references:
        - "Zucker et al. - A New Approach to Trajectory Generation for Mobile Robots"
        - "ROS TEB Local Planner documentation"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_dense"
      output_types: ["Twist", "Trajectory"]
      parameters:
        max_vel_x: 0.5
        max_vel_theta: 0.5
        acc_lim_x: 0.2
        acc_lim_theta: 0.3
        min_obstacle_dist: 0.1
        weight_time: 1.0
        weight_kinematics: 1.0
        weight_obstacles: 1.0
      assumptions:
        - "Holonomic or differential drive robot"
        - "2D laser scan available"
        - "Smooth cost landscape"
      limitations:
        - "Computationally intensive"
        - "Sensitive to parameter tuning"
        - "May get stuck in local minima"
        - "Assumes known obstacle positions"
      computational_complexity: "O(n*m) where n=poses, m=iterations"
      memory_requirements: "High"
      
    mppi_local_planner:
      method_id: "mppi_local_planner"
      category: "local_planning"
      display_name: "Model Predictive Path Integral Local Planner"
      implementation_ref: "robot_lab_algorithms.mppi_local_planner"
      mathematical_foundation: "Stochastic trajectory optimization using sampling-based MPPI"
      equations:
        - "State propagation: x_k = f(x_{k-1}, u_{k-1}, dt) + noise"
        - "Cost calculation: S(u) = sum_{k=0}^N Q_k(x_k, u_k) for trajectory u"
        - "Sampling: u^i ~ p(u) for i = 1..S"
        - "Weighting: w^i = exp(-γ * S(u^i)) where γ = temperature parameter"
        - "Control update: u* = sum_i w^i u^i / sum_i w^i"
      source_references:
        - "Theodore et al. - Model Predictive Path Integral Control"
        - "Williams et al. - Information-Theoretic Model Predictive Control"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "perception_lidar_2d_dense"
      output_types: ["Twist", "Trajectory"]
      parameters:
        num_samples: 100
        time_horizon: 2.0
        time_step: 0.1
        temperature: 0.1
        cost_weights: [1.0, 1.0, 0.1]
        noise_covariance: [0.01, 0.01, 0.001]
      assumptions:
        - "Smooth cost function"
        - "Gaussian noise model"
        - "Convex feasible space"
      limitations:
        - "Computationally intensive"
        - "Sensitive to sample count"
        - "Requires careful parameter tuning"
        - "Assumes differentiable cost function"
      computational_complexity: "O(S*N*m) where S=samples, N=horizon, m=state dimension"
      memory_requirements: "Very High"

  # =============================================================================
  # R7.8 CONTROL METHODS
  # =============================================================================
  
  control:
    pid_controller:
      method_id: "pid_controller"
      category: "control"
      display_name: "PID Controller"
      implementation_ref: "robot_lab_algorithms.pid_controller"
      mathematical_foundation: "Proportional-Integral-Derivative control with anti-windup"
      equations:
        - "Proportional term: u_p = K_p * e(t) where e(t) = reference - measurement"
        - "Integral term: u_i = K_i * integral_0^t e(τ) dτ"
        - "Derivative term: u_d = K_d * de(t)/dt"
        - "Total control: u(t) = u_p + u_i + u_d"
        - "Anti-windup: if |u(t)| > u_max, then ∫e(τ)dτ = constant"
        - "Bumpless transfer: smooth switching between modes"
      source_references:
        - "Åström and Hägglund - PID Controllers: Theory, Design, and Tuning"
        - "Dorf and Bishop - Modern Control Systems"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_linear_plant"
        - "control_constrained"
      output_types: ["Twist", "ControlEffort"]
      parameters:
        k_p: [1.0, 1.0]  # [linear, angular]
        k_i: [0.1, 0.1]
        k_d: [0.01, 0.01]
        integral_windup_limit: 10.0
        max_output: [0.5, 0.5]
        min_output: [-0.5, -0.5]
      assumptions:
        - "Linear or approximately linear plant"
        - "Reference is achievable"
        - "System is observable and controllable"
      limitations:
        - "Requires tuning for each plant"
        - "May have steady-state error"
        - "Sensitive to noise in derivative term"
        - "Can be unstable if poorly tuned"
      computational_complexity: "O(1)"
      memory_requirements: "Minimal"
      
    lqr_controller:
      method_id: "lqr_controller"
      category: "control"
      display_name: "Linear Quadratic Regulator"
      implementation_ref: "robot_lab_algorithms.lqr_controller"
      mathematical_foundation: "Optimal state feedback controller minimizing quadratic cost"
      equations:
        - "Cost function: J = integral_0^∞ [x^T Q x + u^T R u] dt"
        - "Algebraic Riccati equation: A^T P + P A - P B R^-1 B^T P + Q = 0"
        - "Optimal feedback: u = -K x where K = R^-1 B^T P"
        - "Closed-loop system: x_dot = (A - B K) x"
        - "Stability: A - B K has all eigenvalues in LHP"
      source_references:
        - "Bryson and Ho - Applied Optimal Control"
        - "Dorf and Bishop - Modern Control Systems"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_linear_plant"
        - "control_constrained"
      output_types: ["Twist", "ControlEffort"]
      parameters:
        q_matrix: [[1.0, 0.0], [0.0, 1.0]]  # state cost weights
        r_matrix: [[1.0, 0.0], [0.0, 1.0]]  # control cost weights
        a_matrix: [[0.0, 1.0], [0.0, 0.0]]  # system matrix
        b_matrix: [[0.0], [1.0]]          # input matrix
      assumptions:
        - "Linear time-invariant system"
        - "Controllable and observable system"
        - "Quadratic cost function captures objectives"
        - "No constraints on control effort"
      limitations:
        - "Only works for linear systems"
        - "Requires exact model knowledge"
        - "Does not handle constraints"
        - "Computationally intensive to solve Riccati equation"
      computational_complexity: "O(n^3) for Riccati solution where n=state dimension"
      memory_requirements: "Medium"
      
    mpc_controller:
      method_id: "mpc_controller"
      category: "control"
      display_name: "Model Predictive Control"
      implementation_ref: "robot_lab_algorithms.mpc_controller"
      mathematical_foundation: "Receding horizon optimization with system model and constraints"
      equations:
        - "Cost function: J = sum_{k=0}^{N-1} [x_k^T Q x_k + u_k^T R u_k] + x_N^T Q_N x_N"
        - "System model: x_{k+1} = A x_k + B u_k"
        - "State constraints: x_min <= x_k <= x_max"
        - "Control constraints: u_min <= u_k <= u_max"
        - "Optimization: u_0*, u_1*, ..., u_{N-1}* = argmin_J u"
        - "Receding horizon: apply u_0*, then solve again at next time step"
      source_references:
        - "Camacho and Bordons - Model Predictive Control"
        - "Rawlings and Mayne - Model Predictive Control: Theory and Design"
      applicable_robots: ["bumperbot", "labbot"]
      input_strata:
        - "control_linear_plant"
        - "control_constrained"
      output_types: ["Twist", "ControlEffort"]
      parameters:
        prediction_horizon: 10
        control_horizon: 5
        q_matrix: [[1.0, 0.0], [0.0, 1.0]]
        r_matrix: [[0.1, 0.0], [0.0, 0.1]]
        state_constraints: [[-1.0, -1.0], [1.0, 1.0]]
        control_constraints: [[-0.5, -0.5], [0.5, 0.5]]
      assumptions:
        - "Linear system model"
        - "Convex cost function and constraints"
        - "Future references known or estimable"
      limitations:
        - "Computationally intensive"
        - "Requires exact model knowledge"
        - "Sensitive to horizon parameters"
        - "Performance depends on constraint formulation"
      computational_complexity: "O(n^3) per time step where n=decision variables"
      memory_requirements: "High"
      
    nonlinear_mpc:
      method_id: "nonlinear_mpc"
      category: "control"
      display_name: "Nonlinear Model Predictive Control"
      implementation_ref: "robot_lab_algorithms.nonlinear_mpc"
      mathematical_foundation: "MPC for nonlinear systems using sequential quadratic programming"
      equations:
        - "Nonlinear model: x_{k+1} = f(x_k, u_k)"
        - "Cost function: J = sum_{k=0}^{N-1} [l(x_k, u_k)] + l_N(x_N)"
        - "Discretization: Euler or Runge-Kutta integration"
        - "Linearization: f(x,u) ≈ f(x_0,u_0) + ∂f/∂x Δx + ∂f/∂u Δu"
        - "QP subproblem: solve linearized problem at each iteration"
        - "SQP iteration: x_{i+1} = x_i + Δx, u_{i+1} = u_i + Δu"
      source_references:
        - "Nocedal and Wright - Numerical Optimization"
        - "Diehl et al. - Real-time optimization and nonlinear model predictive control"
      applicable_robots: ["bumperbot", "labbot", "go2"]
      input_strata:
        - "control_nonlinear_plant"
        - "control_constrained"
      output_types: ["Twist", "ControlEffort"]
      parameters:
        prediction_horizon: 5
        control_horizon: 3
        max_iterations: 20
        tolerance: 1e-6
        discretization: "euler"
      assumptions:
        - "Smooth nonlinear dynamics"
        - "Twice differentiable cost function"
        - "Convex feasible region"
        - "Good initial guess"
      limitations:
        - "Computationally very intensive"
        - "Sensitive to initial conditions"
        - "May converge to local minima"
        - "Requires careful parameter tuning"
      computational_complexity: "O(iterations * n^3) per time step"
      memory_requirements: "Very High"
      
    feedback_linearization:
      method_id: "feedback_linearization"
      category: "control"
      display_name: "Feedback Linearization Controller"
      implementation_ref: "robot_lab_algorithms.feedback_linearization"
      mathematical_foundation: "Nonlinear control design that cancels nonlinearities and linearizes the system"
      equations:
        - "System: x_dot = f(x) + g(x) u"
        - "Lie derivative: L_f h = ∂h/∂x f(x)"
        - "Relative degree: r = min{k: L_g L_f^{k-1} h ≠ 0}"
        - "Feedback linearization: u = (L_g L_f^{r-1} h)^-1 [v - L_f^r h]"
        - "Linearized system: y^{(r)} = v (exact linearization)"
        - "Control design: v = -K [y, y_dot, ..., y^{(r-1)}]^T"
      source_references:
        - "Khalil - Nonlinear Systems"
        - "Isidori - Nonlinear Control Systems"
      applicable_robots: ["bumperbot", "labbot", "go2", "berkeley_humanoid_lite"]
      input_strata:
        - "control_nonlinear_plant"
        - "control_constrained"
      output_types: ["Twist", "ControlEffort"]
      parameters:
        desired_dynamics: [1.0, 1.0]  # natural frequency and damping
        max_control_effort: 10.0
        min_control_effort: -10.0
      assumptions:
        - "System has well-defined relative degree"
        - "L_g L_f^{r-1} h ≠ 0 in operating region"
        - "Exact model cancellation is possible"
      limitations:
        - "Requires exact model knowledge"
        - "Sensitive to model errors"
        - "May require high control effort"
        - "Can be unstable if model is inaccurate"
        - "Difficult to implement for high-order systems"
      computational_complexity: "O(n) where n=system order"
      memory_requirements: "Medium"
      
    backstepping_controller:
      method_id: "backstepping_controller"
      category: "control"
      display_name: "Backstepping Controller"
      implementation_ref: "robot_lab_algorithms.backstepping_controller"
      mathematical_foundation: "Recursive Lyapunov-based control design for nonlinear systems in strict-feedback form"
      equations:
        - "System: x_1_dot = f_1(x_1) + g_1(x_1) x_2"
        - "        x_2_dot = f_2(x_1,x_2) + g_2(x_1,x_2) x_3"
        - "        ..."
        - "        x_n_dot = f_n(x_1,...,x_n) + g_n(x_1,...,x_n) u"
        - "Virtual control: α_1 = -c_1 x_1 + desired_reference"
        - "Error: z_1 = x_1 - reference, z_2 = x_2 - α_1, ..."
        - "Stabilizing function: α_i = -c_i z_i - z_{i-1} + ..."
        - "Control: u = -c_n z_n - z_{n-1} + ..."
        - "Lyapunov function: V = sum_{i=1}^n (1/2) z_i^2"
      source_references:
        - "Khalil - Nonlinear Systems"
        - "Krstic et al. - Nonlinear and Adaptive Control Design"
      applicable_robots: ["bumperbot", "labbot", "go2", "berkeley_humanoid_lite"]
      input_strata:
        - "control_nonlinear_plant"
        - "control_constrained"
      output_types: ["Twist", "ControlEffort"]
      parameters:
        control_gains: [1.0, 1.0, 1.0]  # c_1, c_2, c_3...
        adaptation_gains: [0.1, 0.1, 0.1]
      assumptions:
        - "System in strict-feedback form"
        - "Functions f_i, g_i are known and bounded"
        - "g_i(x) ≠ 0 in operating region"
      limitations:
        - "Requires system to be in strict-feedback form"
        - "Can be complex for high-order systems"
        - "Requires exact model knowledge"
        - "Sensitive to model errors"
        - "May require adaptation for robustness"
      computational_complexity: "O(n) where n=system order"
      memory_requirements: "Medium"