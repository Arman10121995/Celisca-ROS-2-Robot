# Robot Lab Registry - Algorithm Catalog
# Version 0.1.0
# All algorithms in a single file for simplicity

# ============================================================================
# PERCEPTION ALGORITHMS
# ============================================================================

# Perception - Laser-based
- id: laser_scan_to_pointcloud
  version: "1.0.0"
  name: "Laser Scan to PointCloud"
  description: "Converts 2D laser scan to 3D point cloud for perception"
  status: integrated
  category: perception
  family: pointcloud_conversion
  implementation:
    package: pointcloud_to_laserscan
    executable: pointcloud_to_laserscan_node
    language: cpp
  input_contract:
    required_topics:
      - /scan
    required_parameters: []
  output_contract:
    provided_topics:
      - /cloud
  required_capabilities: []
  supported_robot_classes:
    - mobile
    - legged
    - humanoid
    - aerial
  parameters:
    min_height: -0.1
    max_height: 0.1
    range_min: 0.1
    range_max: 100.0
  source:
    repository: "https://github.com/ros-perception/pointcloud_to_laserscan"
    license: "BSD-3-Clause"
  tags:
    - conversion
    - laser
    - pointcloud
  created: "2026-08-31"
  updated: "2026-08-31"

- id: costmap_2d_observation
  version: "1.0.0"
  name: "2D Costmap Observation"
  description: "Creates observation layers for 2D costmaps from sensor data"
  status: integrated
  category: perception
  family: costmap
  implementation:
    package: nav2_costmap_2d
    plugin: nav2_costmap_2d::ObservationLayer
    language: cpp
  input_contract:
    required_topics:
      - /scan
      - /odom
    required_parameters:
      - observation_sources
  output_contract:
    provided_topics: []
  required_capabilities: []
  supported_robot_classes:
    - mobile
    - legged
  parameters:
    observation_sources: "scan"
    scan:
      topic: /scan
      sensor_frame: base_laser
      marking: true
      clearing: true
  source:
    repository: "https://github.com/ros-planning/navigation2"
    license: "Apache-2.0"
  tags:
    - navigation
    - costmap
    - obstacle

