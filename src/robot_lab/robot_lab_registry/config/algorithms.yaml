- id: depth_image_to_pointcloud
  version: 2.0.0
  name: Depth Image to PointCloud
  description: "Pinhole back-projection of a depth image (32FC1 metres or 16UC1 millimetres) with its camera info to a PointCloud2 in the camera's optical frame: the model of depth_image_proc's point_cloud_xyz, which is not installed in this workspace"
  status: integrated
  category: perception
  family: pointcloud_conversion
  implementation:
    package: robot_lab_algorithms
    executable: depth_image_to_pointcloud
    module: robot_lab_algorithms.perception
    language: python
  input_contract:
    required_topics:
    - /oakd/depth/image_raw
    - /oakd/rgb/camera_info
  output_contract:
    provided_topics:
    - /perception/depth_points
  required_capabilities: []
  supported_robot_classes:
  - mobile
  - legged
  - humanoid
  - aerial
  parameters:
    stride: 2
    min_range: 0.05
    max_range: 10.0
  source:
    repository: internal
    license: Apache-2.0
    reference: "depth_image_proc point_cloud_xyz (https://github.com/ros-perception/image_pipeline), the same pinhole model"
  tags:
  - depth
  - vision
  - pointcloud
  - r7_2
  created: '2026-08-31'
  updated: '2026-10-15'
  evidence:
    - kind: unit_test
      reference: "test_r7_perception_algorithms.py::TestDepthToPoints"
      description: "Implemented, experimental: back-projection, invalid depths, stride and depth encodings"
      date: "2026-10-15"
    - kind: benchmark
      reference: "docs/status/evidence/r72-perception-benchmark-2026-10-13/depth-node/README.md"
      description: "Live beside a 26 m drive in Gazebo, MuJoCo, PyBullet and Isaac: 3.3-6.6 ms per cloud; ground removal and clustering on its cloud score as on Gazebo's own; identical to Gazebo's cloud with the pixel-centre principal point"
      date: "2026-10-15"
- id: camera_calibration
  version: 2.0.0
  name: Camera Calibration (chessboard)
  description: "Zhang's planar chessboard calibration with OpenCV: finds the board's inner corners in each frame, keeps views that differ in position, size or tilt, and solves the camera matrix and plumb_bob distortion; publishes the calibrated CameraInfo and writes a ROS camera-info YAML. The method of ROS's cameracalibrator.py, which is not installed here"
  status: integrated
  category: perception
  family: calibration
  implementation:
    package: robot_lab_algorithms
    executable: camera_calibration
    module: robot_lab_algorithms.camera_calibration
    language: python
  input_contract:
    required_topics:
    - /oakd/rgb/image_raw
    - /oakd/rgb/camera_info
    required_parameters:
    - pattern
    - square
  output_contract:
    provided_topics:
    - /perception/calibrated_camera_info
  required_capabilities: []
  supported_robot_classes:
  - mobile
  - legged
  - humanoid
  - aerial
  parameters:
    pattern: 8x6
    square: 0.05
    min_views: 15
    max_views: 40
  source:
    repository: internal
    license: Apache-2.0
    reference: "Zhang, A flexible new technique for camera calibration (TPAMI 2000); ROS camera_calibration (https://github.com/ros-perception/image_pipeline)"
  tags:
  - calibration
  - vision
  - r7_2
  created: '2026-08-31'
  updated: '2026-10-15'
  evidence:
    - kind: unit_test
      reference: "test_r7_camera_calibration.py"
      description: "Implemented, experimental: recovers fx within 0.2% and the half-pixel principal point (cx 159.48 for 159.50) from 27 ray-cast board views"
      date: "2026-10-15"
    - kind: benchmark
      reference: "docs/status/evidence/r72-perception-benchmark-2026-10-13/calibration/README.md"
      description: "Gazebo: a spawned chessboard moved through 100 poses; 73 views give the principal point (159.37, 119.53), within 0.13 px of the pixel centres, and fx 0.7% short (the check's own error); the dispatched node calibrated from 15 views"
      date: "2026-10-15"
- id: feature_detection
  version: 2.0.0
  name: Feature Detection (RGB-D visual odometry)
  description: "Feature-based RGB-D visual odometry: ORB (default), AKAZE, BRISK, SIFT or Shi-Tomasi corners with ORB descriptors, matched to a keyframe, lifted with depth and solved by PnP in RANSAC; publishes the base pose on /perception/visual_odometry. Replaces the cataloged ORB-SLAM3 entry, whose build here carries an OpenCV ABI mismatch"
  status: integrated
  category: perception
  family: feature_detection
  implementation:
    package: robot_lab_algorithms
    executable: feature_detection
    module: robot_lab_algorithms.visual_odometry
    language: python
  input_contract:
    required_topics:
    - /oakd/rgb/image_raw
    - /oakd/depth/image_raw
    - /oakd/rgb/camera_info
    - /tf_static
  output_contract:
    provided_topics:
    - /perception/visual_odometry
    - /perception/features
  required_capabilities: []
  supported_robot_classes:
  - mobile
  - legged
  - humanoid
  - aerial
  parameters:
    detector: orb
    max_features: 1000
  source:
    repository: internal
    license: Apache-2.0
    reference: "Rublee et al., ORB (ICCV 2011); Alcantarilla et al., AKAZE (BMVC 2013); Leutenegger et al., BRISK (ICCV 2011); Lowe, SIFT (IJCV 2004); Shi and Tomasi, Good features to track (CVPR 1994)"
  tags:
  - visual
  - feature
  - odometry
  - r7_2
  created: '2026-08-31'
  updated: '2026-10-15'
  evidence:
    - kind: unit_test
      reference: "test_r7_visual_odometry.py"
      description: "Implemented, experimental: every detector recovers a known camera path in a ray-cast textured room"
      date: "2026-10-15"
    - kind: benchmark
      reference: "docs/status/evidence/r72-perception-benchmark-2026-10-13/feature-odometry/README.md"
      description: "Recorded drives replayed through all five detectors: in Gazebo small_house ORB at 30 Hz holds 0.54 m RMSE (2.9% drift) over 28.4 m and the live node scores the same; every detector fails in the flat-shaded nav_obstacle world and on Isaac's noisy or MuJoCo's untextured images"
      date: "2026-10-15"
