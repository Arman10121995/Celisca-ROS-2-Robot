- id: humanoid_policy_controller
  version: 1.0.0
  name: Humanoid ONNX Policy Controller
  description: >-
    ONNX velocity-policy locomotion controller for the Berkeley Humanoid Lite;
    runs the vendored upstream checkpoints (75-dim feed-forward observation over
    onboard IMU + joint states, 25 Hz) and publishes Float64MultiArray values
    that an effort_controllers/JointGroupEffortController forwards to the
    joints: on the default effort interface the node converts its position
    targets into joint-space PD efforts (tau = Kp*(q* - q) + Kd*(0 - qdot),
    clamped to +/-20 N.m), because that controller type has no control law of
    its own. Declared honesty limits - command tracking open-loop is
    measurement-sensitive near the drift bound (see R5.3 evidence); the effort
    path is wired and unit-verified but live dispatch-path validation is still
    pending; joint velocities default to zeros until JointState carries them.
  status: integrated
  category: control
  family: learned_policy
  implementation:
    package: robot_lab_adapter
    plugin: HumanoidPolicyController
    language: python
  input_contract:
    required_topics:
    - /joint_states
