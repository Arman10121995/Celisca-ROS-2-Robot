  output_contract:
    provided_topics:
    - /bhl_standing_controller/commands
  required_capabilities:
  - bipedal_locomotion
  supported_robot_classes:
  - humanoid
  parameters:
    command_rate_hz: 25.0
    policy_name: policy_humanoid
    default_num_joints: 22
  source:
    repository: internal
