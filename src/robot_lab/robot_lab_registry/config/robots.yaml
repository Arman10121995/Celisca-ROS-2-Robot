- id: aliengo_z1
  version: "1.0.0"
  name: "Aliengo Z1"
  description: "Quadruped robot from Unitree"
  status: cataloged
  robot_class: legged
  maturity: prototype
  source:
    repository: "https://github.com/unitreerobotics/ros2_alengo"
    license: "MIT"
    maintainer: "Unitree Robotics"
  supported_simulators:
    - gazebo
  locomotion:
    type: quadruped
    dof: 12
    max_velocity: 3.0
    max_acceleration: 5.0
  sensors:
    - type: imu
      name: imu
      frame: imu_link
      topic: /imu
      message_type: sensor_msgs/Imu
  actuators:
    - type: leg
      name: FL_leg
      joint: FL_hip_joint
    - type: leg
      name: FR_leg
      joint: FR_hip_joint
    - type: leg
      name: RL_leg
      joint: RL_hip_joint
    - type: leg
      name: RR_leg
      joint: RR_hip_joint
  command_interfaces:
    - unitree_legged_msgs/LowCmd
  state_interfaces:
    - unitree_legged_msgs/LowState
  capabilities:
    - locomotion
    - walking
  assets:
    xacro: robots/_upstream/Awesome-URDFs/unitree/robots/aliengoZ1_description/xacro/robot.xacro
  tags:
    - imported
    - quadruped
  created: "2026-08-31"
  updated: "2026-08-31"

- id: berkeley_humanoid_lite
  version: "1.0.0"
  name: "Berkeley Humanoid Lite"
  description: "Humanoid robot for research and education"
  status: cataloged
  robot_class: humanoid
  maturity: prototype
  source:
    repository: "https://github.com/berkeley-automation/Humanoid-Benchmark"
    license: "BSD-3-Clause"
    maintainer: "Berkeley Automation Lab"
  supported_simulators:
    - gazebo
  locomotion:
    type: biped
    dof: 20
    max_velocity: 2.0
    max_acceleration: 3.0
  sensors:
    - type: imu
      name: torso_imu
      frame: torso_link
      topic: /imu
      message_type: sensor_msgs/Imu
    - type: force_torque
      name: left_foot_ft
      frame: left_foot
      topic: /left_foot_ft
      message_type: geometry_msgs/WrenchStamped
    - type: force_torque
      name: right_foot_ft
      frame: right_foot
      topic: /right_foot_ft
      message_type: geometry_msgs/WrenchStamped
  capabilities:
    - bipedal_locomotion
    - balancing
  assets:
    urdf: robots/berkeley_humanoid_lite/urdf/berkeley_humanoid_lite.urdf
  tags:
    - imported
    - humanoid
  created: "2026-08-31"
  updated: "2026-08-31"

