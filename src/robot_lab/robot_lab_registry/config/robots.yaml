# Mobile Robots
# ============================================================================

- id: bumperbot
  version: "1.0.0"
  name: "Bumperbot"
  description: "Reference differential-drive mobile robot with LIDAR and IMU"
  status: integrated
  robot_class: mobile
  maturity: simulated
  source:
    repository: "https://github.com/ros2/bumperbot"
    license: "Apache-2.0"
    maintainer: "Robot Lab Team"
  supported_simulators:
    - gazebo
    - ignition
  locomotion:
    type: differential_drive
    dof: 2
    max_velocity: 1.0
    max_acceleration: 2.0
  sensors:
    - type: lidar
      name: base_laser
      frame: base_laser
      topic: /scan
      message_type: sensor_msgs/LaserScan
    - type: imu
      name: imu
      frame: imu_link
      topic: /imu
      message_type: sensor_msgs/Imu
    - type: odometry
      name: odometry
      frame: odom
      topic: /odom
      message_type: nav_msgs/Odometry
  actuators:
    - type: wheel
      name: left_wheel
      joint: left_wheel_joint
    - type: wheel
      name: right_wheel
      joint: right_wheel_joint
  command_interfaces:
    - geometry_msgs/Twist
  state_interfaces:
    - nav_msgs/Odometry
    - sensor_msgs/JointState
  frames:
    - base_link
    - base_laser
    - odom
    - map
  capabilities:
    - navigation
    - localization
    - mapping
    - perception
    - state_estimation
    - sensor_fusion
    - global_planning
    - local_planning
    - control
    - costmap
    - exploration
    - coverage
  dependencies:
    - bumperbot_description
    - bumperbot_firmware
    - bumperbot_localization
    - bumperbot_mapping
    - bumperbot_planning
    - bumperbot_controller
    - bumperbot_navigation
  assets:
    urdf: robots/bumperbot/urdf/bumperbot.urdf.xacro
    xacro: robots/bumperbot/urdf/bumperbot_ros2_control.xacro
    meshes:
      - robots/bumperbot/meshes/bumperbot_base.stl
      - robots/bumperbot/meshes/bumperbot_wheel.stl
  smoke_experiments:
    - bumperbot_simulation
    - bumperbot_navigation
  tags:
    - reference
    - differential
    - 2D
  created: "2026-01-01"
  updated: "2026-08-31"

