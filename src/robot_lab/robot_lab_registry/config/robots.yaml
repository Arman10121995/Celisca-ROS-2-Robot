- id: quadrotor_sitl
  version: "1.0.0"
  name: "Quadrotor SITL"
  description: "Multirotor SITL model for aerial robotics"
  status: cataloged
  robot_class: aerial
  maturity: prototype
  source:
    repository: "https://github.com/ArduPilot/ardupilot"
    license: "GPL-3.0"
    maintainer: "ArduPilot Team"
  supported_simulators:
    - gazebo
    - sitl
  locomotion:
    type: multirotor
    dof: 4
    max_velocity: 10.0
    max_acceleration: 15.0
  sensors:
    - type: imu
      name: imu
      frame: base_link
      topic: /imu
      message_type: sensor_msgs/Imu
    - type: gps
      name: gps
      frame: base_link
      topic: /gps
      message_type: sensor_msgs/NavSatFix
    - type: camera
      name: front_camera
      frame: camera_link
      topic: /camera/image_raw
      message_type: sensor_msgs/Image
  command_interfaces:
    - mavros_msgs/AttitudeTarget
    - mavros_msgs/PositionTarget
  state_interfaces:
    - nav_msgs/Odometry
    - sensor_msgs/Imu
  capabilities:
    - flight
