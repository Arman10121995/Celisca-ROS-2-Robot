# Robot Lab Registry - Robot Catalog
# Version 0.1.0
# This file catalogs all robots available in the platform

# ============================================================================
# Mobile Robots
# ============================================================================

- id: bumperbot
  version: "1.0.0"
  name: "Bumperbot"
  ros_package: robot_lab_bringup
  description: "Reference differential-drive mobile robot with LIDAR and IMU"
  status: integrated
  robot_class: mobile
  maturity: simulated
  source:
    repository: "https://github.com/ros2/bumperbot"
    license: "Apache-2.0"
    maintainer: "Robot Lab Team"
  supported_simulators:
    - gazebo
    - ignition
  locomotion:
    type: differential_drive
    dof: 2
    max_velocity: 1.0
    max_acceleration: 2.0
  sensors:
    - type: lidar
      name: base_laser
      frame: base_laser
      topic: /scan
      message_type: sensor_msgs/LaserScan
    - type: imu
      name: imu
      frame: imu_link
      topic: /imu
      message_type: sensor_msgs/Imu
    - type: odometry
      name: odometry
      frame: odom
      topic: /odom
      message_type: nav_msgs/Odometry
  actuators:
    - type: wheel
      name: left_wheel
      joint: left_wheel_joint
    - type: wheel
      name: right_wheel
      joint: right_wheel_joint
  command_interfaces:
    - geometry_msgs/Twist
  state_interfaces:
    - nav_msgs/Odometry
    - sensor_msgs/JointState
  frames:
    - base_link
    - base_laser
    - odom
    - map
  capabilities:
    - navigation
    - localization
    - mapping
    - perception
    - state_estimation
    - sensor_fusion
    - global_planning
    - local_planning
    - control
    - costmap
    - exploration
    - coverage
  dependencies:
    - robot_lab_bringup
    - robot_lab_description
    - robot_lab_firmware
    - robot_lab_localization
    - robot_lab_mapping
    - robot_lab_planning
    - robot_lab_controller
    - robot_lab_navigation
  assets:
    urdf: robots/bumperbot/urdf/bumperbot.urdf.xacro
    xacro: robots/bumperbot/urdf/bumperbot_ros2_control.xacro
    meshes:
      - robots/bumperbot/meshes/base_link.STL
      - robots/bumperbot/meshes/wheel_left_link.STL
      - robots/bumperbot/meshes/wheel_right_link.STL
  smoke_experiments:
    - bumperbot_smoke_test
  safety_limits:
    max_velocity: 1.0
    max_acceleration: 2.0
    command_rate_hz: 20.0
    obstacle_clearance_m: 0.15
    collision_stop_time_s: 0.5
    max_tilt_rad: 0.0
    restricted_modes:
      - manual_high_velocity
  compute_limits:
    cpu_cores: 2
    memory_mb: 768
    min_real_time_factor: 0.5
    notes: "LIDAR (10 Hz) + IMU + odometry stack; single-controller nav on Humble/arm64"
  tags:
    - reference
    - differential
    - 2D
  created: "2026-01-01"
  updated: "2026-09-05"

- id: assem12ros_29
  version: "1.0.0"
