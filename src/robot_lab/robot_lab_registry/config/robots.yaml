# ============================================================================
# Aerial Robots
# ============================================================================

- id: quadrotor_sitl
  version: "1.0.0"
  name: "Quadrotor SITL"
  ros_package: quadrotor_sitl
  description: "Multirotor ArduPilot SITL profile with first-party mesh-free mechanical model, gz-sim IMU/LIDAR/camera sensor plugins, and MAVLink (AttitudeTarget/PositionTarget) command bridge; qualifies as a simulated, commandable aerial profile (P3.5)"
  status: integrated
  robot_class: aerial
  maturity: simulated
  source:
    repository: "https://github.com/ArduPilot/ardupilot"
    license: "GPL-3.0"
    maintainer: "ArduPilot Team"
  supported_simulators:
    - gazebo
    - sitl
  locomotion:
    type: multirotor
    dof: 4
    max_velocity: 10.0
    max_acceleration: 15.0
  sensors:
    - type: imu
      name: imu
      frame: base_link
      topic: /imu
      message_type: sensor_msgs/Imu
    - type: gps
      name: gps
      frame: base_link
      topic: /gps
      message_type: sensor_msgs/NavSatFix
    - type: camera
      name: front_camera
      frame: camera_link
      topic: /camera/image_raw
      message_type: sensor_msgs/Image
    - type: lidar
      name: downward_lidar
      frame: laser_link
      topic: /scan
      message_type: sensor_msgs/LaserScan
  actuators:
    - type: rotor
      name: front_left_rotor
      joint: front_left_rotor_joint
    - type: rotor
      name: front_right_rotor
      joint: front_right_rotor_joint
    - type: rotor
      name: rear_left_rotor
      joint: rear_left_rotor_joint
    - type: rotor
      name: rear_right_rotor
      joint: rear_right_rotor_joint
  command_interfaces:
    - mavros_msgs/AttitudeTarget
    - mavros_msgs/PositionTarget
  state_interfaces:
    - nav_msgs/Odometry
    - sensor_msgs/Imu
    - sensor_msgs/JointState
  frames:
    - base_link
    - imu_link
    - laser_link
    - camera_link
  capabilities:
    - flight
    - hovering
    - waypoint_navigation
    - navigation
    - control
    - state_estimation
    - sensor_fusion
    - perception
  dependencies:
    - robots
  assets:
    urdf: robots/quadrotor_sitl/urdf/quadrotor_sitl.urdf.xacro
    xacro: robots/quadrotor_sitl/config/quadrotor_controllers.yaml
    meshes: []
  smoke_experiments:
    - quadrotor_sitl_smoke_test
  safety_limits:
    max_velocity: 10.0
    max_acceleration: 15.0
    command_rate_hz: 50.0
    obstacle_clearance_m: 1.0
    collision_stop_time_s: 0.2
    max_tilt_rad: 0.785
    restricted_modes:
      - manual_without_geofence
      - low_battery_autorotate
  compute_limits:
    cpu_cores: 2
    memory_mb: 1024
    min_real_time_factor: 0.5
    notes: "ArduPilot SITL + gz-sim IMU/LIDAR/camera; MAVLink bridge adds latency ~10 ms; SITL is single-threaded per vehicle"
  tags:
    - integrated
    - multirotor
    - aerial
    - ardupilot
    - qualification
  created: "2026-08-31"
  updated: "2026-09-05"


# ============================================================================
# First-party differential-drive mobile robots (P3.2)
# ============================================================================

- id: labbot
  version: "1.0.0"
  name: "Labbot"
  ros_package: robots
  description: "Second first-party differential-drive mobile robot with LIDAR and IMU; primitive-geometry description with no mesh dependencies"
  status: integrated
  robot_class: mobile
  maturity: simulated
  source:
    repository: "internal"
    license: "Apache-2.0"
    maintainer: "Robot Lab Team"
  supported_simulators:
    - gazebo
    - ignition
  locomotion:
    type: differential_drive
    dof: 2
    max_velocity: 0.8
    max_acceleration: 1.5
  sensors:
    - type: lidar
      name: base_laser
      frame: laser_link
      topic: /scan
      message_type: sensor_msgs/LaserScan
    - type: imu
      name: imu
      frame: imu_link
      topic: /imu
      message_type: sensor_msgs/Imu
    - type: odometry
      name: odometry
      frame: odom
      topic: /odom
      message_type: nav_msgs/Odometry
  actuators:
    - type: wheel
      name: left_wheel
      joint: labbot_left_wheel_joint
    - type: wheel
      name: right_wheel
      joint: labbot_right_wheel_joint
  command_interfaces:
    - geometry_msgs/Twist
  state_interfaces:
    - nav_msgs/Odometry
    - sensor_msgs/JointState
  frames:
    - base_link
    - laser_link
    - odom
    - map
  capabilities:
    - navigation
    - localization
    - state_estimation
    - sensor_fusion
    - control
    - costmap
  dependencies:
    - robots
  assets:
    urdf: robots/labbot/urdf/labbot.urdf.xacro
    xacro: robots/labbot/urdf/labbot_ros2_control.xacro
    meshes: []
  smoke_experiments:
    - labbot_smoke_test
  safety_limits:
    max_velocity: 0.8
    max_acceleration: 1.5
    command_rate_hz: 20.0
    obstacle_clearance_m: 0.15
    collision_stop_time_s: 0.5
    max_tilt_rad: 0.0
    restricted_modes:
      - manual_high_velocity
  compute_limits:
    cpu_cores: 2
    memory_mb: 768
    min_real_time_factor: 0.5
    notes: "LIDAR + IMU + odometry stack; primitive geometry keeps load low"
  tags:
    - first-party
    - differential
  created: "2026-09-05"
  updated: "2026-09-05"
