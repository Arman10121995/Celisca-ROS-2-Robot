- id: small_office
  version: "1.0.0"
  name: "Simple Office"
  ros_package: maps
  description: "Small office environment with furniture and obstacles"
  status: integrated
  dimension: 2D
  simulator: gazebo
  world_file: maps/maps/simple_office/worlds/simple_office.world
  occupancy_map: maps/maps/simple_office/maps/simple_office.pgm
  ground_truth_available: true
  dynamics:
    static_obstacles: true
    dynamic_obstacles: false
    max_dynamic_count: 0
  supported_robot_classes:
    - mobile
    - legged
  spawn_zones:
