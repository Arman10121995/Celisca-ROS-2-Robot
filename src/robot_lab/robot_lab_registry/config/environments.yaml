      pose:
        x: 0.0
        y: 0.0
        z: 0.0
      size:
        x: 2.0
        y: 2.0
        z: 1.0
  size:
    x: 15.0
    y: 12.0
    z: 3.0
  source:
    repository: "internal"
    license: "Apache-2.0"
  tags:
    - office
    - indoor
    - 2D
    - navigation
  created: "2026-01-01"
  updated: "2026-08-31"

