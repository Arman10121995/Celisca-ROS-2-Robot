- id: bumperbot_simulation
  version: "1.0.0"
  name: "Bumperbot Simulation Test"
  description: "Basic simulation test for Bumperbot in a simple environment"
  status: integrated
  robot_id: bumperbot
  environment_id: small_office
  simulator: gazebo
  scenario_id: point_to_point_navigation
  algorithm_ids:
    perception: costmap_2d_observation
    localization: amcl
    state_estimation: ekf_localization_node
    sensor_fusion: imu_republisher
    global_planning: navfn_planner
    local_planning: teb_local_planner
    control: simple_controller
  seed: 42
  time_limit: 300.0
  simulation_time_limit: 300.0
  parameters:
    amcl:
      particle_count: 2000
    teb_local_planner:
      max_vel_x: 0.5
      max_vel_theta: 1.0
  metrics:
    success: true
    collisions: true
    path_length: true
    time_to_goal: true
    clearance: true
    energy_consumption: true
  artifacts:
    record_bag: false
    record_logs: true
    record_maps: false
    record_trajectories: true
    record_plots: false
  namespace: ""
  namespaced: false
  source:
    repository: "internal"
    license: "Apache-2.0"
  tags:
    - simulation
    - baseline
    - bumperbot
  created: "2026-08-31"
  updated: "2026-08-31"

