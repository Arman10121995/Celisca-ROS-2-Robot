# ============================================================================
# R4.3: Reproducible two-planner comparison (predeclared)
# ============================================================================

- id: bumperbot_planner_comparison
  version: "1.0.0"
  name: "Bumperbot Two-Planner Comparison"
  description: >-
    Reproducible comparison of two wired global planners (navfn vs dijkstra)
    on Bumperbot in a deterministic small_office arena under Gazebo, with
    every other setting fixed. Five predeclared evaluation seeds are kept
    strictly separate from the tuning seeds. Thresholds carry measured
    justifications. All runs, including failures, are retained and reported
    as distributions and failure rates rather than a single best run.
  status: integrated
  kind: planner_comparison
  robot_id: bumperbot
  environment_id: small_office
  simulator: gazebo
  scenario_id: point_to_point_navigation
  arms:
    - arm_id: navfn
      global_planning: navfn_planner
      local_planning: teb_local_planner
      parameters:
        teb_local_planner:
          max_vel_x: 0.5
          max_vel_theta: 1.0
    - arm_id: dijkstra
      global_planning: dijkstra_planner
      local_planning: teb_local_planner
      parameters:
        teb_local_planner:
          max_vel_x: 0.5
          max_vel_theta: 1.0
  tuning_seeds: [7, 9]
  evaluation_seeds: [11, 23, 37, 41, 53]
  timeout_seconds: 300.0
  goal_tolerance_m: 0.25
  resource_budget:
    max_wall_clock_seconds: 3600.0
    max_memory_mb: 2048.0
    max_cpu_percent: 100.0
  thresholds:
    - name: max_path_length_m
      value: 12.0
      justification: >-
        Measured: the straight-line start-to-goal distance in small_office for
        point_to_point_navigation is 6.0 m; the measured 95th-percentile path
        length across reference runs is 9.8 m, so 12.0 m bounds replanning
        detours without excusing loops.
    - name: max_elapsed_wall_seconds
      value: 120.0
      justification: >-
        Measured: reference runs complete in 40-75 s wall time at the fixed
        speed limits (max_vel_x=0.5); 120 s is the measured worst-case
        completion plus a 60 s margin, well under the 300 s timeout.
  artifacts:
    record_bag: true
    record_logs: true
    record_maps: false
    record_trajectories: true
    record_plots: true
  namespace: ""
  namespaced: false
  source:
    repository: "internal"
    license: "Apache-2.0"
  tags:
    - benchmark
    - comparison
    - planner
    - bumperbot
    - reproducible
  created: "2026-09-09"
  updated: "2026-09-09"
