- id: bumperbot_odometry_localization
  version: "1.0.0"
  name: "Bumperbot Odometry Localization"
  description: "Test odometry-based localization with Bumperbot"
  status: integrated
  robot_id: bumperbot
  environment_id: small_office
  simulator: gazebo
  scenario_id: point_to_point_navigation
  algorithm_ids:
    perception: costmap_2d_observation
    localization: odometry_motion_model
    state_estimation: kalman_filter_1d
    sensor_fusion: imu_republisher
    global_planning: dijkstra_planner
    local_planning: pure_pursuit
    control: pid_controller
  seed: 456
  time_limit: 300.0
  simulation_time_limit: 300.0
  parameters:
    odometry_motion_model:
      motion_model_type: "differential"
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
    pure_pursuit:
      lookahead_distance: 0.5
  metrics:
    success: true
    pose_error: true
    path_length: true
    time_to_goal: true
  artifacts:
    record_bag: false
    record_logs: true
    record_trajectories: true
  namespace: ""
  namespaced: false
  source:
    repository: "internal"
    license: "Apache-2.0"
  tags:
    - localization
    - odometry
    - bumperbot
  created: "2026-08-31"
  updated: "2026-08-31"

