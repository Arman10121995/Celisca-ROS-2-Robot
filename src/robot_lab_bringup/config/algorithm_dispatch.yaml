# How a selected algorithm is APPLIED when a simulation is launched.
#
# The GUI / CLI select one algorithm per category (the categories are the
# canonical registry taxonomy and match the `algorithm_category` of each
# mode step in sim_modes.yaml).  simulated_robot.launch.py reads this file
# and turns every selection into something concrete, so a selection is
# never silently ignored:
#
#   node:   {package, executable, [name], [parameters]}
#           -> started as its own ROS 2 node alongside the mode's stack.
#   plugin: <plugin class string>
#           -> switches the active nav2 plugin of the navigation stack
#              (planner_server / controller_server).
#   stack:  <launch id>
#           -> already provided by a stack the mode starts; recorded so the
#              launch can report *where* the selection takes effect
#              instead of pretending it started something.
#   unavailable: <reason>
#           -> cataloged only; the launch refuses the selection with this
#              reason rather than starting a broken graph.
#
# `requires_mode` (optional, list) restricts an entry to specific modes.
# `not_for_features` (optional, list) refuses the entry for robots that
# declare any of these features in robot_lab_robots/config/robots.yaml, with
# `not_for_reason`; the GUI leaves it out of the robot's choices.
algorithms:
  perception:
    laser_scan_to_pointcloud:
      node: {package: pointcloud_to_laserscan, executable: pointcloud_to_laserscan_node}
    costmap_2d_observation:
      stack: navigation_costmap
    obstacle_detector:
      node: {package: robot_lab_algorithms, executable: obstacle_detector}
    scan_clusterer:
      node: {package: robot_lab_algorithms, executable: scan_clusterer}
    pointcloud_segmenter:
      node: {package: robot_lab_algorithms, executable: pointcloud_segmenter}
    euclidean_clusterer:
      node: {package: robot_lab_algorithms, executable: euclidean_clusterer}
    dbscan_clusterer:
      node: {package: robot_lab_algorithms, executable: dbscan_clusterer}
    ransac_ground_removal:
      node: {package: robot_lab_algorithms, executable: ransac_ground_removal}
    depth_image_to_pointcloud:
      unavailable: "cataloged only - depth_image_proc adapter not integrated"
    camera_calibration:
      unavailable: "cataloged only - offline calibration tool, not a runtime pipeline"
    feature_detection:
      unavailable: "cataloged only - ORB-SLAM3 build carries an OpenCV ABI mismatch"

  localization:
    amcl:
      stack: global_localization
    icp_localization:
      node: {package: robot_lab_algorithms, executable: icp_localization}
    ndt_localization:
      node: {package: robot_lab_algorithms, executable: ndt_localization}
    rgbd_slam_localization:
      node: {package: robot_lab_algorithms, executable: rgbd_slam_localization}
    dead_reckoning:
      node: {package: robot_lab_algorithms, executable: dead_reckoning}
    slam_toolbox:
      stack: slam
    rtabmap_localization:
      stack: rtabmap
    robot_localization_ekf:
      stack: local_localization
    odometry_motion_model:
      node: {package: robot_lab_localization, executable: odometry_motion_model}
    hector_slam:
      unavailable: "cataloged only - hector_slam is not built in this workspace"

  state_estimation:
    ekf_localization_node:
      stack: local_localization
    kalman_filter_1d:
      node: {package: robot_lab_localization, executable: kalman_filter}
    ekf_3d_estimator:
      node: {package: robot_lab_algorithms, executable: ekf_3d_estimator}
    motion_model_estimator:
      node: {package: robot_lab_algorithms, executable: motion_model_estimator}
    pose_graph_estimator:
      node: {package: robot_lab_algorithms, executable: pose_graph_estimator}
    linear_kalman_filter:
      node: {package: robot_lab_algorithms, executable: linear_kalman_filter}
    ukf_estimator:
      node: {package: robot_lab_algorithms, executable: ukf_estimator}
    particle_filter:
      node: {package: robot_lab_algorithms, executable: particle_filter}
    error_state_ekf:
      unavailable: "retired 2026-10-13 - its node filtered noiseless ground truth; the error-state formulation runs for attitude as sensor_fusion attitude_eskf"

  sensor_fusion:
    imu_republisher:
      stack: local_localization
    imu_complementary_filter:
      # The upstream imu_tools Madgwick filter (the id predates the name).
      # Its topics are fixed (imu/data_raw -> imu/data): wire the bridges'
      # IMU in and publish beside the robot_lab filters.
      node:
        package: imu_filter_madgwick
        executable: imu_filter_madgwick_node
        parameters: {use_mag: false, publish_tf: false, world_frame: enu}
        remappings: {imu/data_raw: /imu/out, imu/data: /imu/madgwick_upstream}
    attitude_eskf:
      node: {package: robot_lab_algorithms, executable: attitude_eskf}
    wheel_imu_fusion:
      node: {package: robot_lab_algorithms, executable: wheel_imu_fusion}
    gps_odom_fusion:
      node: {package: robot_lab_algorithms, executable: gps_odom_fusion}
    complementary_imu:
      node: {package: robot_lab_algorithms, executable: complementary_imu}
    mahony_filter:
      node: {package: robot_lab_algorithms, executable: mahony_filter}
    madgwick_filter:
      node: {package: robot_lab_algorithms, executable: madgwick_filter}
    wheel_imu_gnss_ukf:
      node: {package: robot_lab_algorithms, executable: wheel_imu_gnss_ukf}

  global_planning:
    a_star_planner:
      plugin: nav2_smac_planner/SmacPlanner2D
    navfn_planner:
      plugin: nav2_navfn_planner/NavfnPlanner
    hybrid_a_star_planner:
      plugin: nav2_smac_planner/SmacPlannerHybrid
    state_lattice_planner:
      plugin: nav2_smac_planner/SmacPlannerLattice
    dijkstra_planner:
      plugin: nav2_navfn_planner/NavfnPlanner
    rrt_planner:
      # Serves Nav2 ComputePathToPose; the navigator's tree calls it.
      # blocked_at 80 keeps sampled paths ~7 cm inside the inflation band:
      # at the inscribed boundary (99) RRT/RRT* paths grazed walls and the
      # controller's collision check stopped on them (2026-10-12: 8/15, 9/15).
      node: {package: robot_lab_algorithms, executable: nav2_global_planner, parameters: {planner: rrt_planner, blocked_at: 80}}
      serves: {compute_path_to_pose: /robot_lab/compute_path_to_pose}
    voronoi_planner:
      # Serves Nav2 ComputePathToPose; the navigator's tree calls it.
      node: {package: robot_lab_algorithms, executable: nav2_global_planner, parameters: {planner: voronoi_planner, blocked_at: 80}}
      serves: {compute_path_to_pose: /robot_lab/compute_path_to_pose}
    prm_planner:
      # Serves Nav2 ComputePathToPose; the navigator's tree calls it.
      node: {package: robot_lab_algorithms, executable: nav2_global_planner, parameters: {planner: prm_planner, blocked_at: 80}}
      serves: {compute_path_to_pose: /robot_lab/compute_path_to_pose}
    rrt_star_planner:
      # Serves Nav2 ComputePathToPose; the navigator's tree calls it.
      node: {package: robot_lab_algorithms, executable: nav2_global_planner, parameters: {planner: rrt_star_planner, blocked_at: 80}}
      serves: {compute_path_to_pose: /robot_lab/compute_path_to_pose}

  local_planning:
    dwb_local_planner:
      plugin: dwb_core::DWBLocalPlanner
      not_for_features: [car_steering]
      not_for_reason: "its trajectory samples and RotateToGoal critic turn the robot on the spot, which a car cannot do"
    mppi_controller:
      plugin: nav2_mppi_controller::MPPIController
    teb_local_planner:
      unavailable: "cataloged only - nav2_teb_planner is not built in this workspace"
    pure_pursuit:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    pd_motion_planner:
      node: {package: robot_lab_motion, executable: pd_motion_planner.py}
    follow_the_gap:
      # Serves Nav2 FollowPath and publishes /cmd_vel; the navigator's tree calls it.
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: follow_the_gap}}
      serves: {follow_path: /robot_lab/follow_path}
    regulated_pure_pursuit:
      # Serves Nav2 FollowPath and publishes /cmd_vel; the navigator's tree calls it.
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: regulated_pure_pursuit}}
      serves: {follow_path: /robot_lab/follow_path}
    mppi_local_planner:
      unavailable: "placeholder - it scores random velocities by a constant goal distance, with no horizon rollout or obstacle cost; use mppi_controller (Nav2 MPPI)"

  control:
    simple_controller:
      stack: controller
    noisy_controller:
      node: {package: robot_lab_controller, executable: noisy_controller}
      not_for_features: [car_steering]
      not_for_reason: "it commands the two wheels of a differential drive"
    twist_relay:
      node: {package: robot_lab_controller, executable: twist_relay}
    # R7.8 path-tracking controllers (robot_lab_algorithms.tracking_control)
    # on the differential-drive plant.  Each serves Nav2 FollowPath, so in nav
    # mode it replaces the local planner's FollowPath server and drives the
    # robot.  Until 2026-10-13 these ids started single-axis demonstration
    # nodes on side topics (/cmd_vel_lqr, ...) and pid_controller started a
    # pure-pursuit node listening to /a_star/path.
    pid_controller:
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: pid}}
      serves: {follow_path: /robot_lab/follow_path}
      not_for_features: [car_steering]
      not_for_reason: "the tracking model is a differential-drive unicycle (rotates in place)"
    lqr_controller:
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: lqr}}
      serves: {follow_path: /robot_lab/follow_path}
      not_for_features: [car_steering]
      not_for_reason: "the tracking model is a differential-drive unicycle (rotates in place)"
    mpc_controller:
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: linear_mpc}}
      serves: {follow_path: /robot_lab/follow_path}
      not_for_features: [car_steering]
      not_for_reason: "the tracking model is a differential-drive unicycle (rotates in place)"
    nonlinear_mpc:
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: nonlinear_mpc}}
      serves: {follow_path: /robot_lab/follow_path}
      not_for_features: [car_steering]
      not_for_reason: "the tracking model is a differential-drive unicycle (rotates in place)"
    feedback_linearization:
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: feedback_linearization}}
      serves: {follow_path: /robot_lab/follow_path}
      not_for_features: [car_steering]
      not_for_reason: "the tracking model is a differential-drive unicycle (rotates in place)"
    backstepping_controller:
      node: {package: robot_lab_algorithms, executable: nav2_local_planner, parameters: {planner: backstepping}}
      serves: {follow_path: /robot_lab/follow_path}
      not_for_features: [car_steering]
      not_for_reason: "the tracking model is a differential-drive unicycle (rotates in place)"
    joint_effort_commander:
      node: {package: robot_lab_adapter, executable: joint-effort-commander}
    humanoid_standing_controller:
      node: {package: robot_lab_adapter, executable: humanoid-standing-controller}
    humanoid_policy_controller:
      node: {package: robot_lab_adapter, executable: humanoid-policy-controller}
    mavros_offboard_controller:
      node: {package: robot_lab_adapter, executable: mavros-offboard-controller}
    cleaning_controller:
      node: {package: robot_lab_controller, executable: cleaning_controller.py}
    map_coverage_controller:
      node: {package: robot_lab_controller, executable: mapping_controller.py}
