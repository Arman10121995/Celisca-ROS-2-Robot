# Presentation groups retain executable IDs and their individual support gates.
# A variant is not an alias for its parent's controllers or measured missions.
schema_version: 1
robots:
  - id: bhl
    name: Berkeley Humanoid Lite
    preferred: berkeley_humanoid_lite_sim
    members:
      - {id: berkeley_humanoid_lite_sim, label: Simulation model}
      - {id: berkeley_humanoid_lite, label: Full source model}
      - {id: berkeley_humanoid_lite_biped, label: Biped assembly, role: component}
  - id: unitree_a1
    name: Unitree A1
    members:
      - {id: unitree_a1, label: ROS description, registry_ids: [a1]}
      - {id: menagerie_unitree_a1, label: Native MuJoCo description, role: source_alternative}
  - id: unitree_go1
    name: Unitree Go1
    members:
      - {id: unitree_go1, label: ROS description, registry_ids: [go1]}
      - {id: menagerie_unitree_go1, label: Native MuJoCo description, role: source_alternative}
  - id: unitree_go2
    name: Unitree Go2
    members:
