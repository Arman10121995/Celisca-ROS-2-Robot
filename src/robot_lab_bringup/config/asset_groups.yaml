      - {id: asset_r2_description_r2c6_control, label: r2c6 control variant}
      - {id: asset_r2_description_r2c6_dynamics, label: r2c6 dynamics variant}
      - {id: asset_r2_description_r2c6_valve, label: r2c6 valve fixture variant}
      - {id: asset_r2_description_r2c_sim_full_control, label: Simulation full control}
      - {id: asset_r2_description_r2c_sim_full_dynamics, label: Simulation full dynamics}
      - {id: asset_r2_description_r2b, label: Complete r2b}
      - {id: asset_r2_description_r2b_control, label: r2b control variant}
      - {id: asset_r2_description_r2b_dynamics, label: r2b dynamics variant}
      - {id: asset_r2_description_r2c1, label: Complete r2c1}
      - {id: asset_r2_description_r2c1_control, label: r2c1 control variant}
      - {id: asset_r2_description_r2c1_dynamics, label: r2c1 dynamics variant}
      - {id: asset_r2_description_r2_left_forearm, label: Left forearm, role: component, contained_in: asset_r2_description_r2c6}
      - {id: asset_r2_description_r2_left_gripper, label: Left gripper, role: component, contained_in: asset_r2_description_r2c6}
      - {id: asset_r2_description_r2c_sim_legs_control, label: Legs control, role: component, contained_in: asset_r2_description_r2c6}
      - {id: asset_r2_description_r2c_sim_legs_dynamics, label: Legs dynamics, role: component}
      - {id: asset_r2_description_r2c_sim_upperbody_control, label: Upper body control, role: component, contained_in: asset_r2_description_r2c6}
      - {id: asset_r2_description_r2c_sim_upperbody_dynamics, label: Upper body dynamics, role: component}
      - {id: asset_r2_description_r2b_sim_upperbody_control, label: r2b upper body control, role: component}
      - {id: asset_r2_description_r2b_sim_upperbody_dynamics, label: r2b upper body dynamics, role: component}
      - {id: asset_r2_description_r2c5, label: r2c5 upper body, role: component}
      - {id: asset_r2_description_r2c5_control, label: r2c5 upper body control, role: component}
      - {id: asset_r2_description_r2c5_dynamics, label: r2c5 upper body dynamics, role: component}
  - id: nasa_valkyrie
    name: NASA Valkyrie
    preferred: asset_val_description_valkyrie_sim
    notes: Complete simulation model retains the authored arms, hands and legs. Isolated forearms and reduced mass models remain nested source entries.
    members:
      - {id: asset_val_description_valkyrie_sim, label: Complete simulation assembly}
      - {id: asset_val_description_valkyrie_sim_angled_legj1s, label: Angled leg joint variant}
      - {id: asset_val_description_valkyrie_sim_gazebo_sync, label: Gazebo synchronization variant}
      - {id: asset_val_description_valkyrie_A, label: Complete revision A}
      - {id: asset_val_description_valkyrie_B, label: Complete revision B}
      - {id: asset_val_description_valkyrie_C, label: Complete revision C}
      - {id: asset_val_description_valkyrie_D, label: Complete revision D}
      - {id: asset_val_description_forearm_left, label: Forearm (upstream left file uses right-hand link names), role: component, contained_in: asset_val_description_valkyrie_sim}
      - {id: asset_val_description_forearm_right, label: Right forearm, role: component, contained_in: asset_val_description_valkyrie_sim}
      - {id: asset_val_description_valkyrie_A_arm_mass_sims, label: Revision A reduced mass model, role: simplified}
      - {id: asset_val_description_valkyrie_B_arm_mass_sims, label: Revision B reduced mass model, role: simplified}
      - {id: asset_val_description_valkyrie_C_arm_mass_sims, label: Revision C reduced mass model, role: simplified}
      - {id: asset_val_description_valkyrie_D_arm_mass_sims, label: Revision D reduced mass model, role: simplified}
      - {id: asset_val_description_valkyrie_sim_arm_mass_sims, label: Simulation reduced mass model, role: simplified}
