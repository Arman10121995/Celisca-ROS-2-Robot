modes:
  display:
    category: "Perception & Visualization"
    # Ordered list of what the mode runs; every entry may carry its own
    # `algorithm_category`, which is the single selector shown for that step.
    # Steps without `algorithm_category` are fixed pipeline switches.
    steps:
    - id: viewer
      label: "Simulator viewer"
    - id: robot_state
      label: "Robot description"
    - id: visualizer
      label: "Visualizer"
      algorithm_category: perception
      default_algorithm: none
    requires_2d_map: false
    gazebo:
      enabled: false
    controller:
      enabled: false
    joystick:
      enabled: false
    global_localization:
      enabled: false
    local_localization:
      enabled: false
    slam:
      enabled: false
    navigation:
      enabled: false
    rviz:
      enabled: true
      package: robot_lab_description
      path: rviz/display.rviz
    simulators:
    - gazebo
    - isaac
    - pybullet
    - mujoco
  loc:
    category: "Localization"
    steps:
    - id: simulator
      label: "Simulator backend"
    - id: localizer
      label: "Localization algorithm"
      algorithm_category: localization
      default_algorithm: amcl
    - id: state_estimator
      label: "State estimation"
      algorithm_category: state_estimation
      default_algorithm: ekf_localization_node
    - id: sensor_fusion
      label: "Sensor fusion"
      algorithm_category: sensor_fusion
      default_algorithm: wheel_imu_fusion
    requires_2d_map: true
    gazebo:
      enabled: true
    controller:
      enabled: true
      use_simple_controller: 'False'
      use_python: 'False'
    joystick:
      enabled: true
    global_localization:
      enabled: true
    local_localization:
      enabled: true
    slam:
      enabled: false
    navigation:
      enabled: false
    rviz:
      enabled: true
      package: robot_lab_localization
      path: rviz/global_localization.rviz
    simulators:
    - gazebo
    - isaac
    - pybullet
    - mujoco
  slam:
    category: "2D Mapping & Localization"
    steps:
    - id: simulator
      label: "Simulator backend"
    - id: slam_backend
      label: "2D SLAM algorithm"
      algorithm_category: localization
      default_algorithm: slam_toolbox
    - id: state_estimator
      label: "State estimation"
      algorithm_category: state_estimation
      default_algorithm: ekf_localization_node
    - id: sensor_fusion
      label: "Sensor fusion"
      algorithm_category: sensor_fusion
      default_algorithm: wheel_imu_fusion
    - id: map_visualizer
      label: "Map visualizer"
      algorithm_category: perception
      default_algorithm: costmap_2d_observation
    requires_2d_map: false
    gazebo:
      enabled: true
    controller:
      enabled: true
      use_simple_controller: 'False'
      use_python: 'False'
    joystick:
      enabled: true
    global_localization:
      enabled: false
    local_localization:
      enabled: true
    slam:
      enabled: true
    navigation:
      enabled: false
    rviz:
      enabled: true
      package: robot_lab_mapping
      path: rviz/slam.rviz
    simulators:
    - gazebo
    - isaac
    - pybullet
    - mujoco
  3d_slam:
    category: "3D Mapping & Localization"
    steps:
    - id: simulator
      label: "Simulator backend"
    - id: slam_3d_backend
      label: "3D SLAM algorithm"
      algorithm_category: localization
      default_algorithm: rtabmap_localization
    - id: state_estimator
      label: "State estimation"
      algorithm_category: state_estimation
      default_algorithm: ekf_3d_estimator
    - id: map_visualizer
      label: "3D visualizer"
      algorithm_category: perception
      default_algorithm: pointcloud_segmenter
    requires_2d_map: false
    required_features:
    - rgbd_camera
    gazebo:
      enabled: true
    controller:
      enabled: true
      use_simple_controller: 'False'
      use_python: 'False'
    joystick:
      enabled: true
    global_localization:
      enabled: false
    local_localization:
      enabled: true
    slam:
      enabled: false
    rtabmap:
      enabled: true
      rgb_topic: /oakd/rgb/image_raw
      depth_topic: /oakd/depth/image_raw
      camera_info_topic: /oakd/rgb/camera_info
      points_topic: /oakd/points
      odom_topic: /odometry/filtered
      frame_id: base_footprint
      map_frame_id: map
      start_visual_odometry: 'false'
      start_rtabmap_viz: 'false'
    navigation:
      enabled: false
    rviz:
      enabled: true
      package: robot_lab_mapping
      path: rviz/rtabmap.rviz
    simulators:
    - gazebo
    - isaac
    - pybullet
    - mujoco
  nav:
    category: "Navigation"
    steps:
    - id: simulator
      label: "Simulator backend"
    - id: global_planner
      label: "Global planner"
      algorithm_category: global_planning
      default_algorithm: a_star_planner
    - id: local_planner
      label: "Local planner"
      algorithm_category: local_planning
      default_algorithm: dwb_local_planner
    - id: controller
      label: "Motion controller"
      algorithm_category: control
      default_algorithm: simple_controller
    - id: localizer
      label: "Localization algorithm"
      algorithm_category: localization
      default_algorithm: amcl
    - id: state_estimator
      label: "State estimation"
      algorithm_category: state_estimation
      default_algorithm: ekf_localization_node
    - id: sensor_fusion
      label: "Sensor fusion"
      algorithm_category: sensor_fusion
      default_algorithm: wheel_imu_fusion
    requires_2d_map: true
    gazebo:
      enabled: true
    controller:
      enabled: true
      use_simple_controller: 'False'
      use_python: 'False'
    joystick:
      enabled: true
    global_localization:
      enabled: true
    local_localization:
      enabled: true
    slam:
      enabled: false
    navigation:
      enabled: true
    rviz:
      enabled: true
      package: robot_lab_localization
      path: rviz/nav2_default_view.rviz
    simulators:
    - gazebo
    - isaac
    - pybullet
    - mujoco
