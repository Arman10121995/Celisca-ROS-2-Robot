# ros2_control for the rear-steered car in Gazebo.  The ackermann_drive
# node (robot_lab_controller) turns /cmd_vel into these commands with
# robot_lab_utils.drive_kinematics - the same model the PyBullet, MuJoCo and
# Isaac bridges use - and publishes the fixed-axle odometry.
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    car_steering_controller:
      type: position_controllers/JointGroupPositionController

    car_wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

car_steering_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - rear_left_steer_joint
      - rear_right_steer_joint

car_wheel_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
