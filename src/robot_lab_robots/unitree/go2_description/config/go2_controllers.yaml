# P3.3: ros2_control controller configuration for the Unitree Go2 simulated
# profile. The 12 leg joints are effort-commandable via a joint group effort
# controller; joint states are broadcast for state estimation.
controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    go2_group_effort_controller:
      type: forward_command_controller/ForwardCommandController

go2_group_effort_controller:
  ros__parameters:
    front:
      type: effort
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
