    supports_room_vacuum: false

  unitree_g1:
    package: robot_lab_robots
    xacro: unitree/g1_description/g1.urdf
    name: unitree_g1
    supported_modes: [display, loc]
    supports_room_vacuum: false

  unitree_g1_29dof:
    package: robot_lab_robots
    xacro: unitree/g1_description/g1_29dof.urdf
    name: unitree_g1_29dof
    # slam/nav (2026-10-13, experimental): the policy walks on /cmd_vel
    # and leg kinematic odometry (robot_lab_algorithms/leg_odometry)
    # replaces wheel odometry; Nav2 drives with Regulated Pure Pursuit.
    supported_modes: [display, loc, slam, nav]
    default_algorithms:
      local_planning: pure_pursuit
    # rl_sar g1/robomimic locomotion (recurrent LSTM actor, exported with its
    # state as explicit inputs), run by the MuJoCo/Isaac in-step PD bridges in
    # localization; experimental, walking validation pending.
    features: [legged_policy]
    supports_room_vacuum: false

  unitree_go1:
    package: robot_lab_robots
    xacro: unitree/go1_description/xacro/robot.xacro
    name: unitree_go1
    supported_modes: [display, loc]
    supports_room_vacuum: false

  unitree_go2:
    package: robot_lab_robots
    xacro: unitree/go2_description/xacro/go2_sim.xacro
    name: unitree_go2
    # slam/nav (2026-10-13, experimental): the policy walks on /cmd_vel
    # and leg kinematic odometry (robot_lab_algorithms/leg_odometry)
    # replaces wheel odometry; Nav2 drives with Regulated Pure Pursuit.
    supported_modes: [display, loc, slam, nav]
    default_algorithms:
      local_planning: pure_pursuit
    # Provisioned rl_sar policy (robot_lab_adapter/policies/rl_sar), run by
    # the MuJoCo/Isaac in-step PD bridges and, through the description's
    # ros2_control block, a Gazebo effort PD controller in localization; the
    # description carries a head LiDAR (go2_sim.xacro).  Experimental.
    features: [legged_policy, ros2_control, lidar_2d]
    supports_room_vacuum: false
    # Its Gazebo PD controller runs at 500 Hz.  nav_obstacle and nav_maze step
    # physics at 10 ms, so the loop ran at 100 Hz: the Go2 lurched to
    # 0.6-0.7 m/s on a 0.4 m/s command and lost localization, while it walks
    # cleanly in nav_empty (2 ms).  Coarser worlds launch as a capped copy.
    gazebo_max_physics_step_s: 0.002
    # go2_himloco does not turn on the spot in MuJoCo (0.014 rad/s) or
    # Gazebo (0.020), nor in Isaac once it has to hold the turn: a 2 s
    # window read 0.43 rad/s, but held at 0.8 rad/s it turned 0.3 rad/s for
    # the first 4 s and then 0 (also on a friction-1 floor or with the DC
    # motor, 2026-10-19), which failed Isaac missions in the spin recovery.
    # So Nav2 plans forward-only curves of at least this radius (motion_model
    # forward_arc; it turns at about 0.3 m at 0.25 m/s and 0.8 rad/s) and
    # never spins or backs it up.
    no_spin_in_place: [mujoco, gazebo, isaac]
    forward_arc_radius: 0.4

  unitree_go2w:
    package: robot_lab_robots
    xacro: unitree/go2w_description/urdf/go2w_description.urdf
    name: unitree_go2w
    supported_modes: [display, loc]
    # Provisioned rl_sar policy (robot_lab_adapter/policies/rl_sar), run by
    # the MuJoCo/Isaac in-step PD bridges in localization; experimental,
    # walking validation per backend pending.
    features: [legged_policy]
    supports_room_vacuum: false

