robots:
  bumperbot:
    package: robot_lab_robots
    xacro: bumperbot/urdf/bumperbot.urdf.xacro
    name: bumperbot
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base]
    supports_room_vacuum: true

  labbot:
    package: robot_lab_robots
    xacro: labbot/urdf/labbot.urdf.xacro
    name: labbot
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base]
    drive:
      left_wheel_joint: labbot_left_wheel_joint
      right_wheel_joint: labbot_right_wheel_joint
      wheel_radius: 0.06
      wheel_separation: 0.30
    supports_room_vacuum: false

  # R5.5 four-wheel car-like robots (robot_lab_utils/drive_kinematics.py).
  # All four wheels are driven; one axle steers.  base_footprint is the
  # centre of the fixed axle, so /cmd_vel and odometry mean what they mean
  # for a differential drive, but a car cannot turn on the spot: navigation
  # uses planners and controllers that respect its turning radius (0.49 m;
  # the planners are configured for 0.5 m).
  ackermann_car:
    package: robot_lab_robots
    xacro: ackermann_car/urdf/ackermann_car.urdf.xacro
    name: ackermann_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, car_steering]
    # Replace the navigation defaults a car cannot use (DWB turns on the
    # spot); the planner respects its turning radius.
    default_algorithms:
      global_planning: hybrid_a_star_planner
      local_planning: pure_pursuit
    drive:
      type: ackermann
      steer_axle: front
      steering_geometry: ackermann
      left_steer_joint: front_left_steer_joint
      right_steer_joint: front_right_steer_joint
      steered_left_wheel_joint: front_left_wheel_joint
      steered_right_wheel_joint: front_right_wheel_joint
      left_wheel_joint: rear_left_wheel_joint
      right_wheel_joint: rear_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.28
      wheelbase: 0.32
      max_steer: 0.58
      max_steer_rate: 2.0
      max_speed: 1.0
      max_accel: 1.5
    supports_room_vacuum: false

  # "Reverse Ackermann" as rear-wheel steering: the steering axle is at the
  # back and the fixed axle at the front, so the tail swings out in turns
  # (forklift-style).  Ackermann geometry on the rear pair.
  rear_steer_car:
    package: robot_lab_robots
    xacro: ackermann_car/urdf/rear_steer_car.urdf.xacro
    name: rear_steer_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, car_steering]
    # Replace the navigation defaults a car cannot use (DWB turns on the
    # spot); the planner respects its turning radius.
    default_algorithms:
      global_planning: hybrid_a_star_planner
      local_planning: pure_pursuit
    drive:
      type: ackermann
      steer_axle: rear
      steering_geometry: ackermann
      left_steer_joint: rear_left_steer_joint
      right_steer_joint: rear_right_steer_joint
      steered_left_wheel_joint: rear_left_wheel_joint
      steered_right_wheel_joint: rear_right_wheel_joint
      left_wheel_joint: front_left_wheel_joint
      right_wheel_joint: front_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.28
      wheelbase: 0.32
      max_steer: 0.58
      max_steer_rate: 2.0
      max_speed: 1.0
      max_accel: 1.5
    supports_room_vacuum: false

  # "Reverse Ackermann" as anti-Ackermann geometry: the front-steered car
  # with the OUTER wheel steered more (race-car setups).  The wheels scrub
  # at low speed, so its odometry and tracking differ from ackermann_car's:
  # a benchmark contrast, not a better car.
  anti_ackermann_car:
    package: robot_lab_robots
    xacro: ackermann_car/urdf/ackermann_car.urdf.xacro
    name: anti_ackermann_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, car_steering]
    # Replace the navigation defaults a car cannot use (DWB turns on the
    # spot); the planner respects its turning radius.
    default_algorithms:
      global_planning: hybrid_a_star_planner
      local_planning: pure_pursuit
    drive:
      type: ackermann
      steer_axle: front
      steering_geometry: anti_ackermann
      left_steer_joint: front_left_steer_joint
      right_steer_joint: front_right_steer_joint
      steered_left_wheel_joint: front_left_wheel_joint
      steered_right_wheel_joint: front_right_wheel_joint
      left_wheel_joint: rear_left_wheel_joint
      right_wheel_joint: rear_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.28
      wheelbase: 0.32
      max_steer: 0.58
      max_steer_rate: 2.0
      max_speed: 1.0
      max_accel: 1.5
    supports_room_vacuum: false

  berkeley_humanoid_lite:
    package: robot_lab_robots
    xacro: berkeley_humanoid_lite/urdf/berkeley_humanoid_lite.urdf
    name: berkeley_humanoid_lite
    # Localization where it stands (PyBullet/MuJoCo/Isaac cast its scan;
    # the description has no LiDAR, so not in Gazebo).  No slam/nav: it
    # does not walk on /cmd_vel yet.  See robot_lab_utils.mode_capability.
    supported_modes: [display, loc]
    features: []
    supports_room_vacuum: false

  berkeley_humanoid_lite_biped:
    package: robot_lab_robots
    xacro: berkeley_humanoid_lite/urdf/berkeley_humanoid_lite_biped.urdf
    name: berkeley_humanoid_lite_biped
    supported_modes: [display, loc]
    supports_room_vacuum: false

  # R5.3 (2026-09-16): the commandable sim profile of Berkeley Humanoid Lite.
  # bhl_sim.xacro is self-contained: it embeds the gz_ros2_control system
  # plugins and loads berkeley_humanoid_lite/config/bhl_controllers.yaml, so
  # controller_manager + joint_state_broadcaster + bhl_standing_controller and
  # the trunk IMU come up from the spawned description itself. This is the
  # profile that reproduces the verified live-backend bringup through the
  # dispatch path (see docs/status/evidence/r53-bhl-live-backend-2026-09-16/):
  #   ros2 launch robot_lab_bringup simulated_robot.launch.py \
  #     mode:=display map_name:=empty robot_model:=berkeley_humanoid_lite_sim \
  #     simulator:=gazebo gui:=false start_rviz:=false
  # The policy node (humanoid-policy-controller) is dispatched separately via
  # the algorithm registry; the onboard loop still lacks odometry feedback
  # (IMU only), so it is expected to tilt and latch SAFE_STOP on this spawn.
  berkeley_humanoid_lite_sim:
    package: robot_lab_robots
    xacro: berkeley_humanoid_lite/xacro/bhl_sim.xacro
    name: bhl
    # Localization is available through the PyBullet/MuJoCo bridges. The
    # MuJoCo localization launch also starts the ONNX effort policy, so the
    # GUI Drive pad can walk this profile. Mapping/navigation remain gated:
    # there is no qualified LiDAR/camera navigation stack for this biped.
    supported_modes: [display, loc]
    features: [ros2_control]
    supports_room_vacuum: false
    # Controllers declared by the robot description itself (bhl_controllers.yaml
    # is loaded by the gz_ros2_control plugin inside bhl_ros2_control.xacro);
    # bringup only needs to spawn (load/configure/activate) them. Without these
    # spawners the bringup reaches controller_manager but never activates a
    # controller (the gap between the 2026-09-15 adapter-path evidence and the
    # 2026-09-16 live-backend proof).
    controllers:
      - joint_state_broadcaster
      - bhl_standing_controller
    # Onboard sensors (R5.3, 2026-09-17): the trunk IMU the description
    # publishes on the gz topic 'imu', bridged by gazebo.launch.py to
    # /imu/out. The adapter nodes' imu_topic defaults and the policy
    # algorithm's required_topics both say /imu/out - a node defaulting to a
    # topic with no publisher latches SAFE_STOP from the tilt=pi fallback on
    # its first cycle (found in live traces before the spawn).
    sensors:
      - type: imu
        name: trunk_imu
        frame: imu_2
        topic: /imu/out
        message_type: sensor_msgs/msg/Imu
    # Spawn pose (R5.3, 2026-09-18): at the URDF rest pose the foot-sole
    # bottom is +0.0400 m above the base origin, verified three independent
    # ways (docs/status/evidence/r53-bhl-ankle-fix-2026-09-17/
    # sole_height_probe.txt): full-SE(3) URDF forward kinematics of the sole
    # collision box, pybullet's own collision AABB with the base link pinned
    # at the origin (world AABB z [+0.039, +0.081], incl. the ~1 mm contact
    # margin), and `gz sdf -p` on the exact model ign-gazebo spawns (model
    # frame == base link frame; foot box center z=0.06, half-thickness 0.02).
    # The earlier +0.076 m estimate ignored the Rx(90 deg) rotation of the
    # sole box: the collision-origin z offset (0.006) lives in the rotated
    # ankle_roll frame, and the box's 0.04 m "thickness" axis maps to the
    # link-frame y axis, not z - the real sole spans z [0.04, 0.08] with its
    # 0.22 m length along x.
    # The empty map default (z=0.1) therefore drops the soles ~6 cm onto the
    # ground; the earlier z=0.078 dropped them 3.8 cm (a symmetric flat drop,
    # so the live trace shows tilt 0.000 with no tilt transient, but it is an
    # avoidable impact on the ankle gears at every spawn).
    # z=-0.038 places the base origin 38 mm BELOW the ground, so the soles
    # (base+0.040) sit 2 mm above it and settle into contact. The spawn z is
    # NEGATIVE by geometry: sole_z = spawn_z + 0.040 >= 0 requires
    # spawn_z >= -0.040. The earlier +0.078 (and a +0.042 draft) had the
    # sign flipped and dropped the soles 3.8/8.2 cm on every spawn - a
    # symmetric flat drop (tilt stays 0.000 through it) but an avoidable
    # impact on the ankle gears. Plant-verified in pybullet: base at -0.038
    # establishes 8 foot contacts with Fz ~ 157 N (the full weight) within
    # 25 ms; the same robot at +0.042 never touches down.
    # Only the height is robot-specific: x, y and yaw come from the map, as
    # for every other robot (a fixed 0,0 put it inside obstacles and gave
    # AMCL the wrong start).
    spawn:
      z: "-0.038"

