robots:
  lab_snake:
    package: robot_lab_robots
    xacro: lab_snake/urdf/lab_snake.urdf
    name: lab_snake
    type: serpentine
    gait_model: lab_snake/config/gait.yaml
    supported_modes: [display, gait]
    default_mode: gait
    default_map: nav_empty
    supported_simulators: [mujoco]
    features: [source_gait, passive_wheels, articulated_spine]
    drive: {type: gait, max_speed: 0.08, max_accel: 0.06, max_angular_speed: 0.1, max_angular_accel: 0.25}
    implementation_state: experimental
    validation_state: scoped_measurements
    validation_scope: "MuJoCo/nav_empty: 2D/3D acquisition and installed/acquired-map Nav2 endpoints; docs/status/native-forms-2026-10-30.md. Other routes/terrain/backends unqualified."
    notes: "Complete ten-segment snake, nine torque-limited yaw motors and twenty unpowered wheels. Native serpenoid locomotion, rolling encoder/IMU odometry and curvature-constrained Nav2; named nav_empty mapping/goal cases measured. No strafe/pivot, foot IK or body-pose actuation. Terrain and other backends require separate acceptance."
  lab_usv:
    package: robot_lab_robots
    xacro: lab_usv/urdf/lab_usv.urdf.xacro
    name: lab_usv
    type: aquatic
    marine_model: true
    marine_propulsion: surface_twin_thrusters
    spawn_by_map:
      surface_harbor: {z: 0.0}
      marine_tank: {z: 0.0}
      marine_reef: {z: 0.0}
      marine_harbor: {z: 0.0}
      marine_cave: {z: 0.0}
      marine_wreck: {z: 0.0}
    supported_modes: [display, marine]
    default_mode: marine
    default_map: surface_harbor
    supported_simulators: [gazebo]
    features: [marine_dynamics, surface_vessel, native_buoyancy, differential_thrust, rgbd_camera, imu]
    drive: {type: marine, max_speed: 0.4, max_accel: 0.4, max_angular_speed: 0.3, max_angular_accel: 0.4}
    implementation_state: experimental
    validation_state: scoped_measurements
    validation_scope: "Fortress/surface_harbor: RGB-D acquisition and two-goal translation/yaw-rate settling; docs/status/native-forms-2026-10-30.md. Other worlds/routes unqualified."
    notes: "Complete first-party catamaran with two physical propellers and free graded buoyancy/hydrodynamics. Marine Drive, sensor odometry, planar missions and optional RGB-D mapping/reload; no strafe/depth control. Native force watchdog covers stale ROS output. Wave/hardware and broad mission qualification pending."
  lab_tracked: &lab_tracked_profile
    package: robot_lab_robots
    xacro: lab_tracked/robot.urdf
    name: lab_tracked
    type: mobile
    tracked_model: true
    default_algorithms:
      control: native_tracked_controller
      local_planning: pure_pursuit
      global_planning: a_star_planner
      perception: none
      state_estimation: ekf_localization_node
      sensor_fusion: imu_republisher
    algorithm_allowlist_by_mode:
      loc:
        localization:
        - amcl
        state_estimation:
        - ekf_localization_node
        sensor_fusion:
        - imu_republisher
        perception: []
      slam:
        localization:
        - slam_toolbox
        state_estimation:
        - ekf_localization_node
        sensor_fusion:
        - imu_republisher
        perception: []
      3d_slam:
        localization:
        - rtabmap_localization
        state_estimation:
        - ekf_localization_node
        sensor_fusion:
        - imu_republisher
        perception: []
      nav:
        localization:
        - amcl
        state_estimation:
        - ekf_localization_node
        sensor_fusion:
        - imu_republisher
        perception: []
        control:
        - native_tracked_controller
        global_planning:
        - a_star_planner
        - navfn_planner
        - dijkstra_planner
        - hybrid_a_star_planner
        - state_lattice_planner
        local_planning:
        - pure_pursuit
        - dwb_local_planner
        - mppi_controller
    drive: {type: tracked, max_speed: 0.3, max_accel: 0.4, max_angular_speed: 0.5, max_angular_accel: 0.4}
    supported_modes: [display, loc, slam, 3d_slam, nav]
    default_mode: display
    default_map: nav_empty
    supported_simulators: [gazebo]
    drive_in_display: true
    controllers: []
    features: [native_tracks, lidar_2d, rgbd_camera, imu, velocity_base]
    implementation_state: experimental
    validation_state: scoped_measurements
    validation_scope: "Fortress/nav_empty original fixed-flipper source: forward, command-owner loss stop and physical Nav2 endpoint; docs/status/native-workflows-2026-10-27.md. Terrain and broader modes/backends unqualified."
    notes: "Complete Gazebo tracked/flipper source, native contact-surface belts and bounded controls. Native track dead reckoning, sensors and mapping/navigation composition; named nav_empty forward/loss/Nav2 cases measured. Other backends require source-appropriate tracks."
  lab_tracked_articulated:
    <<: *lab_tracked_profile
    name: lab_tracked_articulated
    xacro: lab_tracked_articulated/robot.urdf
    tracked_sdf: lab_tracked_articulated/model.sdf
    articulated_flippers: true
    validation_scope: "Fortress/nav_empty articulated derivative: actual four-joint settling and flat forward travel; docs/status/native-forms-2026-10-30.md. Does not inherit the original variant's Nav2 receipt."
    notes: "Explicit derivative of the retained tracked source: four unlocked ±0.8 rad flippers, native force PID capped at 4 Nm and 0.2 rad/s target slew. Same complete hull/belts/sensors; inspect actual joint feedback in Tracks. Separate terrain and higher-mode acceptance required."
  probot_l:
    package: robot_lab_robots
    xacro: probot_l/urdf/probot_l.urdf.xacro
    name: probot_l
    type: mobile_manipulator
    supported_modes:
    - display
    default_mode: display
    default_map: nav_empty
    supported_simulators:
    - gazebo
    - mujoco
    - pybullet
    - isaac
    drive_in_display: true
    controllers:
    - joint_state_broadcaster
    - molar_base_controller
    - molar_position_controller
    - molar_roller_controller
    features:
    - velocity_base
    - articulated_conveyor
    articulation: &id001
      schema: robot_lab.urdf_articulation.v1
      joints:
        conveyor_lift_joint:
          mode: position
          lower: 0.0
          upper: 0.68
          max_velocity: 0.035
          effort: 2000.0
          kp: 20000.0
          kd: 200.0
        telescope_stage1_joint:
          mode: position
          lower: 0.0
          upper: 0.14
          max_velocity: 0.1
          effort: 250.0
          kp: 4000.0
          kd: 80.0
        transfer_roller_joint:
          mode: velocity
          max_velocity: 8.0
          effort: 2.0
          kp: 0.0
          kd: 0.2
      couplings:
        telescope_stage2_joint:
          joint: telescope_stage1_joint
          multiplier: 1.0
          offset: 0.0
    drive:
      type: diff
      left_wheel_joint: drive_left_joint
      right_wheel_joint: drive_right_joint
      wheel_radius: 0.09
      wheel_separation: 0.573
      max_speed: 0.25
      max_accel: 0.3
      max_angular_speed: 0.5
      max_angular_accel: 0.5
      mujoco_wheel_velocity_gain: 20.0
      mujoco_wheel_armature: 0.1
      wheel_force_limit: 30.0
    notes: 'Experimental simulation-only CAD derivative: differential drive, passive
      casters, lift, coupled telescope and roller. Estimated dynamics. Display/Drive
      controls; sensors, SLAM/Nav2 and cross-backend missions not qualified.'
  molar_hri:
    package: robot_lab_robots
    xacro: molar_hri/urdf/molar_hri.urdf.xacro
    name: molar_hri
    type: mobile_manipulator
    supported_modes:
    - display
    default_mode: display
    default_map: nav_empty
    supported_simulators:
    - gazebo
    - mujoco
    - pybullet
    - isaac
    drive_in_display: true
    controllers:
    - joint_state_broadcaster
    - molar_base_controller
    - molar_position_controller
    - molar_roller_controller
    features:
    - velocity_base
    - articulated_conveyor
    articulation: *id001
    drive:
      type: diff
      left_wheel_joint: drive_left_joint
      right_wheel_joint: drive_right_joint
      wheel_radius: 0.09
      wheel_separation: 0.573
      max_speed: 0.25
      max_accel: 0.3
      max_angular_speed: 0.5
      max_angular_accel: 0.5
      mujoco_wheel_velocity_gain: 20.0
      mujoco_wheel_armature: 0.1
      wheel_force_limit: 30.0
    notes: 'Experimental simulation-only CAD derivative: differential drive, passive
      casters, lift, coupled telescope and roller. Estimated dynamics. Display/Drive
      controls; sensors, SLAM/Nav2 and cross-backend missions not qualified.'
  tethys_auv:
    package: robot_lab_robots
    xacro: tethys_auv/urdf/tethys_auv.urdf
    name: tethys_auv
    type: aquatic
    marine_model: true
    marine_propulsion: propeller_fins
    spawn_by_map:
      marine_tank: {x: -4.0, y: -3.0, z: -1.5, yaw: 0.5}
      marine_reef: {x: -5.0, y: -3.0, z: -1.5, yaw: 0.5}
      surface_harbor: {x: -4.0, y: -3.0, z: -2.0, yaw: 0.0}
    supported_modes: [display, marine]
    default_mode: marine
    default_map: marine_tank
    supported_simulators: [gazebo]
    features: [marine_dynamics]
    drive: {type: marine, max_speed: 0.7, max_accel: 0.4, max_angular_speed: 0.15, max_angular_accel: 0.3}
    notes: "Pinned CC-BY-4.0 native MBARI Tethys AUV/Fortress marine systems with explicit internal trim ballast and bounded propeller/fins. Experimental cruise guidance uses simulator-pose observer and real joints; no strafe/pivot/hover/depth hold at zero flow. Independent estimation, SLAM/navigation and other backends pending."
  hexapod_ros2:
    package: robot_lab_robots
    xacro: hexapod_ros2/urdf/hexapod_ros2.urdf
    name: hexapod_ros2
    type: legged
    gait_model: hexapod_ros2/config/gait.yaml
    supported_modes: [display, gait]
    default_mode: gait
    default_map: nav_empty
    supported_simulators: [mujoco]
    features: [source_gait]
    drive: {type: gait, max_speed: 0.025, max_accel: 0.06, max_angular_speed: 0.12, max_angular_accel: 0.25}
    notes: "Pinned MIT hexapod_ros2 CAD geometry and KDL conversion; experimental authored gait and bounded in-step PD. Actual contact/tilt guards. Independent legged estimation, SLAM/navigation and other backends pending."
  lab_octopod:
    package: robot_lab_robots
    xacro: lab_octopod/urdf/lab_octopod.urdf
    name: lab_octopod
    type: legged
    gait_model: lab_octopod/config/gait.yaml
    supported_modes: [display, gait]
    default_mode: gait
    default_map: nav_empty
    supported_simulators: [mujoco]
    features: [source_gait]
    drive: {type: gait, max_speed: 0.045, max_accel: 0.06, max_angular_speed: 0.15, max_angular_accel: 0.25}
    notes: "Complete authored eight-legged robot with its own geometry and alternating tetrapod/ripple/wave schedules. Experimental physical gait; higher modes/other backends pending."
  lab_centipede:
    package: robot_lab_robots
    xacro: lab_centipede/urdf/lab_centipede.urdf
    name: lab_centipede
    type: legged
    gait_model: lab_centipede/config/gait.yaml
    supported_modes: [display, gait]
    default_mode: gait
    default_map: nav_empty
    supported_simulators: [mujoco]
    features: [source_gait]
    drive: {type: gait, max_speed: 0.045, max_accel: 0.06, max_angular_speed: 0.15, max_angular_accel: 0.25}
    notes: "Complete authored six-segment/twelve-legged robot; five actual spine joints and bounded wave/ripple leg schedules. Experimental physical gait; higher modes/other backends pending."
  lab_rov:
    package: robot_lab_robots
    xacro: lab_rov/urdf/lab_rov.urdf.xacro
    name: lab_rov
    type: aquatic
    marine_model: true
    supported_modes: [display, marine]
    default_mode: marine
    default_map: marine_tank
    supported_simulators: [gazebo]
    features: [marine_dynamics, rgbd_camera]
    drive:
      type: marine
      max_speed: 0.35
      max_accel: 0.4
      max_angular_speed: 0.35
      max_angular_accel: 0.5
    notes: "Authored complete laboratory ROV, eight native thrusters and six-axis allocation, actual buoyancy/drag/added mass/current physics. Experimental Gazebo Fortress control with simulator-pose observer and ideal pressure emulation; independent underwater estimation, sonar/DVL, SLAM/navigation and other backends pending. Display never actuates."
  px4_x500:
    package: robot_lab_adapter
    name: px4_x500
    type: drone
    supported_modes: [display, flight]
    default_mode: flight
    supported_simulators: [gazebo]
    features: [flight_controller]
    drive:
      type: px4
      max_linear_velocity: 1.0
      max_angular_velocity: 1.0
      # Manual GUI motion ramps; FCU command limits above remain unchanged.
      max_speed: 0.5
      max_accel: 1.0
      max_angular_speed: 0.3
      max_angular_accel: 0.5
    notes: "Real upstream X500 with PX4 v1.16.2 and Gazebo Harmonic. Explicit takeoff/land and 3D setpoints. Optional upstream x500_depth RGB-D variant (px4_vehicle:=x500_depth) with experimental RTAB-Map 3D mapping in Flight (aerial_mapping:=rtabmap); no obstacle-aware planner from the map and no mapping qualification."
  bumperbot:
    package: robot_lab_robots
    xacro: bumperbot/urdf/bumperbot.urdf.xacro
    name: bumperbot
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base]
    # Navigation default: Nav2 Regulated Pure Pursuit instead of the mode's
    # DWB (still selectable).  With DWB, Bumperbot stopped at the same
    # furnished celisca_floor_1 wall end as Labbot in MuJoCo and PyBullet
    # (2026-10-12); see the Labbot entry for the recorded cause.
    default_algorithms:
      local_planning: pure_pursuit
    drive_in_display: true
    drive:
      # Differential drive base.
      type: diff
      # Wheel joints as spawned in the URDF.
      left_wheel_joint: wheel_left_joint
      right_wheel_joint: wheel_right_joint
      # Wheel physical parameters.
      wheel_radius: 0.033
      wheel_separation: 0.17
      # MuJoCo velocity servo gains; also used as default when no backend-
      # specific gains are configured.
      mujoco_wheel_velocity_gain: 10.0
      # Match this stronger servo with reflected rotor inertia at the 2 ms
      # physics step (kv*dt/armature <= 1); keep the original 5 Nm force cap.
      mujoco_wheel_armature: 0.02
      # Gazebo default velocity scaling when MuJoCo gains are not applied.
      gazebo_wheel_velocity_gain: 1.0
      # Gazebo rotor inertia counterpart; scaled to match the MuJoCo servo.
      gazebo_wheel_armature: 0.02
      max_speed: 1.0
      max_accel: 2.0
      max_angular_speed: 2.0
      max_angular_accel: 4.0
    supports_room_vacuum: true

  labbot:
    package: robot_lab_robots
    xacro: labbot/urdf/labbot.urdf.xacro
    name: labbot
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base]
    # Navigation default: Nav2 Regulated Pure Pursuit instead of the mode's
    # DWB (still selectable).  On furnished celisca_floor_1 (2026-10-12) DWB
    # stopped three times out of three where the route rounds a wall end:
    # its GoalDist/GoalAlign scores barely change for the slow samples it
    # can reach from rest while BaseObstacle and the oscillation guard rule
    # out the rest, so it rotated in place until the progress checker
    # failed.  RPP (0.046 m from the goal) and MPPI (0.097 m) completed the
    # same route; the Celisca mission matrix uses this default.
    default_algorithms:
      local_planning: pure_pursuit
    drive_in_display: true
    drive:
      left_wheel_joint: labbot_left_wheel_joint
      right_wheel_joint: labbot_right_wheel_joint
      wheel_radius: 0.06
      wheel_separation: 0.30
      mujoco_wheel_velocity_gain: 10.0
      max_speed: 0.8
      max_accel: 1.5
      max_angular_speed: 2.0
      max_angular_accel: 4.0
    supports_room_vacuum: false

  # R5.5 four-wheel car-like robots (robot_lab_utils/drive_kinematics.py).
  # All four wheels are driven; one axle steers.  base_footprint is the
  # centre of the fixed axle, so /cmd_vel and odometry mean what they mean
  # for a differential drive, but a car cannot turn on the spot: navigation
  # uses planners and controllers that respect its turning radius (0.49 m;
  # the planners are configured for 0.5 m).
  ackermann_car:
    package: robot_lab_robots
    xacro: ackermann_car/urdf/ackermann_car.urdf.xacro
    name: ackermann_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, car_steering]
    # Replace the navigation defaults a car cannot use (DWB turns on the
    # spot); the planner respects its turning radius.
    default_algorithms:
      global_planning: hybrid_a_star_planner
      local_planning: pure_pursuit
    drive:
      type: ackermann
      steer_axle: front
      steering_geometry: ackermann
      left_steer_joint: front_left_steer_joint
      right_steer_joint: front_right_steer_joint
      steered_left_wheel_joint: front_left_wheel_joint
      steered_right_wheel_joint: front_right_wheel_joint
      left_wheel_joint: rear_left_wheel_joint
      right_wheel_joint: rear_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.28
      wheelbase: 0.32
      max_steer: 0.58
      max_steer_rate: 2.0
      max_speed: 1.0
      max_accel: 1.5
    supports_room_vacuum: false

  # "Reverse Ackermann" as rear-wheel steering: the steering axle is at the
  # back and the fixed axle at the front, so the tail swings out in turns
  # (forklift-style).  Ackermann geometry on the rear pair.
  rear_steer_car:
    package: robot_lab_robots
    xacro: ackermann_car/urdf/rear_steer_car.urdf.xacro
    name: rear_steer_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, car_steering]
    # Replace the navigation defaults a car cannot use (DWB turns on the
    # spot); the planner respects its turning radius.
    default_algorithms:
      global_planning: hybrid_a_star_planner
      local_planning: pure_pursuit
    drive:
      type: ackermann
      steer_axle: rear
      steering_geometry: ackermann
      left_steer_joint: rear_left_steer_joint
      right_steer_joint: rear_right_steer_joint
      steered_left_wheel_joint: rear_left_wheel_joint
      steered_right_wheel_joint: rear_right_wheel_joint
      left_wheel_joint: front_left_wheel_joint
      right_wheel_joint: front_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.28
      wheelbase: 0.32
      max_steer: 0.58
      max_steer_rate: 2.0
      max_speed: 1.0
      max_accel: 1.5
    supports_room_vacuum: false

  # "Reverse Ackermann" as anti-Ackermann geometry: the front-steered car
  # with the OUTER wheel steered more (race-car setups).  The wheels scrub
  # at low speed, so its odometry and tracking differ from ackermann_car's:
  # a benchmark contrast, not a better car.
  anti_ackermann_car:
    package: robot_lab_robots
    xacro: ackermann_car/urdf/ackermann_car.urdf.xacro
    name: anti_ackermann_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, car_steering]
    # Replace the navigation defaults a car cannot use (DWB turns on the
    # spot); the planner respects its turning radius.
    default_algorithms:
      global_planning: hybrid_a_star_planner
      local_planning: pure_pursuit
    drive:
      type: ackermann
      steer_axle: front
      steering_geometry: anti_ackermann
      left_steer_joint: front_left_steer_joint
      right_steer_joint: front_right_steer_joint
      steered_left_wheel_joint: front_left_wheel_joint
      steered_right_wheel_joint: front_right_wheel_joint
      left_wheel_joint: rear_left_wheel_joint
      right_wheel_joint: rear_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.28
      wheelbase: 0.32
      max_steer: 0.58
      max_steer_rate: 2.0
      max_speed: 1.0
      max_accel: 1.5
    supports_room_vacuum: false

  # Four-wheel steering: every wheel steers, so this base crab-steers and turns
  # on the spot, neither of which a car can do.  The steering pattern is a
  # drive-kinematics choice (ackermann / in_phase / crab / pivot), so one
  # description serves all four - see robot_lab_utils/drive_kinematics.py.
  # Navigation uses the same car-safe planner pair as ackermann_car: the DWB
  # default turns on the spot and a 4WS base in the rolling patterns shares the
  # car's turning radius, so the tight-turn planners are not assumed here.
  four_wheel_steer_car:
    package: robot_lab_robots
    xacro: holonomic_wheels/urdf/four_wheel_steer_car.urdf.xacro
    name: four_wheel_steer_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, holonomic_base]
    default_algorithms:
      global_planning: a_star_planner
      local_planning: dwb_local_planner
    drive:
      type: four_wheel_steer
      steering_mode: ackermann
      in_phase_4ws: false
      front_left_steer_joint: front_left_steer_joint
      front_right_steer_joint: front_right_steer_joint
      rear_left_steer_joint: rear_left_steer_joint
      rear_right_steer_joint: rear_right_steer_joint
      front_left_wheel_joint: front_left_wheel_joint
      front_right_wheel_joint: front_right_wheel_joint
      rear_left_wheel_joint: rear_left_wheel_joint
      rear_right_wheel_joint: rear_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.32
      wheelbase: 0.32
      max_steer: 1.5707963267948966
      max_steer_rate: 2.5
      max_speed: 1.0
      max_accel: 1.5
    supports_room_vacuum: false

  # Physical MIT FUJI passive rollers in an X layout; lateral drive is
  # measured on MuJoCo and PyBullet. Each backend still needs mission evidence.
  mecanum_car:
    package: robot_lab_robots
    xacro: holonomic_wheels/urdf/mecanum_car.urdf.xacro
    name: mecanum_car
    supported_modes: [display, loc, slam, 3d_slam, nav]
    features: [ros2_control, lidar_2d, rgbd_camera, velocity_base, holonomic_base]
    drive:
      type: mecanum
      front_left_wheel_joint: front_left_wheel_joint
      front_right_wheel_joint: front_right_wheel_joint
      rear_left_wheel_joint: rear_left_wheel_joint
      rear_right_wheel_joint: rear_right_wheel_joint
      wheel_radius: 0.05
      wheel_separation: 0.32
      wheelbase: 0.32
      roller_angle: 0.7853981633974483
      max_speed: 1.0
      max_accel: 1.5
      max_angular_speed: 2.0
      max_angular_accel: 4.0
    supports_room_vacuum: false

  berkeley_humanoid_lite:
    package: robot_lab_robots
    xacro: berkeley_humanoid_lite/urdf/berkeley_humanoid_lite.urdf
    name: berkeley_humanoid_lite
    # Localization where it stands (PyBullet/MuJoCo/Isaac cast its scan;
    # the description has no LiDAR, so not in Gazebo).  No slam/nav: it
    # does not walk on /cmd_vel yet.  See robot_lab_utils.mode_capability.
    supported_modes: [display, loc]
    features: []
    supports_room_vacuum: false

  berkeley_humanoid_lite_biped:
    package: robot_lab_robots
    xacro: berkeley_humanoid_lite/urdf/berkeley_humanoid_lite_biped.urdf
    name: berkeley_humanoid_lite_biped
    supported_modes: [display, loc]
    supports_room_vacuum: false

  # R5.3 (2026-09-16): the commandable sim profile of Berkeley Humanoid Lite.
  # bhl_sim.xacro is self-contained: it embeds the gz_ros2_control system
  # plugins and loads berkeley_humanoid_lite/config/bhl_controllers.yaml, so
  # controller_manager + joint_state_broadcaster + bhl_standing_controller and
  # the trunk IMU come up from the spawned description itself. This is the
  # profile that reproduces the verified live-backend bringup through the
  # dispatch path (see docs/status/evidence/r53-bhl-live-backend-2026-09-16/):
  #   ros2 launch robot_lab_bringup simulated_robot.launch.py \
  #     mode:=display map_name:=empty robot_model:=berkeley_humanoid_lite_sim \
  #     simulator:=gazebo gui:=false start_rviz:=false
  # The policy node (humanoid-policy-controller) is dispatched separately via
  # the algorithm registry; the onboard loop still lacks odometry feedback
  # (IMU only), so it is expected to tilt and latch SAFE_STOP on this spawn.
  berkeley_humanoid_lite_sim:
    package: robot_lab_robots
    xacro: berkeley_humanoid_lite/xacro/bhl_sim.xacro
    name: bhl
    # Localization is available through the PyBullet/MuJoCo bridges. The
    # MuJoCo localization launch also starts the ONNX effort policy, so the
    # GUI Drive pad can walk this profile. Mapping/navigation remain gated:
    # there is no qualified LiDAR/camera navigation stack for this biped.
    supported_modes: [display, loc]
    features: [ros2_control]
    supports_room_vacuum: false
    # Controllers declared by the robot description itself (bhl_controllers.yaml
    # is loaded by the gz_ros2_control plugin inside bhl_ros2_control.xacro);
    # bringup only needs to spawn (load/configure/activate) them. Without these
    # spawners the bringup reaches controller_manager but never activates a
    # controller (the gap between the 2026-09-15 adapter-path evidence and the
    # 2026-09-16 live-backend proof).
    controllers:
      - joint_state_broadcaster
      - bhl_standing_controller
    # Onboard sensors (R5.3, 2026-09-17): the trunk IMU the description
    # publishes on the gz topic 'imu', bridged by gazebo.launch.py to
    # /imu/out. The adapter nodes' imu_topic defaults and the policy
    # algorithm's required_topics both say /imu/out - a node defaulting to a
    # topic with no publisher latches SAFE_STOP from the tilt=pi fallback on
    # its first cycle (found in live traces before the spawn).
    sensors:
      - type: imu
        name: trunk_imu
        frame: imu_2
        topic: /imu/out
        message_type: sensor_msgs/msg/Imu
    # Spawn pose (R5.3, 2026-09-18): at the URDF rest pose the foot-sole
    # bottom is +0.0400 m above the base origin, verified three independent
    # ways (docs/status/evidence/r53-bhl-ankle-fix-2026-09-17/
    # sole_height_probe.txt): full-SE(3) URDF forward kinematics of the sole
    # collision box, pybullet's own collision AABB with the base link pinned
    # at the origin (world AABB z [+0.039, +0.081], incl. the ~1 mm contact
    # margin), and `gz sdf -p` on the exact model ign-gazebo spawns (model
    # frame == base link frame; foot box center z=0.06, half-thickness 0.02).
    # The earlier +0.076 m estimate ignored the Rx(90 deg) rotation of the
    # sole box: the collision-origin z offset (0.006) lives in the rotated
    # ankle_roll frame, and the box's 0.04 m "thickness" axis maps to the
    # link-frame y axis, not z - the real sole spans z [0.04, 0.08] with its
    # 0.22 m length along x.
    # The empty map default (z=0.1) therefore drops the soles ~6 cm onto the
    # ground; the earlier z=0.078 dropped them 3.8 cm (a symmetric flat drop,
    # so the live trace shows tilt 0.000 with no tilt transient, but it is an
    # avoidable impact on the ankle gears at every spawn).
    # z=-0.038 places the base origin 38 mm BELOW the ground, so the soles
    # (base+0.040) sit 2 mm above it and settle into contact. The spawn z is
    # NEGATIVE by geometry: sole_z = spawn_z + 0.040 >= 0 requires
    # spawn_z >= -0.040. The earlier +0.078 (and a +0.042 draft) had the
    # sign flipped and dropped the soles 3.8/8.2 cm on every spawn - a
    # symmetric flat drop (tilt stays 0.000 through it) but an avoidable
    # impact on the ankle gears. Plant-verified in pybullet: base at -0.038
    # establishes 8 foot contacts with Fz ~ 157 N (the full weight) within
    # 25 ms; the same robot at +0.042 never touches down.
    # Only the height is robot-specific: x, y and yaw come from the map, as
    # for every other robot (a fixed 0,0 put it inside obstacles and gave
    # AMCL the wrong start).
    spawn:
      z: "-0.038"

  unitree_a1:
    package: robot_lab_robots
    xacro: unitree/a1_description/xacro/robot.xacro
    name: unitree_a1
    # slam/nav (2026-10-13, experimental): the policy walks on /cmd_vel
    # and leg kinematic odometry (robot_lab_algorithms/leg_odometry)
    # replaces wheel odometry; Nav2 drives with Regulated Pure Pursuit.
    supported_modes: [display, loc, slam, nav]
    default_algorithms:
      local_planning: pure_pursuit
    # Provisioned rl_sar policy (robot_lab_adapter/policies/rl_sar), run by
    # the MuJoCo/Isaac in-step PD bridges in localization; experimental,
    # walking validation per backend pending.
    features: [legged_policy]
    supports_room_vacuum: false

  unitree_aliengo:
    package: robot_lab_robots
    xacro: unitree/aliengo_description/xacro/robot.xacro
    name: unitree_aliengo
    supported_modes: [display, loc]
    supports_room_vacuum: false

  unitree_b1:
    package: robot_lab_robots
    xacro: unitree/b1_description/xacro/robot.xacro
    name: unitree_b1
    supported_modes: [display, loc]
    supports_room_vacuum: false

  unitree_b2:
    package: robot_lab_robots
    xacro: unitree/b2_description/xacro/robot.xacro
    name: unitree_b2
    # slam/nav (2026-10-13, experimental): the policy walks on /cmd_vel
    # and leg kinematic odometry (robot_lab_algorithms/leg_odometry)
    # replaces wheel odometry; Nav2 drives with Regulated Pure Pursuit.
    supported_modes: [display, loc, slam, nav]
    default_algorithms:
      local_planning: pure_pursuit
    # Provisioned rl_sar policy (robot_lab_adapter/policies/rl_sar), run by
    # the MuJoCo/Isaac in-step PD bridges in localization; experimental,
    # walking validation per backend pending.
    features: [legged_policy]
    supports_room_vacuum: false
    # b2_robot_lab spins (0.89 rad/s), but its 1.1 m footprint cannot rotate
    # within about 0.6 m of a wall: turning on the spot beside the block at
    # the nav_obstacle start, the first goal aborted in 2 of 3 runs
    # (2026-10-13).  In MuJoCo it plans forward curves instead.
    no_spin_in_place: [mujoco]
    forward_arc_radius: 0.5
    # Isaac (2026-10-16): with implicit PhysX drives B2 ran 0.65-0.68 m/s for
    # a 0.4 m/s command and drifted 0.07-0.18 m/s after the stop (armature
    # and a friction-1 floor alone did not fix it).  Its policy's gains and
    # limits match Isaac Lab's DC motor (torque falling to zero at the joint
    # velocity limit); with that actuator and the training floor (friction
    # 1, no restitution) it walks 0.29 m/s straight and stops dead, as in
    # MuJoCo (0.26).
    isaac_pd_actuator: dc_motor
    isaac_ground_material: {static_friction: 1.0, dynamic_friction: 1.0, restitution: 0.0}

  unitree_b2_mujoco:
    package: robot_lab_robots
    xacro: unitree/b2_description_mujoco/xml/b2_description.urdf
    name: unitree_b2_mujoco
    supported_modes: [display, loc]
    supports_room_vacuum: false

  unitree_b2w:
    package: robot_lab_robots
    xacro: unitree/b2w_description/xacro/robot.xacro
    name: unitree_b2w
