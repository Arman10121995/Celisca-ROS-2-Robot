  quadrotor_sitl:
    package: robot_lab_robots
    xacro: quadrotor_sitl/urdf/quadrotor_sitl.urdf.xacro
    name: quadrotor_sitl
    supported_modes: [display, loc, slam, 3d_slam, nav]
    # 'stands': it rests on its landing gear.  It has no thrust or flight
    # controller here (R5.4), so no velocity_base: slam/nav stay disabled.
    features: [ros2_control, lidar_2d, rgbd_camera, stands]
    supports_room_vacuum: false
    robot_class: aerial
