# ros2_control for the four-wheel-steered base in Gazebo.  The same
# robot_lab_controller node that drives the Ackermann cars turns /cmd_vel into
# these commands with robot_lab_utils.drive_kinematics (FourWheelSteerDrive),
# the model the PyBullet, MuJoCo and Isaac bridges also use, and publishes the
# odometry.  Which steering pattern is used - ackermann, in_phase, crab or
# pivot - is a drive_kinematics choice, so one description and one controller
# file serve all four.
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    four_wheel_steer_controller:
      type: position_controllers/JointGroupPositionController

    four_wheel_wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

four_wheel_steer_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint

four_wheel_wheel_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
