# ros2_control for the mecanum base in Gazebo.  robot_lab_controller turns
# /cmd_vel into these commands with robot_lab_utils.drive_kinematics
# (MecanumDrive), the model the PyBullet, MuJoCo and Isaac bridges also use.
# There are no steering joints: the rollers are fixed to the hubs, and the
# lateral freedom comes from solving all four spins together.
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

mecanum_wheel_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
