# ros2_control controller configuration for the Berkeley Humanoid Lite simulated,
# commandable profile. As of R5.3 (2026-09-17) the standing controller is an
# effort_controllers/JointGroupEffortController (kp=10.0, kd=2.0): the policy
# publishes 22 position targets, and this controller closes a PD-effort loop
# (tau = kp*(q* - q) + kd*(0 - qdot), clamped to the +/-20 N.m effort limits the
# bhl_ros2_control.xacro declares). This matches the upstream BHL policy's
# training control formulation; the earlier position
# forward_command_controller path (ign_ros2_control Kirk position servo,
# c=1000.0, kp=50.0) is superseded. See
# docs/status/evidence/r53-bhl-effort-interface-2026-09-16/README.md.
controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    bhl_standing_controller:
      type: effort_controllers/JointGroupEffortController

bhl_standing_controller:
  ros__parameters:
    kp: 10.0
    kd: 2.0
    joints:
      - leg_left_hip_roll_joint
      - leg_left_hip_yaw_joint
      - leg_left_hip_pitch_joint
      - leg_left_knee_pitch_joint
      - leg_left_ankle_pitch_joint
      - leg_left_ankle_roll_joint
      - leg_right_hip_roll_joint
      - leg_right_hip_yaw_joint
      - leg_right_hip_pitch_joint
      - leg_right_knee_pitch_joint
      - leg_right_ankle_pitch_joint
      - leg_right_ankle_roll_joint
      - arm_left_shoulder_pitch_joint
      - arm_left_shoulder_roll_joint
      - arm_left_shoulder_yaw_joint
      - arm_left_elbow_roll_joint
      - arm_left_elbow_pitch_joint
      - arm_right_shoulder_pitch_joint
      - arm_right_shoulder_roll_joint
      - arm_right_shoulder_yaw_joint
      - arm_right_elbow_roll_joint
      - arm_right_elbow_pitch_joint
