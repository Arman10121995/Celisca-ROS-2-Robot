# ros2_control controller configuration for the Berkeley Humanoid Lite simulated,
# commandable profile. As of R5.3 (2026-09-17) bhl_standing_controller is an
# effort_controllers/JointGroupEffortController, which is a *pure effort
# forwarder*: it writes the values it receives straight to the joints' effort
# command interfaces and declares no kp/kd of its own (verified against the
# installed forward_command_controller base class). The PD-effort loop
# (tau = kp*(q* - q) + kd*(0 - qdot), clamped to the +/-20 N.m limits the
# bhl_ros2_control.xacro declares per joint) is therefore closed by the
# publishing node -- humanoid_policy_controller and humanoid_standing_controller
# convert their position targets into efforts via bhl_balance.pd_effort_command
# before publishing to /bhl_standing_controller/commands. The earlier position
# forward_command_controller path (ign_ros2_control Kirk position servo) is
# superseded. See docs/status/evidence/r53-bhl-effort-interface-2026-09-16/.
controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    bhl_standing_controller:
      type: effort_controllers/JointGroupEffortController

bhl_standing_controller:
  # Pure effort forwarder (see header): no gains here, because this controller
  # type does not implement a control law and would silently ignore them. The
  # PD gains live on the publishing nodes (humanoid_policy_controller:
  # kp_legs/kd_legs/kp_arms/kd_arms, defaults from bhl_balance.STANCE_PD_*).
  ros__parameters:
    joints:
      - leg_left_hip_roll_joint
      - leg_left_hip_yaw_joint
      - leg_left_hip_pitch_joint
      - leg_left_knee_pitch_joint
      - leg_left_ankle_pitch_joint
      - leg_left_ankle_roll_joint
      - leg_right_hip_roll_joint
      - leg_right_hip_yaw_joint
      - leg_right_hip_pitch_joint
      - leg_right_knee_pitch_joint
      - leg_right_ankle_pitch_joint
      - leg_right_ankle_roll_joint
      - arm_left_shoulder_pitch_joint
      - arm_left_shoulder_roll_joint
      - arm_left_shoulder_yaw_joint
      - arm_left_elbow_roll_joint
      - arm_left_elbow_pitch_joint
      - arm_right_shoulder_pitch_joint
      - arm_right_shoulder_roll_joint
      - arm_right_shoulder_yaw_joint
      - arm_right_elbow_roll_joint
      - arm_right_elbow_pitch_joint
