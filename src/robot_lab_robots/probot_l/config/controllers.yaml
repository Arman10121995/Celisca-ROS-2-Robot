controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    molar_base_controller:
      type: diff_drive_controller/DiffDriveController
    molar_position_controller:
      type: position_controllers/JointGroupPositionController
    molar_roller_controller:
      type: velocity_controllers/JointGroupVelocityController
molar_base_controller:
  ros__parameters:
    left_wheel_names:
    - drive_left_joint
    right_wheel_names:
    - drive_right_joint
    wheel_separation: 0.573
    wheel_radius: 0.09
    use_stamped_vel: false
    cmd_vel_timeout: 0.3
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.25
        has_acceleration_limits: true
        max_acceleration: 0.3
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 0.5
        has_acceleration_limits: true
        max_acceleration: 0.5
molar_position_controller:
  ros__parameters:
    joints:
    - conveyor_lift_joint
    - telescope_stage1_joint
    - telescope_stage2_joint
molar_roller_controller:
  ros__parameters:
    joints:
    - transfer_roller_joint
