# Per-robot localization overlay for 'molar_hri' and 'probot_l' (merged over
# ekf.yaml / amcl.yaml).  The description is rooted at base_link (no
# base_footprint).  MOLAR has no simulated IMU (none is invented): the EKF
# fuses wheel odometry only.  Front scanner at laser_link (0.34 m ahead,
# 0.13 m up); its 360-degree simulated scan is an estimate, not the
# certified protective field of the hardware scanner.
ekf_filter_node:
  ros__parameters:
    base_link_frame: base_link
amcl:
  ros__parameters:
    base_frame_id: base_link
    scan_topic: scan
    laser_max_range: 12.0
    # 2026-11-18 (R11 goal B): the estimate was 0.26 m / 4.7 deg off after
    # route A and 0.49 m later, so Nav2 saw the start "in lethal space".
    # With wheel-only odometry (casters) and a front-only scan: update
    # twice as often, more beams, and trust odometry rotation less.
    max_beams: 180
    update_min_d: 0.05
    update_min_a: 0.05
    alpha1: 0.2
    alpha4: 0.2
